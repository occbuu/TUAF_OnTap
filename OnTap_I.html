s":["A. Trâu, bò","B. Ngựa","C. Cừu","D. Dê"],"correct":0,"explanation":"Đáp án đúng là: Trâu, bò Vì: Bệnh liệt dạ cỏ thường thấy ở trâu bò, ở dê và cừu ít mắc hơn","reference":"Mục 1.1"},{"id":173,"text":"Triệu chứng toàn thân bệnh Viêm dạ dày – ruột thể hiện :","answers":["A. Bỏ ăn, mạnh nhanh, run rẩy, vã mồ hôi, thân nhiệt giảm","B. Bỏ ăn, mạnh nhanh, run rẩy, vã mồ hôi, thân nhiệt tăng cao.","C. Bỏ ăn, sốt cao, mạnh nhanh, run rẩy, vã mồ hôi, trước khi chết thân nhiệt giảm.","D. Bỏ ăn , mạnh nhanh , run rẩy , vã mồ hôi , thân nhiệt tăng"],"correct":2,"explanation":"Đáp án đúng là : Bỏ ăn , sốt cao , mạnh nhanh , run rẩy , vã mồ hôi, trước khi chết thân nhiệt giảm. Vì : Khi bệnh trở nên kịch phát con vật bỏ ăn, ủ rũ, sốt cao, mạch nhanh, run rẩy, vã mồ hôi và chết rất nhanh. Trước khi chết thân nhiệt giảm.","reference":"Mục 2."},{"id":174,"text":"Nguyên nhân kế phát g ây bệnh viêm dạ dày – ruột là do:","answers":["A. Tất cả đáp án đều đúng","B. Ký sinh trùng đường máu","C. Vi khuẩn có sẵn ở đường tiêu hoá","D. Các b ệnh về gan"],"correct":3,"explanation":"Đáp án đúng là : Các bệnh về gan Vì : Do kế phát từ bệnh ở gan làm giảm sự tiết mật, ảnh hưởng đến tiêu hoá mỡ.","reference":"Mục 2.2"},{"id":175,"text":"Nguyên nhân gây bệnh viêm dạ dày – ruột thể nguyên phát là do:","answers":["A. Tất cả đáp án đều đúng","B. Cho gia súc ăn thức ăn kém phẩm chất","C. Trúng độc hoá chất","D. Thời tiết thay đổi đột ngột"],"correct":0,"explanation":"Đáp án đúng là : Tất cả đáp án đều đúng Vì : Gia súc bị viêm dạ dày – ruột do tất cả các nguyên nhân như : thức ăn kém phẩm chất , chất độc , hoặc thời tiết thay đổi đột ngột","reference":"Mục 1."},{"id":176,"text":"Nguyên nhân gây bênh nghẽn dạ lá sách là do:","answers":["A. Kế phát từ bệnh ký sinh trùng","B. Tất cả các phương án đã nêu","C. Kế phát từ bệnh truyền nhiễm","D. Dạ múi khế biến vị"],"correct":1,"explanation":"Đáp án đúng là : Tất cả các phương án đã nêu Vì : Tất cả các nguyên nhân nói trên đều dẫn đến gia súc bị nghẽn dạ lá sách .","reference":"Mục 1.2"},{"id":177,"text":"Bệnh viêm dạ dày , theo tính chất viêm có :","answers":["A. Viêm xuất huyết","B. Viêm màng giả","C. Cả ba phương án đã nêu","D. Viêm hoại thư"],"correct":2,"explanation":"Đáp án đúng là : Cả ba phương án đã nêu Vì : Viêm dạ dày xảy ra ở ba thể: viêm xuất huyết, viêm màng giả và viêm hoại thư","reference":"Mục 2.1"},{"id":178,"text":"Gia súc bị bệnh viêm dạ dày – ruột , kiểm tra nước tiểu thấy :","answers":["A. Lượng nước tiểu tăng","B. Có Albumin niệu","C. Tất cả đáp án đều đúng","D. Tỷ trọng nước tiểu giảm"],"correct":1,"explanation":"Đáp án đúng là : Có Albumin niệu Vì : Do khi bị bệnh ảnh hưởng đến chức năng của thận.","reference":"Mục 2."},{"id":179,"text":"Bệnh tích bệnh viêm dạ dày ruột dạng viêm hóa mủ thấy :","answers":["A. Trên vách ruột có các điểm xuất huyết, phân màu đỏ hoặc đen.","B. Trên vách ruột có các vệt xuất huyết","C. Trên bề mặt niêm mạc phủ một lớp màu vàng","D. Trên bề mặt phủ một lớp Fibrin"],"correct":2,"explanation":"Đáp án đúng là : Trên bề mặt niêm mạc phủ một lớp màu vàng Vì : Do nếu viêm hoá mủ thì trên mặt niêm mạc phủ lớp màu vàng","reference":"Mục 2.4"},{"id":180,"text":"Bệnh nghẽn dạ lá sách thường xảy ra :","answers":["A. Thời kỳ giá rét, trâu bò vùng đồng bằng mắc nhiều hơn vùng núi","B. Thời kỳ giá rét, trâu bò vùng núi mắc nhiều hơn vùng đồng bằng","C. Thời kỳ chuyển mùa, trâu bò vùng núi mắc nhiều hơn vùng đồng bằng","D. Thời kỳ chuyển mùa, trâu bò vùng đồng bằng mắc nhiều hơn vùng núi"],"correct":1,"explanation":"Đáp án đúng là : Thời kỳ giá rét , trâu bò vùng núi mắc nhiều hơn vùng đồng bằng Vì : Vì thời kỳ giá rét đặc biệt ở miền núi , thức ăn thô xanh khan hiếm , vật ăn nhiều thức ăn tinh , uống ít nước , nước lạnh nên dễ mặc bệnh hơn .","reference":"Mục 1.1"},{"id":181,"text":"Bệnh tích bệnh viêm dạ dày ruột dạng viêm xuất huyết thấy :","answers":["A. Trên bề mặt phủ một lớp Fibrin","B. Trên vách ruột có các vệt xuất huyết","C. Trên vách ruột có các điểm xuất huyết, phân màu đỏ hoặc đen.","D. Trên bề mặt phủ một lớp màu vàng"],"correct":2,"explanation":"Đáp án đúng là : Trên vách ruột có các điểm xuất huyết, phân màu đỏ hoặc đen. Vì : Do khi mắc viêm ruột thể xuất huyết, trên vách ruột có các điểm hoặc vết xuất huyết, phân màu đỏ hoặc đen.","reference":"Mục 2.4"},{"id":182,"text":"Nghe âm nhu động dạ lá sách của trâu bò ở vị trí :","answers":["A. Ở khe sườn 7 – 8 trên đường ngang","B. Ở khe sườn 5 – 8 trên đường ngang","C. Ở khe sườn 6 – 8 trên đường ngang","D. Ở khe sườn 7 – 9 trên đường ngang"],"correct":3,"explanation":"Đáp án đúng là : Ở khe sườn 7 – 9 trên đường ngang Vì : Vị trí của dạ lá sách từ xương sườn 7 – 9 nằm trên đường kẻ ngang từ khớp vai song song với mặt đất","reference":"Mục 1"},{"id":183,"text":"Khi trâu, bò mới phát bệnh nghẽn dạ lá sách ta phải:","answers":["A. Cho g ia súc ăn cỏ non, uống nhiều nước.","B. Cho gia súc ăn nhiều thức ăn thô","C. Cho gia súc ăn, uống bình thường","D. Cho gia súc nhịn ăn, uống"],"correct":0,"explanation":"Đáp án đúng là : Cho gia súc ăn cỏ non, uống nhiều nước. Vì : Khi mới bị bệnh cần cho gia súc vận động, cho gia súc ăn những thức ăn chứa nhiều nước hay cỏ non để dễ tiêu hóa hơn","reference":"Mục 1.7"},{"id":184,"text":"Thời gian đầu trâu , bò mắc bệnh nghẽn dạ lá sách có biểu hiện :","answers":["A. Ngừng nhai lại, có hiện tượng bội thực","B. Tăng nhai lại, uể oải, thỉnh thoảng bị chướng hơi nhẹ","C. Giảm nhai lại, uể oải, thỉnh thoảng bị bội thực hoặc chướng hơi nhẹ","D. Giảm nhai lại, uể oải, thỉnh thoảng bị chướng hơi nhẹ"],"correct":2,"explanation":"Đáp án đúng là : Giảm nhai lại , uể oải, thỉnh thoảng bị bội thực hoặc chướng hơi nhẹ Vì : Thời gian đầu con vật giảm ăn, kém nhai lại, uể oải, thỉnh thoảng bị bội thực hoặc chướng hơi nhẹ.","reference":"Mục 1."},{"id":185,"text":"Dùng các thuốc  sau làm nhão thức ăn trong dạ lá sách, đối với trâu bò mắc bệnh nghẽn dạ lá sách:","answers":["A. Magie sunfat","B. Strychnin sunfat","C. Pilocarpin","D. Tất cả đáp án đều đúng"],"correct":0,"explanation":"Đáp án đúng là : Magie sunfat Vì : Vì Magie sunfat có tác dụng nhuận tràng","reference":"Mục 1.7"},{"id":186,"text":"Chẩn đoán bệnh viêm dạ dày – ruột, cần phân biệt với bệnh:","answers":["A. Viêm ruột thể cata cấp tính","B. Suy tim cấp","C. Viêm ngoại tâm mạc","D. Tất cả đáp án đều đúng"],"correct":3,"explanation":"Đáp án đúng là : Tất cả đáp án đều đúng Vì : Do những bệnh này có những triệu chứng giống và khác nhau nên cần chẩn đoán phân biệt","reference":"Mục 2.7"},{"id":187,"text":"Bệnh tích bệnh viêm dạ dày ruột dạng viêm màng giả thấy :","answers":["A. Trên bề mặt niêm mạc phủ một lớp màu vàng","B. Trên vách ruột có các điểm xuất huyết, phân màu đỏ hoặc đen.","C. Trên vách ruột có các vệt xuất huyết","D. Trên bề mặt phủ một lớp Fibrin"],"correct":3,"explanation":"Đáp án đúng là : Trên bề mặt phủ một lớp Fibrin Vì : Nếu viêm thể màng giả thì trên bề mặt ruột phủ lớp fibrin.","reference":"Mục 2.4"},{"id":188,"text":"Gia súc mắc bệnh Viêm dạ dày – ruột giai đoạn cuối có biểu hiện :","answers":["A. Ỉa chảy, phân màu đen, thối khắm, lẫn máu, màng giả, số lần đi ỉa nhiều.","B. Táo bón xen kẽ tiêu chảy , phân lẫn máu , màng giả, số lần đi ỉa ít.","C. Ỉa chảy, phân tanh, lẫn máu, màng giả.","D. Ỉa c hảy, phân màu đen, lẫn máu, màng giả,  phân tự động chảy ra ngoài."],"correct":3,"explanation":"Đáp án đúng là : Ỉa chảy , phân màu đen , lẫn máu , màng giả, phân tự động chảy ra ngoài. Vì : Ở giai đoạn cuối , bệnh nặng , cơ vòng hậu môn liệt","reference":"Mục 2."},{"id":189,"text":"Bổ sung nước và chất điện giải cho gia súc mắc bệnh viêm dạ dày – ruột, ta dùng","answers":["A. Nước muối ưu trương, đường ưu trương","B. Nước muối ưu trương, đường đẳng trương","C. Nước m uối đẳng trương, đường đẳng trương","D. Nước muối  đẳng trương, đường ưu trương"],"correct":2,"explanation":"Đáp án đúng là : Nước muối đẳng trương , đường đẳng trương Vì : Khi cơ thể bị mất nước thông thường thì cần phải sử dụng dung dịch muối đẳng trương, đường đẳng trương","reference":"Mục 2.8"},{"id":190,"text":"Bệnh tích của bệnh Viêm dạ dày – ruột thể hoại thư có biểu hiện","answers":["A. Tất cả đáp án đều đúng","B. Niêm mạc dạ dày – ruột phủ lớp màu vàng","C. Chất chứa trong ruột nát như bùn đen","D. Niêm mạc ruột bong róc từng mảng dài, màu trắng xanh"],"correct":0,"explanation":"Đáp án đúng là : Tất cả đáp án đều đúng Vì : Nếu viêm hoá mủ thì trên mặt niêm mạc phủ lớp màu vàng. Trên lâm sàng gia súc bị viêm dạ dày và ruột, niêm mạc ruột bị tróc ra từng mảng dài, màu trắng xanh, dính, nhày, theo phân ra ngoài. Ở trâu, bò dạ múi khế bị xuất huyết nặng, xuất huyết dọc theo đường ruột. Chất chứa trong ruột nát như bùn đen.","reference":"Mục 2.4"},{"id":191,"text":"Trâu bò bị nghẽn dạ lá sách, lúc đầu :","answers":["A. Tất cả đáp án đều đúng","B. Thân n hiệt, tần số hô hấp, mạch đập thường bình thường","C. Thân nhiệt bình thường, tần số hô hấp tăng","D. Mạch nhanh, tim đập nhanh"],"correct":1,"explanation":"Đáp án đúng là : Thân nhiệt , tần số hô hấp, mạch đập thường bình thường Vì : Những ngày đầu thân nhiệt , tần số hô hấp, mạch đập bình thường do giai đoạn đầu chưa có tác động nhiều đến cơ thể","reference":"Mục 1.4"},{"id":192,"text":"Gia súc bị bệnh  viêm dạ dày – ruột, kiểm tra máu thấy","answers":["A. Bạch cầu đơn nhân tăng","B. Hemoglobin giảm","C. Hồng cầu giảm","D. Bạch cầu đa nhân trung tính tăng"],"correct":3,"explanation":"Đáp án đúng là : Bạch cầu đa nhân trung tính tăng Vì : Do khi bị viêm sẽ làm cho bạch cầu tăng , trong đó có đa nhân trung tính .","reference":"Mục 2."},{"id":193,"text":"Trâu bò bị nghẽn dạ lá sách , lúc đầu quan sát phân thấy :","answers":["A. Phân bình thường , không thay đổi","B. Phân t áo bón , có lẫn các mảnh thức ăn chưa tiêu hóa","C. Màu đen , thối khắm","D. Phân lẫn máu , tanh khắm"],"correct":1,"explanation":"Đáp án đúng là : Phân táo bón , có lẫn các mảnh thức ăn chưa tiêu hóa Vì : Triệu chứng biểu hiện sớm nhất là gia súc đi táo, trong phân có những mảnh thức ăn chưa tiêu hoá.","reference":"Mục 1"},{"id":194,"text":"Triệu chứng của bệnh nghẽn dạ lá sách thời gian đầu thể hiện :","answers":["A. Tim, m ạch đập bình thường","B. Tất cả đáp án đều đúng","C. Tần số hô hấp tăng","D. Thân nhiệt tăng"],"correct":0,"explanation":"Đáp án đúng là : Tim, mạch đập bình thường Vì : Những ngày đầu thân nhiệt , tần số hô hấp, mạch đập bình thường do giai đoạn đầu chưa có tác động nhiều đến cơ th ể","reference":"Mục 1."},{"id":195,"text":"Để điều trị viêm dạ dày ruột cho chó nặng 20 kg thì có thể dùng kháng sinh Gentamycin với liều","answers":["A. 200 mg","B. 150 mg","C. 50 mg","D. 100 mg"],"correct":0,"explanation":"Đáp án đúng là : 200 mg Vì : Liều dùng của Gentamycin cho chó là 10 mg/ kg TT","reference":"Mục 2.8"},{"id":196,"text":"Trâu bò bị nghẽn dạ lá sách chọc dò thấy kim chuyển động :","answers":["A. Lúc chuyển động , lúc không","B. Theo hình con lắc","C. Không chuyển động","D. Theo hình số tám"],"correct":2,"explanation":"Đáp án đúng là : Không chuyển động Vì : Vì Khi bị nghẽn dạ lá sách , nhu động dạ lá sách giảm và ngừng hẳn, do đó khi chọc kim vào","reference":"Mục 1.5"},{"id":197,"text":"Thuốc dùng bảo vệ niêm mạc ruột trong bệnh viêm dạ dày – ruột là :","answers":["A. Glucoza","B. Tanin","C. Tanin, Na2SO4, Glucoza","D. Na2SO4"],"correct":1,"explanation":"Đáp án đúng là : Tanin Vì : Vì tanin có khă năng làm se niêm mạc đường ruột , tạo thành 1 lớp màng bảo vệ niêm mạc ruột","reference":"Mục 2.8"},{"id":198,"text":"Bệnh cảm nắng có thể ảnh hưởng trực tiếp đến bộ phận nào của hệ thần kinh gia súc?","answers":["A. Đồi thị","B. Tủy sống","C. Hạch giao cảm","D. Hành tủy và màng não"],"correct":3,"explanation":"Đáp án đúng là: Hành tủy và màng não Vì: Ánh nắng chiếu trực tiếp vào đỉnh đầu gây xung huyết và tổn thương hành tủy, vỏ não, làm rối loạn các chức năng thần kinh.","reference":"Mục 1.4"},{"id":199,"text":"Khi gia súc bị cảm nắng, nên làm gì ngay lập tức?","answers":["A. Dùng nước lạnh dội vào toàn thân","B. Đưa vào nơi mát, giảm nhiệt từ từ","C. Cho uống nước đá lạnh ngay lập tức","D. Tiếp tục cho làm việc bình thường"],"correct":1,"explanation":"Đáp án đúng là: Đưa vào nơi mát, giảm nhiệt từ từ Vì: Gia súc cần được đưa vào nơi râm mát và làm mát từ từ để tránh sốc nhiệt.","reference":"Mục 1.6"},{"id":200,"text":"Khi phòng bệnh cảm nóng, tại sao nên hạn chế vận chuyển gia súc vào ban ngày?","answers":["A. Giảm nguy cơ chấn thương khi di chuyển","B. Gia súc dễ bị hoảng loạn khi vận chuyển ban ngày","C. Giảm nguy cơ mất nước và sốc nhiệt","D. Tránh tiếp xúc với vi khuẩn từ môi trường"],"correct":2,"explanation":"Đáp án đúng là: Giảm nguy cơ mất nước và sốc nhiệt Vì: Do khi vận chuyển ban ngày, thời tiết nắng nóng sẽ làm tăng nguy cơ mắc bệnh","reference":"Mục 2.8"},{"id":201,"text":"Gia súc dễ bị cảm nóng khi?","answers":["A. Ăn phải thức ăn ôi thiu","B. Tiếp xúc với không khí lạnh đột ngột","C. Làm việc dưới trời nắng gắt","D. Vận chuyển trong điều kiện chật chội, nóng bức"],"correct":3,"explanation":"Đáp án đúng là: Vận chuyển trong điều kiện chật chội, nóng bức Vì: Khi vận chuyển gia súc trong điều kiện chật chội, nóng bức sẽ làm cho thân nhiệt tăng lên, nhưng lại khó thoát nhiệt","reference":"Mục 2.2"},{"id":202,"text":"Một sai lầm thường gặp trong xử lý gia súc bị cảm nóng là gì?","answers":["A. Truyền dịch quá nhanh","B. Để gia súc nghỉ ngơi trong chuồng kín","C. Cho uống nước ngay sau khi phát hiện bệnh","D. Cho uống nước ngay sau khi phát hiện bệnh và truyền dịch quá nhanh"],"correct":1,"explanation":"Đáp án đúng là: Để gia súc nghỉ ngơi trong chuồng kín Vì: Nhốt gia súc trong chuồng kín làm tăng nguy cơ tích nhiệt, cần để nơi thoáng mát để giảm thân nhiệt.","reference":"Mục 2.7"},{"id":203,"text":"Nguyên tắc điều trị bệnh cảm nóng là:","answers":["A. Để gia súc yên tĩnh, tăng cường thoát nhiệt, đề phòng liệt trung khu thần kinh","B. Để gia súc đầu thấp, đuôi tcao, hỗ trợ hô hấp, tăng cường giải độc","C. Đưa gia súc về nơi có bóng râm, tăng cường hô hấp, đề phòng bại liệt","D. Đưa gia súc về nơi râm mát, tăng cường giải độc, đề phòng liệt trung khu thần kinh."],"correct":0,"explanation":"Đáp án đúng là: Để gia súc yên tĩnh, tăng cường thoát nhiệt, đề phòng liệt trung khu thần kinh Vì: Để gia súc yên tĩnh, tăng cường thoát nhiệt, đề phòng liệt trung khu thần kinh","reference":"Mục 2.7"},{"id":204,"text":"Gia súc bị cảm nắng, nếu bị sung huyết não nặng ta phải:","answers":["A. Trích huyết ở tĩnh mạch đuôi","B. Trích huyết ở não","C. Trích huyết ở tĩnh mạch đuôi","D. Trích huyết ở tĩnh mạch cổ"],"correct":3,"explanation":"Đáp án đúng là: Trích huyết ở tĩnh mạch cổ Vì: Nếu não bị xung huyết nặng thì phải trích máu ở tĩnh mạch cổ để giảm xung huyết não.","reference":"Mục 1.6"},{"id":205,"text":"Để phòng bệnh cảm nóng, nên áp dụng biện pháp nào?","answers":["A. Cho gia súc uống nước mát đầy đủ","B. Không cần biện pháp phòng bệnh","C. Tăng khẩu phẩn ăn","D. Nhốt trong chuồng để tránh nóng"],"correct":0,"explanation":"Đáp án đúng là: Cho gia súc uống nước mát đầy đủ Vì: Việc cung cấp đầy đủ nước mát giúp gia súc điều hòa thân nhiệt và tránh mất nước.","reference":"Mục 2.8"},{"id":206,"text":"Bệnh cảm nắng thường xảy ra vào thời điểm nào trong ngày?","answers":["A. Buổi chiều (14 – 16h)","B. Buổi tối","C. Sáng sớm","D. Buổi trưa (11 – 12 giờ)"],"correct":3,"explanation":"Đáp án đúng là: Buổi trưa (11 – 12 giờ) Vì: Bệnh cảm nắng thường xảy ra vào buổi trưa khi ánh nắng mặt trời chiếu trực tiếp xuống mạnh nhất, làm tăng nhiệt độ vùng đầu của gia súc.","reference":"Mục 1.1"},{"id":207,"text":"Nguyên nhân chính gây tử vong ở gia súc bị cảm nóng nặng là gì?","answers":["A. Xuất huyết não","B. Nhiễm trùng huyết","C. Liệt tim và phù phổi","D. Mất nước nghiêm trọng"],"correct":2,"explanation":"Đáp án đúng là: Liệt tim và phù phổi Vì: Bệnh cảm nóng có thể gây suy tim, phù phổi do rối loạn tuần hoàn và mất khả năng điều hòa thân nhiệt.","reference":"Mục 2.6"},{"id":208,"text":"Khi điều trị bệnh cảm nóng, có thể sử dụng thuốc nào?","answers":["A. Tất cả các phương án đã nêu","B. Vitamin C","C. Paracetamol","D. Glucose truyền tĩnh mạch"],"correct":0,"explanation":"Đáp án đúng là: Tất cả các phương án đã nêu Vì: Vitamin C giúp tăng sức đề kháng, Paracetamol giúp hạ nhiệt, Glucose giúp bù nước và điện giải.","reference":"Mục 2.7"},{"id":209,"text":"Một dấu hiệu nguy hiểm trong giai đoạn cuối của bệnh cảm nắng là gì?","answers":["A. Tăng phản xạ gân xương","B. Tiểu tiện nhiều hơn bình thường","C. Run cơ nhẹ, có thể kiểm soát","D. Đồng tử mắt lúc đầu mở rộng, sau thu hẹp lại, mất phản xạ thần kinh"],"correct":3,"explanation":"Đáp án đúng là: Đồng tử mắt lúc đầu mở rộng, sau thu hẹp lại, mất phản xạ thần kinh Vì: Khi bệnh tiến triển nặng, gia súc có thể bị đồng tử mắt lúc đầu mở rộng, sau thu hẹp lại, mất phản xạ thần kinh","reference":"Mục 1.4"},{"id":210,"text":"Sử dụng Cafein natribenzoat 20% để tăng cường hô hấp cho bò 200 kg bị cảm nắng:","answers":["A. 5 – 8 ml/ con","B. 2 – 5 ml/ con","C. 5 – 10 ml/ con","D. 10 – 20 ml/ con"],"correct":3,"explanation":"Đáp án đúng là: 10 – 20 ml/ con Vì: Liều dùng cho bò là 1 ml/ 10 – 20 kg TT","reference":"Mục 1.6"},{"id":211,"text":"Một trong những triệu chứng của bệnh cảm nóng là gì?","answers":["A. Con vật vã mồ hôi","B. Thân nhiệt hạ đột ngột","C. Toàn thân lạnh","D. Đồng tử mắt giãn rộng, con vật co giật, hôn mê"],"correct":3,"explanation":"Đáp án đúng là: Đồng tử mắt giãn rộng, con vật co giật, hôn mê Vì: Khi bị cảm nóng nặng, gia súc có thể bị co giật, hôn mê và có nguy cơ tử vong nhanh chóng.","reference":"Mục 2.4"},{"id":212,"text":"Một trong những triệu chứng đầu tiên của bệnh cảm nắng là gì?","answers":["A. Hạ nhiệt độ cơ thể","B. Sút cân nhanh","C. Thở nhanh, vã mồ hôi","D. Mất phản xạ thần kinh ngay lập tức"],"correct":2,"explanation":"Đáp án đúng là: Thở nhanh, vã mồ hôi Vì: Khi bị cảm nắng, gia súc thở nhanh, vã mồ hôi do cơ thể cố gắng hạ nhiệt.","reference":"Mục 1.4"},{"id":213,"text":"Nguyên nhân gây bệnh cảm nắng là do:","answers":["A. Nhốt hoặc vận chuyển gia súc dưới trời nắng to, không có mái che","B. Do gia súc quá gầy, hoặc lông quá dầy","C. Nhốt hoặc vận chuyển gia súc dưới trời oi bức","D. Tất cả phương án đã nêu"],"correct":0,"explanation":"Đáp án đúng là: Nhốt hoặc vận chuyển gia súc dưới trời nắng to, không có mái che Vì: Khi bị ánh nắng chiếu trực tiếp vào đỉnh đầu làm cho sọ não và hành tuỷ nóng lên, não và màng não bị xung huyết gây trở ngại đến cơ năng của hệ thần kinh","reference":"Mục 1.1"},{"id":214,"text":"Khi xử lý gia súc bị cảm nắng, tại sao không nên dùng nước đá để làm mát ngay?","answers":["A. Làm tổn thương mô mềm do nhiệt độ thấp","B. Làm mất nước nhanh chóng hơn","C. Có thể gây tê liệt cơ hô hấp","D. Gây co mạch đột ngột, làm giảm hiệu quả hạ nhiệt"],"correct":3,"explanation":"Đáp án đúng là: Gây co mạch đột ngột, làm giảm hiệu quả hạ nhiệt Vì: Nước đá có thể gây co mạch đột ngột, làm chậm quá trình tản nhiệt và ảnh hưởng đến tuần hoàn máu.","reference":"Mục 1.6"},{"id":215,"text":"Bệnh cảm nóng thường xảy ra do yếu tố nào?","answers":["A. Gia súc bị vi khuẩn xâm nhập","B. Gia súc ăn quá nhiều thức ăn thô","C. Môi trường quá nóng, ẩm làm giảm khả năng thải nhiệt của cơ thể","D. Môi trường làm việc quá khô"],"correct":2,"explanation":"Đáp án đúng là: Môi trường quá nóng, ẩm làm giảm khả năng thải nhiệt của cơ thể Vì: Bệnh cảm nóng xảy ra khi gia súc không thể thải nhiệt do nhiệt độ môi trường có độ ấm quá cao","reference":"Mục 2.1"},{"id":216,"text":"Khi điều trị cảm nắng, có thể sử dụng thuốc nào để hỗ trợ hệ thần kinh?","answers":["A. Levamizole","B. Kanamycin","C. Cafein natribenzoat","D. Aspirin"],"correct":2,"explanation":"Đáp án đúng là: Cafein natribenzoat Vì: Cafein natribenzoat giúp kích thích thần kinh và điều hòa hoạt động tim mạch.","reference":"Mục 1.6"},{"id":217,"text":"Nguyên nhân chủ yếu gây bệnh cảm nắng là gì?","answers":["A. Do chuồng trại ẩm ướt","B. Do gia súc ăn thức ăn ôi thiu","C. Do ánh nắng chiếu trực tiếp vào đỉnh đầu gia súc","D. Do vi khuẩn xâm nhập"],"correct":2,"explanation":"Đáp án đúng là: Do ánh nắng chiếu trực tiếp vào đỉnh đầu gia súc Vì: Ánh nắng chiếu trực tiếp vào đỉnh đầu gây tăng nhiệt độ não và xung huyết màng não, làm ảnh hưởng đến hệ thần kinh của vật nuôi.","reference":"Mục 1.2"},{"id":218,"text":"Khi gia súc bị cảm nắng, tại sao việc truyền dung dịch Glucose 5% lại quan trọng?","answers":["A. Giúp hạ sốt nhanh hơn so với các phương pháp khác","B. Hỗ trợ quá trình tái tạo tế bào não bị tổn thương","C. Cung cấp năng lượng tức thời cho tế bào thần kinh","D. Giúp hạ sốt nhanh hơn so với các phương pháp khác, cung cấp năng lượng tức thời cho tế bào thần kinh"],"correct":3,"explanation":"Đáp án đúng là: Giúp hạ sốt nhanh hơn so với các phương pháp khác, cung cấp năng lượng tức thời cho tế bào thần kinh Vì: Giúp hạ sốt nhanh, cung cấp năng lượng tức thời cho tế bào thần kinh","reference":"Mục 1.6"},{"id":219,"text":"Trong các phương án sau, phương án nào KHÔNG phải là biện pháp hiệu quả để phòng bệnh cảm nóng?","answers":["A. Giảm mật độ chăn nuôi vào mùa hè","B. Cung cấp đủ nước mát và điện giải","C. Cho gia súc ăn thức ăn khô để hạn chế mất nước","D. Tạo bóng râm và hệ thống phun sương trong chuồng"],"correct":2,"explanation":"Đáp án đúng là: Cho gia súc ăn thức ăn khô để hạn chế mất nước Vì: Thức ăn khô có thể làm tăng nguy cơ mất nước, không phải là biện pháp phù hợp để phòng bệnh cảm nóng.","reference":"Mục 2.8"},{"id":220,"text":"Bệnh cảm nắng có thể gây ảnh hưởng đến hệ cơ quan nào ngoài hệ thần kinh?","answers":["A. Hệ hô hấp","B. Hệ tuần hoàn","C. Hệ tiêu hóa","D. Hệ hô hấp, hệ tuần hoàn"],"correct":3,"explanation":"Đáp án đúng là: Hệ hô hấp, hệ tuần hoàn Vì: Cảm nắng có thể gây suy hô hấp và rối loạn tuần hoàn do sốc nhiệt và mất nước nghiêm trọng.","reference":"Mục 1.3"},{"id":221,"text":"Khi gia súc bị cảm nóng, dấu hiệu nào cho thấy tình trạng nguy kịch?","answers":["A. Đồng tử mắt giãn rộng, con vật co giật","B. Gia súc đi lại không kiểm soát","C. Nhiệt độ cơ thể giảm mạnh dưới 38°C","D. Mắt mở to, phản xạ tăng lên"],"correct":0,"explanation":"Đáp án đúng là: Đồng tử mắt giãn rộng, con vật co giật Vì: Đồng tử mắt giãn rộng, con vật co giật, có thể dẫn đến tử vong nhanh chóng.","reference":"Mục 2.4"},{"id":222,"text":"Gia súc bị bệnh cảm nắng, khi kiểm tra hô hấp thấy:","answers":["A. Khó thở, thể thể bụng","B. Nhịp thở chậm và sâu","C. Hô hấp lúc đầu nhanh và khó, sau đó chậm và sâu","D. Hô hấp nhanh và khó thở"],"correct":2,"explanation":"Đáp án đúng là: Hô hấp lúc đầu nhanh và khó, sau đó chậm và sâu Vì: Khi thân nhiệt tăng, nhịp tim tăng nhanh, hô hấp lúc đầu nhanh, khó thở, sau đó nhịp thở chậm lại và sâu hơn.","reference":"Mục 1.4"},{"id":223,"text":"Khi gia súc bị mềm xương, đặc điểm nào dưới đây dễ nhận biết nhất trên X-quang?","answers":["A. Xương dày lên bất thường","B. Xương không bị ảnh hưởng","C. Các khớp xương nhỏ lại","D. Xương bị xốp, cốt mạc dày"],"correct":3,"explanation":"Đáp án đúng là: Xương bị xốp, cốt mạc dày Vì: Bệnh mềm xương làm xương bị xốp, mất khoáng chất và xuất hiện nhiều vùng rỗng khi quan sát trên phim X-quang.","reference":"Mục 2.6"},{"id":224,"text":"Tỷ lệ canxi và photpho hợp lý trong khẩu phần ăn của gia súc là bao nhiêu?","answers":["A. 3:1","B. 2:1,4 - 1,5","C. 1:1","D. 0,5:1"],"correct":1,"explanation":"Đáp án đúng là: 2:1,4 - 1,5 Vì: Tỷ lệ Ca/P hợp lý giúp đảm bảo quá trình hấp thu và chuyển hóa canxi, photpho trong cơ thể gia súc diễn ra bình thường.","reference":"Mục 1.2"},{"id":225,"text":"Nguyên nhân chính gây ra bệnh còi xương ở gia súc là gì?","answers":["A. Thiếu canxi, photpho và vitamin D","B. Do vi khuẩn gây bệnh","C. Do ký sinh trùng đường ruột","D. Thiếu vitamin A"],"correct":0,"explanation":"Đáp án đúng là: Thiếu canxi, photpho và vitamin D Vì: Bệnh còi xương xảy ra khi thiếu canxi, photpho hoặc vitamin D, làm xương không được canxi hóa hoàn toàn, gây biến dạng và phát triển kém.","reference":"Mục 1.2"},{"id":226,"text":"Bệnh mềm xương thường xảy ra ở:","answers":["A. Gia súc trưởng thành và gia súc sinh sản","B. Gia súc non và gia súc trưởng thành","C. Tất cả các loại gia súc","D. Gia súc non và gia súc già yếu"],"correct":0,"explanation":"Đáp án đúng là: Gia súc trưởng thành và gia súc sinh sản Vì: Bệnh mềm xương là hiện tượng bệnh lý xuất hiện trên gia súc trưởng thành.","reference":"Mục 2."},{"id":227,"text":"Triệu chứng nào sau đây là dấu hiệu đặc trưng của bệnh còi xương ở lợn?","answers":["A. Lợn bị tiêu chảy kéo dài","B. Lợn có triệu chứng co giật từng cơn và dáng đứng bất thường","C. Lợn bị sốt cao liên tục","D. Lợn ho khan và khó thở"],"correct":1,"explanation":"Đáp án đúng là: Lợn có triệu chứng co giật từng cơn và dáng đứng bất thường Vì: Bệnh còi xương gây co giật cơ, dẫn đến dáng đứng bất thường như \"dáng con lừa đái\", không liên quan đến các triệu chứng sốt hay tiêu chảy.","reference":"Mục 1."},{"id":228,"text":"Bệnh còi xương và mềm xương khác nhau ở điểm nào?","answers":["A. Còi xương xảy ra ở gia súc non, mềm xương xảy ra ở gia súc trưởng thành","B. Còi xương chỉ xảy ra ở lợn, mềm xương chỉ xảy ra ở bò","C. Còi xương gây tử vong nhanh chóng, mềm xương không nguy hiểm","D. Còi xương do vi khuẩn gây ra, mềm xương do ký sinh trùng gây ra"],"correct":0,"explanation":"Đáp án đúng là: Còi xương xảy ra ở gia súc non, mềm xương xảy ra ở gia súc trưởng thành Vì: Còi xương ảnh hưởng đến gia súc non trong giai đoạn phát triển xương, trong khi mềm xương xảy ra ở gia súc trưởng thành khi mất cân bằng khoáng chất.","reference":"Mục 1.1"},{"id":229,"text":"Khi khẩu phần ăn chứa quá nhiều canxi, hậu quả nào sau đây có thể xảy ra?","answers":["A. Gây kiềm huyết, gây thiếu hụt photpho trong xương","B. Kích thích sự phát triển nhanh của xương","C. Không ảnh hưởng đến sức khỏe vật nuôi","D. Làm gia tăng khả năng hấp thu vitamin D"],"correct":0,"explanation":"Đáp án đúng là: Gây kiềm huyết, làm giảm hấp thu photpho Vì: Khi canxi dư thừa, pH máu tăng (kiềm huyết), làm giảm hấp thu photpho, dẫn đến mất cân bằng khoáng chất, ảnh hưởng tiêu cực đến xương.","reference":"Mục 1.3"},{"id":230,"text":"Gia súc mắc bệnh còi xương giai đoạn tiến triển có biểu hiện:","answers":["A. Giảm ăn, tiêu hóa kém, đau xương khớp","B. Sống lưng cong lên, lồng ngực và xương chậu hẹp","C. Khớp xương sưng to, xương biến dạng","D. Liếm bậy bạ, mọc răng và thay răng chậm, co giật từng cơn"],"correct":3,"explanation":"Đáp án đúng là: Liếm bậy bạ, mọc răng và thay răng chậm, co giật từng cơn Vì: Liếm bậy bạ, mọc răng và thay răng chậm, co giật từng cơn","reference":"Mục 1."},{"id":231,"text":"Gia súc mắc bệnh còi xương ở giai đoạn cuối thường biểu hiện:","answers":["A. Liếm bây bạ, mọc và hay răng chậm","B. Xương biến dạng, khớp xương sưng to","C. Tất cả phương án đã nêu","D. Đau các khớp xương, xương chậu hẹp"],"correct":1,"explanation":"Đáp án đúng là: Xương biến dạng, khớp xương sưng to Vì: Giai đoạn cuối thời kỳ bệnh: Xương biến dạng, các khớp sưng to","reference":"Mục 1.4"},{"id":232,"text":"Chỉ số canxi huyết thanh của gia súc bị còi xương thường có đặc điểm gì?","answers":["A. Không thay đổi so với bình thường","B. Photpho huyết thanh giảm nhưng canxi ổn định","C. Canxi huyết thanh tăng cao","D. Canxi huyết thanh giảm đáng kể"],"correct":3,"explanation":"Đáp án đúng là: Canxi huyết thanh giảm đáng kể Vì: Gia súc bị còi xương thường có lượng canxi huyết thanh giảm do thiếu hụt hấp thu hoặc mất cân đối trong khẩu phần ăn.","reference":"Mục 1."},{"id":233,"text":"Một trong những nguyên nhân ít phổ biến nhưng có thể gây còi xương là gì?","answers":["A. Thiếu đồng hoặc mangan","B. Nhiễm virus đường ruột","C. Thừa vitamin C","D. Thừa protein trong khẩu phần"],"correct":0,"explanation":"Đáp án đúng là: Thiếu đồng hoặc mangan Vì: Thiếu đồng hoặc mangan có thể ảnh hưởng đến quá trình tạo xương, dẫn đến còi xương, dù nguyên nhân này ít phổ biến hơn thiếu canxi hoặc vitamin D.","reference":"Mục 1.2"},{"id":234,"text":"Đâu không phải là biểu hiện của gia súc mắc bệnh mềm xương:","answers":["A. Hay nằm, ngại vận động, ăn bậy","B. Xương ống chân cong queo, sống lưng cong","C. Khi vận động nghe tiếng lục khục ở khớp xương","D. Xương dễ gẫy, mòn răng nhanh."],"correct":1,"explanation":"Đáp án đúng là: Xương ống chân cong queo, sống lưng cong Vì: Đây là biểu hiện của bệnh còi xương","reference":"Mục 2.4"},{"id":235,"text":"Bệnh còi xương xuất hiện trên gia súc:","answers":["A. Gia súc non","B. Gia súc đang mang thai","C. Gia súc già","D. Gia súc trưởng thành"],"correct":0,"explanation":"Đáp án đúng là: Gia súc non Vì: Bệnh còi xương chủ yếu xảy ra ở gia súc non sau giai đoạn cai sữa do x ương chưa phát triển hoàn thiện.","reference":"Mục 1"},{"id":236,"text":"Trong điều trị bệnh còi xương, việc chiếu tia tử ngoại có tác dụng gì?","answers":["A. Làm ấm cơ thể vật nuôi","B. Giúp tổng hợp vitamin D trong cơ thể","C. Tiêu diệt vi khuẩn gây bệnh","D. Hỗ trợ tiêu hóa tốt hơn"],"correct":1,"explanation":"Đáp án đúng là: Giúp tổng hợp vitamin D trong cơ thể Vì: Tia tử ngoại giúp tổng hợp vitamin D trong da, hỗ trợ hấp thu canxi và photpho, giúp phòng và điều trị bệnh còi xương.","reference":"Mục 1.7"},{"id":237,"text":"Tại sao gia súc đang mang thai hoặc nuôi con có nguy cơ cao mắc bệnh mềm xương?","answers":["A. Vì hệ tiêu hóa kém hấp thu dinh dưỡng hơn","B. Vì gia súc mang thai thường bị stress","C. Vì canxi từ xương bị huy động để đáp ứng nhu cầu của con non","D. Vì lượng photpho trong máu tăng đột biến"],"correct":2,"explanation":"Đáp án đúng là: Vì canxi từ xương bị huy động để đáp ứng nhu cầu của con non Vì: Gia súc cái mang thai hoặc nuôi con cần lượng canxi lớn để hỗ trợ sự phát triển của con non, dẫn đến nguy cơ thiếu hụt canxi trong xương.","reference":"Mục 2"},{"id":238,"text":"Bệnh còi xương hay phát triển vào mùa :","answers":["A. Mùa Thu","B. Mùa Xuân","C. Mùa Đông","D. Mùa Hè"],"correct":2,"explanation":"Đáp án đúng là: Mùa Đông Vì: Bệnh còi xương thường gặp vào mùa đông do gia súc ít tiếp xúc với ánh sáng mặt trời, làm giảm khả năng tổng hợp vitamin D.","reference":"Mục 1."},{"id":239,"text":"Gia súc mắc bệnh mềm xương có biểu hiện:","answers":["A. Lông dễ rụng","B. Ngại vận động, xương dễ gẫy","C. Ăn bậy, mọc và thay răng chậm","D. Xương ống chân cong queo, sống lưng cong"],"correct":1,"explanation":"Đáp án đúng là: Ngại vận động, xương dễ gẫy Vì: Hay nằm, kém vận động, dễ mệt, ra mồ hôi nhiều, khi vận động có thể nghe thấy tiếng lục khục ở khớp xương.","reference":"Mục 2.4"},{"id":240,"text":"Đặc điểm nào sau đây KHÔNG phải là dấu hiệu lâm sàng của bệnh còi xương?","answers":["A. Giảm ăn, thích nằm","B. Liếm bậy bạ, ăn đồ vật không phải thức ăn","C. Răng hàm mòn nhanh, không đều","D. Xương ống chân cong vẹo"],"correct":2,"explanation":"Đáp án đúng là: Răng hàm mòn nhanh, không đều Vì: Bệnh còi xương không mòn răng hàm, mà chủ yếu làm biến dạng xương và thay đổi hành vi ăn uống của vật nuôi.","reference":"Mục 1."},{"id":241,"text":"Nguyên nhân nào dưới đây có thể gây bệnh còi xương ở lợn?","answers":["A. Thiếu vitamin D làm giảm hấp thu canxi và photpho","B. Nhiễm vi khuẩn đường ruột làm giảm khả năng tiêu hóa thức ăn","C. Dư thừa protein trong khẩu phần ăn, gây mất cân bằng khoáng chất","D. Bổ sung quá nhiều muối vào khẩu phần, gây mất canxi qua đường nước tiểu"],"correct":0,"explanation":"Đáp án đúng là: Thiếu vitamin D làm giảm hấp thu canxi và photpho Vì: Vitamin D đóng vai trò quan trọng trong việc hấp thu canxi và photpho từ ruột. Khi thiếu vitamin D, cơ thể lợn không thể hấp thu đủ khoáng chất này, dẫn đến rối loạn sự hóa cốt và gây còi xương. Điều này đặc biệt phổ biến ở lợn nuôi trong chuồng kín, ít tiếp xúc với ánh sáng mặt trời.","reference":"Mục 1.2"},{"id":242,"text":"Phương pháp nào dưới đây KHÔNG được dùng để điều trị bệnh còi xương ở gia súc?","answers":["A. Dùng thuốc kháng sinh để kiểm soát vi khuẩn gây bệnh","B. Bổ sung vitamin D qua đường tiêm hoặc thức ăn","C. Bổ sung canxi và photpho theo tỷ lệ cân đối trong khẩu phần","D. Tăng cường tiếp xúc với ánh sáng mặt trời để tổng hợp vitamin D"],"correct":0,"explanation":"Đáp án đúng là: Dùng thuốc kháng sinh để kiểm soát vi khuẩn gây bệnh Vì: Bệnh còi xương là rối loạn chuyển hóa khoáng, không phải bệnh nhiễm trùng do vi khuẩn, nên không cần dùng kháng sinh để điều trị. Thay vào đó, cần bổ sung vitamin D, canxi, photpho và cải thiện điều kiện chăn nuôi.","reference":"Mục 1.7"},{"id":243,"text":"Tại sao vitamin D có vai trò quan trọng trong việc ngăn ngừa còi xương?","answers":["A. Giúp hấp thu canxi","B. Tăng cường miễn dịch cho gia súc","C. Nước tiểu lẫn màng giả, sốt, tiểu dắt.","D. Giảm stress cho vật nuôi"],"correct":0,"explanation":"Đáp án đúng là: Giúp hấp thu canxi Vì: Vitamin D giúp tăng cường hấp thu canxi và photpho từ thức ăn, đảm bảo quá trình khoáng hóa xương diễn ra bình thường.","reference":"Mục 1.7"},{"id":244,"text":"Trong cơ chế bệnh còi xương, thiếu vitamin nào sau đây cũng có thể làm bệnh trầm trọng hơn?","answers":["A. Vitamin B12","B. Vitamin K","C. Vitamin A","D. Vitamin C"],"correct":2,"explanation":"Đáp án đúng là: Vitamin A Vì: Vitamin A giúp phát triển mao mạch trong sụn và hỗ trợ vận chuyển canxi đến xương. Thiếu vitamin A làm giảm quá trình hóa cốt, góp phần gây còi xương.","reference":"Mục 1.2"},{"id":245,"text":"Gia súc mắc bệnh còi xương giai đoạn đầu có biểu hiện:","answers":["A. Khớp xương sưng to","B. Liếm bậy bạ, co giật từng cơn","C. Rụng lông toàn thân","D. Giảm ăn, tiêu hóa kém, đau xương khớp"],"correct":3,"explanation":"Đáp án đúng là: Giảm ăn, tiêu hóa kém, đau xương khớp Vì: Ở giai đoạn đầu, gia súc bị còi xương thường giảm ăn, thích nằm và có hiện tượng đau khớp do xương phát triển kém.","reference":"Mục 1."},{"id":246,"text":"Khi điều trị bệnh còi xương, tại sao không nên sử dụng Strychnin quá 10 ngày liên tục?","answers":["A. Khiến gia súc giảm ăn đột ngột","B. Gây lão hóa xương nhanh chóng","C. Làm giảm hấp thu vitamin D","D. Gây tác dụng phụ lên hệ thần kinh"],"correct":3,"explanation":"Đáp án đúng là: Gây tác dụng phụ lên hệ thần kinh Vì: Strychnin có tác dụng kích thích thần kinh, nếu dùng lâu ngày có thể gây ngộ độc hoặc các tác dụng phụ nghiêm trọng.","reference":"Mục 1"},{"id":247,"text":"Biểu hiện nào thường thấy ở gà mắc bệnh mềm xương?","answers":["A. Tăng cân nhanh bất thường","B. Rụng lông nhiều","C. Vẹo xương ức","D. Xuất huyết trên da"],"correct":2,"explanation":"Đáp án đúng là: Vẹo xương ức Vì: Ở gà, bệnh mềm xương thường gây biến dạng xương ức, ảnh hưởng đến tư thế đứng và khả năng vận động.","reference":"Mục 2.4"},{"id":248,"text":"Ngộ độc cấp tính ở gia súc có thể dẫn đến tình trạng nào sau đây ?","answers":["A. Rối loạn thần kinh nghiêm trọng","B. Không gây ảnh hưởng nghiêm trọng nếu phát hiện sớm","C. Xuất huyết nội tạng kéo dài","D. Tích tụ độc tố trong gan và thận mà không biểu hiện triệu chứng"],"correct":0,"explanation":"Đáp án đúng là : Rối loạn thần kinh nghiêm trọng Vì : Ngộ độc cấp tính có thể gây co giật , mất kiểm soát vận động và rối loạn thần kinh do tác động trực tiếp lên hệ thần kinh trung ương .","reference":"Mục 1."},{"id":249,"text":"Chất độc xâm nhập vào cơ thể vật nuôi bằng những con đường nào ?","answers":["A. Chỉ qua vết thương ngoài da","B. Đường tiêu hóa , hô hấp , da và niêm mạc","C. Chỉ qua đường hô hấp","D. Chỉ qua đường tiêu hóa"],"correct":1,"explanation":"Đáp án đúng là : Đường tiêu hóa , hô hấp , da và niêm mạc Vì : Chất độc có thể xâm nhập vào cơ thể qua nhiều con đường , bao gồm tiêu hóa ( ăn phải thức ăn nhiễm độc ), hô hấp ( hít khí độc ), da và niêm mạc ( tiếp xúc với hóa chất độc hại ).","reference":"Mục 1.7"},{"id":250,"text":"Biểu hiện chính của gia súc khi bị ngộ độc HCN từ sắn là gì ?","answers":["A. Khó thở , co giật , niêm mạc tím tái","B. ăng tiết mồ hôi , chảy nước dãi liên tục","C. Xuất huyết nội tạng","D. Chảy nước mắt , viêm kết mạc"],"correct":0,"explanation":"Đáp án đúng là : Khó thở , co giật , niêm mạc tím tái Vì : ức chế hệ thống hô hấp tế bào , gây thiếu oxy, khó thở , co giật và có thể dẫn đến tử vong nhanh chóng .","reference":"Mục 2"},{"id":251,"text":"Khi gia súc bị ngộ độc nặng , liệu pháp nào có thể được sử dụng để loại bỏ độc tố khỏi máu ?","answers":["A. Lọc máu","B. Tiêm vaccine tăng cường miễn dịch","C. Uống nước muối loãng","D. Xông hơi để tăng tiết mồ hôi"],"correct":0,"explanation":"Đáp án đúng là : Lọc máu Vì : Lọc máu là phương pháp hiệu quả để loại bỏ các chất độc có trọng lượng phân tử thấp mà cơ thể không thể tự đào thải .","reference":"Mục 1."},{"id":252,"text":"Tại sao ngộ độc nitrit có thể gây tử vong nhanh chóng ?","answers":["A. Làm suy giảm hệ miễn dịch của cơ thể","B. Ức chế quá trình tiêu hóa và hấp thu dưỡng chất","C. Tích tụ trong gan gây suy gan cấp tính","D. Gây thiếu oxy máu do chuyển hemoglobin thành methemoglobin"],"correct":3,"explanation":"Đáp án đúng là : Gây thiếu oxy máu do chuyển hemoglobin thành methemoglobin Vì : Nitrit oxy hóa hemoglobin thành methemoglobin , khiến máu không thể vận chuyển oxy hiệu quả , dẫn đến thiếu oxy nghiêm trọng .","reference":"Mục 1."},{"id":253,"text":"Dấu hiệu nào giúp nhận biết gia súc bị trúng độc mãn tính ?","answers":["A. Gia súc kêu la dữ dội","B. Tim đập nhanh ngay sau khi ăn thức ăn độc","C. Bệnh diễn tiến chậm , kéo dài nhiều tháng","D. Gia súc chết ngay sau vài phút"],"correct":2,"explanation":"Đáp án đúng là : Bệnh diễn tiến chậm , kéo dài nhiều tháng Vì : Trúng độc mãn tính diễn tiến kéo dài , không biểu hiện rõ ràng ngay lập tức .","reference":"Mục 1."},{"id":254,"text":"Khi xử lý trúng độc , phương pháp nào sau đây không nên áp dụng ?","answers":["A. Gây nôn","B. Sử dụng thuốc lợi tiểu","C. Thụt rửa dạ dày","D. Tiêm atropin ngay lập tức mà không cần chẩn đoán"],"correct":3,"explanation":"Đáp án đúng là : Tiêm atropin ngay lập tức mà không cần chẩn đoán Vì : Atropin chỉ nên dùng trong một số trường hợp cụ thể , nếu sử dụng không đúng có thể gây hại thêm cho gia súc .","reference":"Mục 1"},{"id":255,"text":"Khi gia súc bị trúng độc cấp tính , cần làm gì đầu tiên :","answers":["A. Tiêm kháng sinh","B. Đưa ra nơi thoáng khí","C. Cho ăn nhiều thức ăn hơn","D. Cho uống nhiều nước"],"correct":1,"explanation":"Đáp án đúng là : Đưa ra nơi thoáng khí Vì : Khi gia súc bị trúng độc cấp tính , việc đầu tiên cần làm là đưa chúng ra nơi thoáng khí để giảm hấp thu độc tố và gia súc hô hấp tốt hơn .","reference":"Mục 1."},{"id":256,"text":"Chất độc ảnh hưởng đến hệ thần kinh của gia súc thường có đặc điểm nào ?","answers":["A. Không gây ảnh hưởng đáng kể nếu liều lượng nhỏ","B. Gây loét miệng và viêm dạ dày nghiêm trọng","C. Làm gia súc mất thăng bằng , run rẩy hoặc co giật","D. Chỉ tác động lên cơ bắp mà không ảnh hưởng đến hành vi"],"correct":2,"explanation":"Đáp án đúng là : Làm gia súc mất thăng bằng , run rẩy hoặc co giật Vì : Các chất độc thần kinh như Pb, Hg, As có thể gây ảnh hưởng đến não , làm vật nuôi co giật , run rẩy và mất kiểm soát vận động .","reference":"Mục 1.6"},{"id":257,"text":"Gia súc bị rắn , rết cắn , để ngăn chất độc vào cơ thể , ta phải ga rô ở vị trí :","answers":["A. Ngay tại vết thương","B. Không cần ga rô","C. Phía trên vết thương","D. Phía dưới vết thương"],"correct":2,"explanation":"Đáp án đúng là : Ngại vận động , xương dễ gẫy Vì : Nếu bị rắn , rết cắn : cần nhanh chóng băng chặn phía trên vết thương , sau khi hút sạch chất độc ra mới tiến hành giải độc và điều trị toàn thân .","reference":"Mục 1.7"},{"id":258,"text":"Loại thuốc nào thường được sử dụng để giải độc flo hữu cơ trong thuốc trừ sâu ?","answers":["A. Dung dịch muối","B. Vitamin B12","C. Acetamide","D. Paracetamol"],"correct":2,"explanation":"Đáp án đúng là : Acetamide Vì : Acetamide là thuốc giải độc đặc hiệu giúp trung hòa tác dụng của flo hữu cơ","reference":"Mục 1.7"},{"id":259,"text":"Gia súc bị trúng độc sắn có biểu hiện?","answers":["A. Mạch nhanh, nôn mửa, thân nhiệt cao","B. Sốt cao, run rẩy, vã mồ h ô i","C. Mạch chậm, nôn mửa, thân nhiệt thấp","D. Khó t hở, tim đập nhanh và yếu"],"correct":3,"explanation":"Đáp án đúng là : Khó thở , tim đập nhanh và yếu Vì : Khi gia súc trúng độc sắn con vật có biểu hiện khó thở, tim đập nhanh và yếu","reference":"Mục 2"},{"id":260,"text":"Gia súc bị trúng độc sắn thường biểu hiện ở dạng:","answers":["A. Mãn tín h","B. Đoản kỳ","C. Á cấp tính","D. Cấp tính"],"correct":2,"explanation":"Đáp án đúng là : Cấp tính Vì : Ngộ độc cấp tính có thể gây co giật , mất kiểm soát vận động và rối loạn thần kinh do tác động trực tiếp lên hệ thần kinh trung ương .","reference":"Mục 2.3"},{"id":261,"text":"Chất độc vào đường tiêu hóa, quan sát gia súc có thể thấy:","answers":["A. Dạ dày xuất huyết","B. Teo gan, suy gan cấp","C. Nôn r a máu, đau bụng dữ dội","D. Giảm ăn , thích nằm"],"correct":2,"explanation":"Đáp án đúng là : Nôn ra máu , đau bụng dữ dội Vì : Thường có các biểu hiện như đau bụng dữ dội , nôn ra máu , tiêu chảy và viêm phúc mạc .","reference":"Mục 1."},{"id":262,"text":"Để gây nôn khi gia súc bị ngộ độc sắn cần sử dụng thuốc :","answers":["A. Urotropin","B. Apomorphin","C. Pilocarpine","D. Strichnin"],"correct":1,"explanation":"Đáp án đúng là : Apomorphin Vì : Thuốc có tác dụng gây nôn","reference":"Mục 1.4"},{"id":263,"text":"Chất nào trong sắn có thể gây ngộ độc cho gia súc ?","answers":["A. Axit sulfuric","B. Axit clohydric","C. Axit lactic","D. Axit cyanhydric"],"correct":3,"explanation":"Đáp án đúng là : Axit cyanhydric Vì : Axit cyanhydric là chất có trong sắn , khi vào cơ thể sẽ gây cản trở quá trình hô hấp tế bào , gây thiếu oxy.","reference":"Mục 2.3"},{"id":264,"text":"Để bảo vệ niêm mạc đường tiêu hóa khi gia súc bị ngộ độc, dùng:","answers":["A. Cho ăn nhiều bữa trong ngày","B. Bột h ồ, cháo loãng","C. Than hoạt tính","D. Cho uống nhiều nước."],"correct":1,"explanation":"Đáp án đúng là : Bột hồ , cháo loãng Vì : Bột hồ , cháo loãng giúp bảo vệ niêm mạc đường tiêu hóa khi gia súc bị ngộ độc","reference":"Mục 1."},{"id":265,"text":"Chất nào sau đây có thể hỗ trợ thải trừ độc tố ra khỏi cơ thể gia súc ?","answers":["A. Muối ăn","B. Than hoạt tính","C. Dầu nhớt","D. Cồn công nghiệp"],"correct":1,"explanation":"Đáp án đúng là : Than hoạt tính Vì : Than hoạt tính có tác dụng hấp phụ chất độc , giúp ngăn chặn sự hấp thu chất độc vào máu .","reference":"Mục 1.7"},{"id":266,"text":"Dấu hiệu nào giúp phân biệt ngộ độc cấp tính và mãn tính ?","answers":["A. Ngộ độc mãn tính luôn có biểu hiện nôn mửa","B. Ngộ độc mãn tính có thể gây tử vong ngay lập tức","C. Ngộ độc cấp tính không ảnh hưởng đến hệ thần kinh","D. Ngộ độc cấp tính xuất hiện triệu chứng đột ngột , còn ngộ độc mãn tính tiến triển chậm"],"correct":3,"explanation":"Đáp án đúng là : Ngộ độc cấp tính xuất hiện triệu chứng đột ngột , còn ngộ độc mãn tính tiến triển chậm Vì : Ngộ độc cấp tính có triệu chứng nhanh và dữ dội , trong khi ngộ độc mãn tính diễn ra từ từ và có thể kéo dài nhiều tháng .","reference":"Mục 1."},{"id":267,"text":"Khi gia súc bị trúng độc do thuốc trừ sâu chứa phospho hữu cơ , có thể dùng thuốc giải độc nào ?","answers":["A. Glucose","B. Pyralocin methylclorid","C. Cafein","D. Vitamin C"],"correct":1,"explanation":"Đáp án đúng là : Pyralocin methylclorid Vì : Pyralocin methylclorid là thuốc giải độc đặc hiệu trong trường hợp ngộ độc phospho hữu cơ .","reference":"Mục 1.7"},{"id":268,"text":"Biện pháp phòng chống trúng độc sắn cho gia súc ?","answers":["A. Không cần quan tâm , gia súc có thể tự thích nghi","B. Cho gia súc ăn thật nhiều sắn trong một bữa","C. Chỉ cho gia súc ăn sắn sống để giữ chất dinh dưỡng","D. Nấu chín sắn và để hở vung khi nấu"],"correct":3,"explanation":"Đáp án đúng là : Nấu chín sắn và để hở vung khi nấu Vì : Nấu chín và để hở vung giúp bay hơi bớt axit cyanhydric , giảm nguy cơ ngộ độc .","reference":"Mục 2."},{"id":269,"text":"Chất nào có thể giúp hấp phụ độc tố trong dạ dày gia súc ?","answers":["A. Glucose","B. Lòng đỏ trứng","C. Bột kaolin","D. Vitamin C"],"correct":2,"explanation":"Đáp án đúng là : Bột kaolin Vì : Dùng than hoạt tính , bột kaolin để hấp thụ chất độc trong dạ dày gia súc .","reference":"Mục 1.7"},{"id":270,"text":"Mổ khám gia súc bị trúng độc sắn thấy:","answers":["A. Ruột non, lá lách xuất huyết hình răng cưa","B. Dạ dày viêm có nhiều nốt loét","C. Phổi s ung huyết, khí quản chứa nhiều bọt màu trắng","D. Tất cả phương án đã nêu"],"correct":2,"explanation":"Đáp án đúng là : Phổi sung huyết , khí quản chứa nhiều bọt màu trắng Vì : Khi mổ khám gia súc bị ngộ độc sắn thấy phổi sung huyết, khí quản chứa nhiều bọt màu trắng","reference":"Mục 2.4"},{"id":271,"text":"Để tăng cường lợi tiểu, thúc đẩy việc đào thải chất độc đã hấp thu ra khỏi cơ thể ta dùng:","answers":["A. Glucoza ưu trương","B. Muối ưu trương","C. Muối đẳng trương","D. Glucoza đẳng trương"],"correct":0,"explanation":"Đáp án đúng là : Glucoza ưu trương Vì : Glucoza ưu trương có tác dụng lợi tiểu và tăng cường đào thải chất độc.","reference":"Mục 1.7"},{"id":272,"text":"Triệu chứng của gia súc khi bị trúng độc sắn là gì ?","answers":["A. Mắt sáng hơn bình thường","B. Tăng thân nhiệt","C. Trao đổi chất nhanh hơn","D. Hôn mê , co giật"],"correct":3,"explanation":"Đáp án đúng là : Hôn mê , co giật Vì : Khi bị trúng độc sắn , gia súc thường có biểu hiện co giật , hôn mê do thiếu oxy tế bào .","reference":"Mục 2.3"},{"id":273,"text":"Bệnh viêm thận cấp tính thường gặp do:","answers":["A. Do chăm sóc nuôi dưỡng","B. Tất cả đáp án đều đúng","C. Các nguyên nhân nguyên phát gây nên","D. Kế phát từ các bệnh khác"],"correct":3,"explanation":"Đáp án đúng là: Kế phát từ các bệnh khác Vì: Viêm thận chủ yếu là do kế phát từ các bệnh khác","reference":"Mục 1.2"},{"id":274,"text":"Gia súc bị bệnh viêm thận cấp tính, thời kỳ đầu quan sát thấy:","answers":["A. Nước Tiểu nhiều, đau vùng thận, có lẫn máu","B. Nước tiểu nhiều, sốt cao","C. Bỏ ăn, phù, sốt cao.","D. Nước tiểu ít, màu đục, sốt cao"],"correct":1,"explanation":"Đáp án đúng là: Nước tiểu nhiều, sốt cao Vì: do ở giai đoạn đầu các kích thích bệnh nguyên tác động làm thận hoạt động tăng cường làm lượng nước tiểu nhiều. Các độc tố của vi khuẩn kết hợp với sản phẩm phân giải tác động gây rối loạn trung khu điều tiết thân nhiệt của cơ thể.","reference":"Mục 1.4"},{"id":275,"text":"Sử dụng Ampicillin tiêm bắp cho chó 20 kg viêm bàng quang với liều:","answers":["A. 50 – 100 mg/ con/ ngày","B. 100 – 150 mg/ con/ ngày","C. 200 – 300mg/ con/ ngày","D. 80 – 150 mg/ con/ ngày"],"correct":2,"explanation":"Đáp án đúng là: 200 – 300mg/ con/ ngày Vì: Vì Ampicillin tiêm bắp sử dụng liều 10mg/kg TT ngày 1 lần","reference":"Mục 2.7"},{"id":276,"text":"Đề phòng hiện tượng thận nhiễm mỡ hoặc thoái hóa, giảm viêm trong bệnh viêm thận cấp tính, có thể dùng thuốc:","answers":["A. Canxiclorua","B. Urotropin","C. Prednisonol","D. Glucose"],"correct":2,"explanation":"Đáp án đúng là: Prednisonol Vì: Vì Prednisonol có tác dụng giảm viêm","reference":"Mục 1.7"},{"id":277,"text":"Bệnh tích của bệnh viêm thận cấp tính là:","answers":["A. Thận sưng, mặt thận lấm tấm xuất huyết","B. Tất cả đáp án đều đúng.","C. Tế bào thượng bì của thận tiểu quản bị thoái hóa hạt và thoái hóa mỡ","D. Mao quản của tiểu cầu thận có protit đông đặc"],"correct":1,"explanation":"Đáp án đúng là: Tất cả đáp án đều đúng Vì: Khi bị viêm thận cấp tính Thận sưng, mặt thận sung huyết hoặc lấm tấm xuất huyết, màng ngoài thận dễ bóc, trong mao quản của tiểu cầu thận có protit đông đặc, bạch cầu và một ít hồng cầu. Hệ thống nội bì sưng làm cho tiểu cầu thận phình to, tế bào thượng bì của thận tiểu quản bị thoái hoá hạt và thoái hoá mỡ.","reference":"Mục 1.5"},{"id":278,"text":"Khi viêm bàng quang cấp tính thấy","answers":["A. Huyết áp giảm","B. Huyết áp lên xuống thất thường","C. Huyết áp không thay đổi","D. Huyết áp tăng"],"correct":3,"explanation":"Đáp án đúng là: Huyết áp tăng Vì: Do sự co thắt mạch quản, chất renin được sản sinh ra, kết hợp với hyper tensinogen trong huyết tương thành hypertensin làm tăng huyết áp.","reference":"Mục 1.3"},{"id":279,"text":"Gia súc bị bệnh viêm thận cấp tính, xét nghiệm nước tiểu thấy:","answers":["A. Trụ niệu, huyết niệu","B. Trụ niệu, huyết niệu, Protein liệu","C. Albumin niệu","D. Protein niệu"],"correct":1,"explanation":"Đáp án đúng là: Trụ niệu, huyết niệu, Protein liệu Vì: Khi thận bị viêm, chức năng lọc của thận kém, dẫn đến thấy xuất hiện Trụ niệu, huyết niệu, Protein liệu trong nước tiểu","reference":"Mục 1.3"},{"id":280,"text":"Bệnh viêm bàng quang, tùy theo tính chất viêm có các thể:","answers":["A. Viêm mãn tính","B. Viêm á cấp tính","C. Viêm cata","D. Viêm cấp tính"],"correct":2,"explanation":"Đáp án đúng là: Viêm cata Vì: Tuỳ theo tính chất viêm mà bệnh viêm bàng quang có các thể: viêm cata, viêm xuất huyết, viêm màng giả.","reference":"Mục 2.1"},{"id":281,"text":"Trong bệnh viêm bàng quang, độc tố của vi trùng, chất phân giải của tế bào và sự phân giả ure thành......... kích thích.................., làm cho bàng quang bị co thắt, con vật................, nếu cơ vòng bàng quang co thắt, con vật...................","answers":["A. Urat à bàng quang à đái khó khăn à đái dắt","B. amoniac à bàng quang à đái khó khăn à đái dắt","C. Amoniac à Niêm mạc à đái dắt à đái khó khăn.","D. Urat à niêm mạc à đái dắt à đái khó khăn."],"correct":2,"explanation":"Đáp án đúng là: Amoniac à Niêm mạc à đái dắt à đái khó khăn. Vì: Độc tố của vi trùng, những chất phân giải tế bào và sự phân giải urê thành amoniac kích thích vào niêm mạc, làm cho bàng quang bị co thắt, con vật đái dắt (tiểu vắt), nếu cơ vòng bàng quang co thắt con vật đái khó khăn.","reference":"Mục 2.3"},{"id":282,"text":"Có thể dùng  ............. để tăng cường lợi tiểu, hỗ trợ điều trị bệnh viêm thận cho gia súc","answers":["A. Lá kinh giới","B. Kim tiền thảo","C. Tất cả đáp án đều đúng","D. Lá vông"],"correct":1,"explanation":"Đáp án đúng là: Kim tiền thảo Vì: Vì kim tiền thảo có tác dụng lợi tiểu","reference":"Mục 2.7"},{"id":283,"text":"Bệnh viêm thận cấp tính khác bệnh sỏi thận là:","answers":["A. Gia súc có biểu hiện đau vùng thận rõ rệt","B. Nước tiểu đục, có lẫn hồng cầu","C. Gia súc sốt rất cao","D. Trụ niệu, huyết niệu"],"correct":2,"explanation":"Đáp án đúng là: Gia súc sốt rất cao Vì: Bệnh sỏi thận gia súc không bị sốt","reference":"Mục 1.2"},{"id":284,"text":"Gia súc bị bệnh viêm thận cấp tính, giai đoạn sau  thấy:","answers":["A. Có hiện tượng tràn dịch màng phổi","B. Nước tiểu đục có khi lẫn máu","C. Phù toàn thân","D. Tất cả các phương án đã nêu"],"correct":3,"explanation":"Đáp án đúng là: Tất cả các phương án đã nêu Vì: Giai đoạn sau khi bị bệnh viêm thận thấy nước tiểu ít, nước tiểu đục, có khi có máu, toàn thân bị ức chế, bỏ ăn. Bệnh kéo dài gây hiện tượng phù toàn thân (các vùng phù dễ thấy là ngực, yếm, bụng, chân, âm hộ và mí mắt), có hiện tượng tràn dịch ở màng phổi, xoang bụng, xoang tim.","reference":"Mục 1.4"},{"id":285,"text":"Bệnh viêm bàng quang thường gặp ở:","answers":["A. Tất cả các loại gia súc","B. Chó, lợn, bò và ngựa","C. Lợn, trâu, bò","D. Chó, bò, ngựa"],"correct":3,"explanation":"Đáp án đúng là: Chó, bò, ngựa Vì: Bệnh thường gặp ở chó, bò, ngựa","reference":"Mục 2.1"},{"id":286,"text":"Đưa dung dịch.... theo trình tự để rửa bàng quang:","answers":["A. Dung dịch sát trùng à kháng sinh","B. KmnO4 à Nước muối sinh lý à kháng sinh","C. KmnO4 à phèn chua à kháng sinh","D. Nước muối sinh lý à Phèn chua à kháng sinh"],"correct":3,"explanation":"Đáp án đúng là: Nước muối sinh lý à Phèn chua à kháng sinh Vì: Nước muối sinh lý à Phèn chua à kháng sinh","reference":"Mục 2.7"},{"id":287,"text":"Khi gia súc bị viêm bàng quang, thể viêm tắc, để thoát nước tiểu ra ngoài ta có thể tiến hành:","answers":["A. Tiêm kháng sinh","B. Tiêm Urotropin","C. Thông niệu đạo","D. Tiêm pilocarpin"],"correct":2,"explanation":"Đáp án đúng là: Thông niệu đạo Vì: Trong trường hợp viêm tắc cần thông niệu đạo chứ không dùng thuốc lợi tiểu, gây vỡ bàng quang.","reference":"Mục 2.7"},{"id":288,"text":"Trong bệnh viêm thận cấp tính, do sự co thắt của mạch quản chất........... được sinh ra, kết hợp với...................... trong........................... thành........................... làm tăng huyết áp.","answers":["A. Renin à Hyper tensinogen à huyết tương à hypertensin","B. huyết tương à hypertensin à renin à hyper tensinogen","C. hyper tensinogen à huyết tương à hypertensin à renin.","D. hyper tensinogen à hypertensin à huyết tương à renin."],"correct":0,"explanation":"Đáp án đúng là: Renin à Hyper tensinogen à huyết tương à hypertensin. Vì: Do sự co thắt mạch quản, chất renin được sản sinh ra, kết hợp với hyper tensinogen trong huyết tương thành hypertensin làm tăng huyết áp.","reference":"Mục 1.3"},{"id":289,"text":"Viêm bàng quang thể cata, quan sát nước tiểu thấy:","answers":["A. Nước tiểu có màu mủ vàng","B. Nước tiểu đục, có dịch nhầy","C. Nước tiểu đục, có màu hồng","D. Nước tiểu có lẫn màng giả"],"correct":1,"explanation":"Đáp án đúng là: Nước tiểu đục, có dịch nhầy Vì: Nếu viêm cata thì nước tiểu đục, chứa nhiều dịch nhày và một ít protit","reference":"Mục 2.4"},{"id":290,"text":"Viêm bàng quang dễ dẫn đến bệnh:","answers":["A. Viêm bể thận","B. Tất cả các phương án đã nêu","C. Viêm thận","D. Viêm phúc mạc"],"correct":1,"explanation":"Đáp án đúng là: Tất cả các phương án đã nêu Vì: Khi gia súc bị viêm bàng quang sẽ kế phát dẫn đến viêm thận, bể thận, viêm phúc mạc, gây chứng bại huyết, liệt bàng quang và dễ làm gia súc chết.","reference":"Mục 2.6"},{"id":291,"text":"Khâu hộ lý không đúng trong bệnh viêm thận cấp tính là:","answers":["A. Cho gia súc ăn thức ăn dễ tiêu","B. Cho gia súc nghỉ ngơi","C. Cho gia súc uống nước tự do","D. Tránh cho ăn thức ăn nhiều muối"],"correct":2,"explanation":"Đáp án đúng là: Cho gia súc uống nước tự do Vì: Nếu cho gia súc uống nước nhiều, sẽ làm thận phải hoạt động tăng cường, làm viêm nặng hơn","reference":"Mục 1.7"},{"id":292,"text":"Gia súc bị bệnh viêm thận cấp tính, xét nghiệm máu thấy:","answers":["A. Hồng cầu tăng","B. Bạch cầu giảm","C. Bạch cầu trung tính tăng","D. Có protein niệu"],"correct":2,"explanation":"Đáp án đúng là: Bạch cầu trung tính tăng Vì: Vì khi cơ thể viêm thì bạch cầu trung tính sẽ tăng","reference":"Mục 1.4"},{"id":293,"text":"Khi viêm bàng quang thể không tắc ta cần:","answers":["A. Dùng thuốc lợi tiểu","B. Tất cả các phương án đã nêu","C. Hạn chế gia súc uống nước","D. Dùng thủ thuật rút nước tiểu ra"],"correct":0,"explanation":"Đáp án đúng là: Dùng thuốc lợi tiểu Vì: Trong trường hợp viêm không tắc ta dùng thuốc lợi tiểu, nhưng nếu viêm tắc dùng thuốc lợi tiểu sẽ gây vỡ bàng quang.","reference":"Mục 2.7"},{"id":294,"text":"Gia súc bị viêm bàng quang thể mãn tính, có biểu hiện:","answers":["A. Sốt, nước tiểu màu đục, đi tiểu khó khăn","B. Nước tiểu lẫn màng giả, sốt, tiểu dắt.","C. Bệnh kéo dài, gia súc sốt cao, cơ thể gầy mòn","D. Gia súc không sốt, đi tiểu khó khăn"],"correct":3,"explanation":"Đáp án đúng là: Gia súc không sốt, đi tiểu khó khăn Vì: Ở thể mãn tính, bệnh nhẹ các tác động đến cơ thể còn ít nên gia súc không sốt, chỉ đi tiểu khó khăn","reference":"Mục 2.4"},{"id":295,"text":"Gia súc bị viêm bàng quang dẫn dễ dấn đến:","answers":["A. Hoại tử bàng quang","B. Loét và hoại tử bàng quang","C. Loét bàng quang","D. Phân táo lẫn chất nhầy"],"correct":1,"explanation":"Đáp án đúng là: Loét và hoại tử bàng quang Vì: Viêm bàng quang dễ dẫn đến loét hoặc hoại tử bàng quang.","reference":"Mục 2.6"}];
</script>

<script>
(function () {
  var LETTERS = "ABCDEFGHIJ";
  var container = document.getElementById("questionContainer");
  var noResults = document.getElementById("noResults");
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");
  var countEl = document.getElementById("searchCount");
  var total = QUESTIONS.length;

  /* ── Escape HTML ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── Highlight từ khóa ── */
  function highlight(text, term) {
    if (!term) return esc(text);
    var safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return esc(text).replace(
      new RegExp("(" + safe.replace(/&amp;/g, "&amp;amp;") + ")", "gi"),
      "<mark>$1</mark>"
    );
  }

  /* ── Render 1 câu hỏi ── */
  function renderQ(q, term) {
    var answersHtml = q.answers.map(function (ans, i) {
      var isCorrect = i === q.correct;
      var cls = "answer-item" + (isCorrect ? " correct" : "");
      var check = isCorrect ? '<span class="check-mark">&#10003;</span>' : "";
      return (
        '<div class="' + cls + '">' +
        '<span class="answer-letter">' + (LETTERS[i] || i + 1) + ".</span>" +
        '<span class="answer-text">' + highlight(ans, term) + "</span>" +
        check +
        "</div>"
      );
    }).join("");

    var feedbackHtml = "";
    if (q.explanation || q.reference) {
      feedbackHtml =
        '<div class="feedback-section">' +
        (q.explanation
          ? "<p><strong>Vì: </strong>" + esc(q.explanation) + "</p>"
          : "") +
        (q.reference
          ? "<p><strong>Tham khảo: </strong>" + esc(q.reference) + "</p>"
          : "") +
        "</div>";
    }

    return (
      '<div class="question-block" id="q' + q.id + '">' +
      '<div class="question-header">' +
      '<span class="q-badge">Câu ' + q.id + "</span>" +
      "</div>" +
      '<div class="question-text">' + highlight(q.text, term) + "</div>" +
      '<div class="answers">' + answersHtml + "</div>" +
      feedbackHtml +
      "</div>"
    );
  }

  /* ── Render danh sách câu hỏi ── */
  function renderList(filtered, term) {
    // Xóa các block cũ (giữ lại #noResults)
    var old = container.querySelectorAll(".question-block");
    old.forEach(function (el) { el.remove(); });

    if (filtered.length === 0) {
      noResults.style.display = "block";
    } else {
      noResults.style.display = "none";
      var frag = document.createDocumentFragment();
      filtered.forEach(function (q) {
        var div = document.createElement("div");
        div.innerHTML = renderQ(q, term);
        frag.appendChild(div.firstChild);
      });
      container.appendChild(frag);
    }

    countEl.innerHTML =
      "<strong>" + filtered.length + "</strong> / " + total + " câu";
  }

  /* ── Lọc câu hỏi ── */
  function doSearch(term) {
    var t = term.trim().toLowerCase();
    var filtered = t
      ? QUESTIONS.filter(function (q) {
          return (
            q.text.toLowerCase().includes(t) ||
            q.answers.some(function (a) { return a.toLowerCase().includes(t); })
          );
        })
      : QUESTIONS;

    searchClear.style.display = term ? "block" : "none";
    renderList(filtered, term.trim());
  }

  /* ── Khởi tạo ── */
  renderList(QUESTIONS, "");

  searchInput.addEventListener("input", function () {
    doSearch(this.value);
  });
  searchClear.addEventListener("click", function () {
    searchInput.value = "";
    doSearch("");
    searchInput.focus();
  });

  /* ── Scroll to top ── */
  var scrollBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", function () {
    scrollBtn.style.display = window.scrollY > 320 ? "flex" : "none";
  }, { passive: true });
  scrollBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
