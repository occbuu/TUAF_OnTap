 hiện tượng hoặc so sánh với chuẩn.","reference":"Mục 10.4"},{"id":150,"text":"Mục đích chính của kiểm tra độ đồng đều khối lượng viên nang là gì?","answers":["A. Kiểm tra màu sắc của viên nang","B. Xác định độ tan của viên nang","C. Đảm bảo mỗi viên có lượng thuốc giống nhau, hạn chế sai số liều lượng","D. Phân biệt thuốc thật và giả"],"correct":2,"explanation":"Đáp án đúng là: Đảm bảo mỗi viên có lượng thuốc giống nhau, hạn chế sai số liều lượng Vì: Kiểm tra độ đồng đều khối lượng giúp đảm bảo liều lượng chính xác giữa các viên trong cùng lô thuốc.","reference":"Mục 10.5"},{"id":151,"text":"Nhiệt độ môi trường thử độ rã của viên nang được quy định là bao nhiêu?","answers":["A. 60 ± 1°C","B. 25 ± 2°C","C. 40 ± 5°C","D. 37 ± 0,5°C"],"correct":3,"explanation":"Đáp án đúng là: 37 ± 0,5°C Vì: 37 ± 0,5°C mô phỏng nhiệt độ cơ thể sinh vật, đảm bảo điều kiện thực tế khi dùng thuốc.","reference":"Mục 10.2"},{"id":152,"text":"Giới hạn sai số cho phép trong thử nghiệm độ đồng đều hàm lượng thường là bao nhiêu?","answers":["A. ±10% thể tích nang","B. ±15% so với hàm lượng ghi trên nhãn","C. ±25% độ tan tiêu chuẩn","D. ±5% khối lượng trung bình"],"correct":1,"explanation":"Đáp án đúng là: ±15% so với hàm lượng ghi trên nhãn Vì: Giới hạn ±15% đảm bảo sai số trong hàm lượng không ảnh hưởng đến liều điều trị.","reference":"Mục 10.5"},{"id":153,"text":"Trong kiểm tra độ đồng đều hàm lượng, cần phân tích gì?","answers":["A. Khối lượng trung bình cả lô thuốc","B. Hàm lượng dược chất trong từng viên nang riêng lẻ","C. Nồng độ tạp chất trong môi trường hòa tan","D. Độ tan của dược chất"],"correct":1,"explanation":"Đáp án đúng là: Hàm lượng dược chất trong từng viên nang riêng lẻ Vì: Mục đích là đánh giá mức độ phân bố hoạt chất trong từng viên để đảm bảo hiệu quả điều trị.","reference":"Mục 10.5"},{"id":154,"text":"Mục đích của kiểm tra định lượng hoạt chất trong thuốc viên nang là gì?","answers":["A. Phát hiện tạp chất hữu cơ trong thuốc","B. Đo độ tan của viên nang","C. Kiểm tra độ ẩm của thuốc","D. Xác định hàm lượng chính xác của dược chất trong viên nang"],"correct":3,"explanation":"Đáp án đúng là: Xác định hàm lượng chính xác của dược chất trong viên nang Vì: Định lượng giúp đảm bảo hàm lượng hoạt chất phù hợp với nhãn, ảnh hưởng trực tiếp đến hiệu quả điều trị.","reference":"Mục 10.4"},{"id":155,"text":"Phương pháp nào thường được dùng để kiểm tra tạp chất liên quan trong viên nang?","answers":["A. Sắc ký lỏng hiệu năng cao (HPLC)","B. Cân trọng lượng","C. Chuẩn độ thể tích","D. Quang phổ hấp thụ UV-Vis"],"correct":0,"explanation":"Đáp án đúng là: Sắc ký lỏng hiệu năng cao (HPLC) Vì: HPLC là kỹ thuật phân tích chính xác, dùng để xác định và định lượng các tạp chất liên quan trong thuốc.","reference":"Mục 10.6"},{"id":156,"text":"Trong bước chuẩn bị mẫu để định lượng hoạt chất trong thuốc viên nang là gì, cần thực hiện thao tác nào đầu tiên?","answers":["A. Ly tâm dung dịch","B. Thêm thuốc thử axit mạnh","C. Làm khô mẫu bằng tủ sấy","D. Cân chính xác mẫu thử"],"correct":3,"explanation":"Đáp án đúng là: Cân chính xác mẫu thử Vì: Việc cân chính xác mẫu là bước đầu tiên quan trọng để đảm bảo kết quả định lượng đúng và lặp lại được.","reference":"Mục 10.4"},{"id":157,"text":"Mục đích chính của kiểm tra tạp chất trong viên nang thú y là gì?","answers":["A. Đảm bảo thuốc không chứa tạp chất vượt mức cho phép để đảm bảo an toàn","B. Đo nồng độ dược chất chính","C. Kiểm tra độ ẩm của viên nang","D. Xác định độ hòa tan của thuốc"],"correct":0,"explanation":"Đáp án đúng là: Đảm bảo thuốc không chứa tạp chất vượt mức cho phép để đảm bảo an toàn Vì: Kiểm tra tạp chất giúp đánh giá độ tinh khiết và an toàn trước khi thuốc lưu hành.","reference":"Mục 10.6"},{"id":158,"text":"Phương pháp nào thường dùng trong kiểm tra định lượng thuốc viên nang?","answers":["A. HPLC, UV-Vis hoặc chuẩn độ","B. Tia X hoặc CT-scan","C. Phản ứng sinh học","D. Đo độ nhớt"],"correct":0,"explanation":"Đáp án đúng là: HPLC, UV-Vis hoặc chuẩn độ Vì: HPLC và UV-Vis là các phương pháp phân tích chính xác, phổ biến trong kiểm nghiệm định lượng dược chất.","reference":"Mục 10.4"},{"id":159,"text":"Để xác định khối lượng thuốc trong viên nang, thao tác nào sau đây là đúng?","answers":["A. Chỉ cân vỏ nang khô","B. Chỉ cân viên nang đầy","C. Cân viên nang nguyên, cân vỏ rỗng, lấy hiệu số","D. Nghiền viên nang rồi cân"],"correct":2,"explanation":"Đáp án đúng là: Cân viên nang nguyên, cân vỏ rỗng, lấy hiệu số Vì: Phương pháp đúng là lấy khối lượng viên nang trừ đi khối lượng vỏ để tính khối lượng thuốc.","reference":"Mục 10.5"},{"id":160,"text":"Phương pháp phổ biến dùng để kiểm tra dung môi tồn dư trong thuốc viên nang là gì?","answers":["A. Sắc ký khí (GC)","B. Chuẩn độ oxi hóa-khử","C. Sắc ký lớp mỏng (TLC)","D. Quang phổ hồng ngoại (IR)"],"correct":0,"explanation":"Đáp án đúng là: Sắc ký khí (GC) Vì: GC là phương pháp được dùng phổ biến để xác định và định lượng các dung môi hữu cơ còn sót lại trong thuốc.","reference":"Mục 10.6"},{"id":161,"text":"Khi đánh giá cảm quan phần bột trong nang, tiêu chí nào là đúng?","answers":["A. Bột có thể hơi ẩm nếu bảo quản tốt","B. Bột mịn hay không không quan trọng","C. Chỉ cần kiểm tra bột nếu có mùi lạ","D. Bột phải khô, tơi, không ẩm ướt hoặc vón cục"],"correct":3,"explanation":"Đáp án đúng là: Bột phải khô, tơi, không ẩm ướt hoặc vón cục Vì: Bột cần khô tơi để đảm bảo tính ổn định và tránh phân hủy hay nhiễm khuẩn.","reference":"Mục 10.1"},{"id":162,"text":"Khi nào viên nang được coi là đạt yêu cầu về độ rã?","answers":["A. Khi vẫn còn một phần vỏ nang nhưng bột đã tan","B. Khi rã sau thời gian gấp đôi thời gian quy định","C. Khi rã hoàn toàn, không còn dạng viên hoặc phần nguyên vẹn trong thời gian quy định","D. Khi có cặn lớn không tan nhưng viên đã mềm"],"correct":2,"explanation":"Đáp án đúng là: Khi rã hoàn toàn, không còn dạng viên hoặc phần nguyên vẹn trong thời gian quy định Vì: Viên nang chỉ đạt yêu cầu khi rã hoàn toàn, không còn phần nguyên vẹn, theo thời gian chuyên luận quy định.","reference":"Mục 10.2"},{"id":163,"text":"Tạp chất kim loại nặng trong thuốc viên nang có thể được kiểm tra bằng phương pháp nào?","answers":["A. Sắc ký khí (GC)","B. Chuẩn độ acid-baz","C. HPLC","D. Quang phổ hấp thụ nguyên tử (AAS) hoặc ICP-MS"],"correct":3,"explanation":"Đáp án đúng là: Quang phổ hấp thụ nguyên tử (AAS) hoặc ICP-MS Vì: AAS và ICP-MS là các phương pháp nhạy, dùng để xác định hàm lượng kim loại nặng như chì, cadimi, thủy ngân.","reference":"Mục 10.6"},{"id":164,"text":"Thiết bị nào được sử dụng trong phương pháp thử độ rã viên nang?","answers":["A. Thiết bị giỏ lưới di động","B. Cân phân tích độ ẩm","C. Máy ly tâm","D. Máy đo độ tan"],"correct":0,"explanation":"Đáp án đúng là: Thiết bị giỏ lưới di động Vì: Thiết bị giỏ lưới di động được thiết kế để nhúng viên nang lên xuống trong dung dịch thử nhằm kiểm tra độ rã.","reference":"Mục 10.2"},{"id":165,"text":"Độ rã của viên nang được hiểu là gì?","answers":["A. Thời gian bảo quản tối đa của viên nang","B. Thời gian để viên nang thay đổi màu trong nước","C. Thời gian để viên nang tan hoàn toàn vào máu","D. Thời gian để viên nang rã hoàn toàn thành các tiểu phần nhỏ trong môi trường thử nghiệm"],"correct":3,"explanation":"Đáp án đúng là: Thời gian để viên nang rã hoàn toàn thành các tiểu phần nhỏ trong môi trường thử nghiệm Vì: Độ rã là chỉ tiêu đánh giá thời gian viên rã thành phần nhỏ trong môi trường thử, phản ánh khả năng giải phóng dược chất.","reference":"Mục 10.2"},{"id":166,"text":"Thiết bị nào thường được sử dụng trong thử nghiệm độ hòa tan viên nang?","answers":["A. Máy đo độ nhớt","B. Thiết bị rung cơ học","C. Máy nén viên","D. Thiết bị kiểu giỏ quay hoặc cánh khuấy"],"correct":3,"explanation":"Đáp án đúng là: Thiết bị kiểu giỏ quay hoặc cánh khuấy Vì: Giỏ quay và cánh khuấy giúp mô phỏng chuyển động của dịch tiêu hóa, hỗ trợ giải phóng dược chất.","reference":"Mục 10.3"},{"id":167,"text":"Mục đích chính của kiểm tra định tính hoạt chất trong thuốc viên nang là gì?","answers":["A. Phân tích tạp chất trong viên nang","B. Đo lường chính xác hàm lượng dược chất","C. Xác định sự có mặt của dược chất chính trong viên nang","D. Kiểm tra độ ổn định của dược chất"],"correct":2,"explanation":"Đáp án đúng là: Xác định sự có mặt của dược chất chính trong viên nang Vì: Định tính nhằm phát hiện sự hiện diện của hoạt chất chính, đảm bảo đúng thành phần thuốc.","reference":"Mục 10.4"},{"id":168,"text":"Số lượng viên nang thường được lấy mẫu để kiểm tra độ đồng đều hàm lượng là bao nhiêu?","answers":["A. 10 viên","B. 15 viên","C. 5 viên","D. 20 viên"],"correct":0,"explanation":"Đáp án đúng là: 10 viên Vì: Theo quy trình kiểm nghiệm thông thường, 10 viên là số mẫu đại diện dùng cho thử nghiệm này.","reference":"Mục 10.5"},{"id":169,"text":"Nhiệt độ tiêu chuẩn trong thử nghiệm độ hòa tan là bao nhiêu?","answers":["A. 60 ± 5°C","B. 25 ± 2°C","C. 37 ± 0,5°C","D. 50 ± 1°C"],"correct":2,"explanation":"Đáp án đúng là: 37 ± 0,5°C Vì: 37°C mô phỏng nhiệt độ cơ thể động vật để kiểm tra phản ứng thực tế của thuốc.","reference":"Mục 10.3"},{"id":170,"text":"Độ hòa tan phản ánh điều gì trong kiểm nghiệm viên nang?","answers":["A. Tốc độ rã cơ học của viên nang","B. Tốc độ bay hơi của dung môi thử","C. Tỷ lệ hấp thu thuốc qua da","D. Tốc độ và mức độ giải phóng dược chất vào môi trường hòa tan"],"correct":3,"explanation":"Đáp án đúng là: Tốc độ và mức độ giải phóng dược chất vào môi trường hòa tan Vì: Độ hòa tan cho biết khả năng giải phóng dược chất vào môi trường tiêu hóa, ảnh hưởng đến hiệu quả điều trị.","reference":"Mục 10.3"},{"id":171,"text":"Trong phép thử độ hòa tan, môi trường hòa tan được lựa chọn dựa trên yếu tố nào?","answers":["A. Phương pháp sản xuất viên nang","B. Kích thước viên nang","C. Đặc tính của thuốc và yêu cầu chuyên luận","D. Loại động vật được dùng thuốc"],"correct":2,"explanation":"Đáp án đúng là: Đặc tính của thuốc và yêu cầu chuyên luận Vì: Việc chọn môi trường dựa trên đặc tính hóa lý của dược chất và hướng dẫn chuyên luận.","reference":"Mục 10.3"},{"id":172,"text":"Dấu hiệu nào sau đây là bất thường khi đánh giá mùi viên nang?","answers":["A. Không có mùi","B. Mùi giống như sản phẩm cùng loại","C. Có mùi mốc hoặc mùi hóa chất lạ","D. Mùi nhẹ của dược liệu"],"correct":2,"explanation":"Đáp án đúng là: Có mùi mốc hoặc mùi hóa chất lạ Vì: Mùi mốc, khét, hoặc hóa chất bất thường cho thấy khả năng thuốc bị hỏng hoặc nhiễm tạp.","reference":"Mục 10.1"},{"id":173,"text":"Yếu tố nào sau đây làm tăng tốc độ phản ứng hóa học trong dung dịch thuốc khi nhiệt độ tăng?","answers":["A. Tốc độ phản ứng không thay đổi","B. Tốc độ phản ứng giảm một nửa mỗi 10°C","C. Tốc độ phản ứng tăng gấp đôi mỗi 10°C","D. Tốc độ phản ứng biến thiên ngẫu nhiên"],"correct":2,"explanation":"Đáp án đúng là: Tốc độ phản ứng tăng gấp đôi mỗi 10°C Vì: Theo nguyên lý động hóa học, nhiệt độ tăng 10°C sẽ làm tốc độ phản ứng hóa học tăng gấp đôi, ảnh hưởng đến độ ổn định của thuốc.","reference":"Mục 11.3"},{"id":174,"text":"Trong các phản ứng sau, phản ứng bậc một trong dung dịch thuốc là phản ứng mà tốc độ phản ứng phụ thuộc vào:","answers":["A. Không phụ thuộc nồng độ chất phản ứng","B. Nồng độ của hai chất phản ứng","C. Nồng độ của một chất phản ứng","D. Nồng độ của ba chất phản ứng"],"correct":2,"explanation":"Đáp án đúng là: Nồng độ của một chất phản ứng Vì: Phản ứng bậc một có tốc độ tỷ lệ trực tiếp với nồng độ của một chất phản ứng duy nhất.","reference":"Mục 11.3"},{"id":175,"text":"Tiêu chuẩn đánh giá độ ổn định thuốc thú y bao gồm những yếu tố nào sau đây?","answers":["A. Độ ổn định hóa học và vật lý","B. Độ ổn định vật lý và vi sinh","C. Chỉ độ ổn định vi sinh","D. Độ ổn định hóa học, vật lý, vi sinh, điều trị và độc tính"],"correct":3,"explanation":"Đáp án đúng là: Độ ổn định hóa học, vật lý, vi sinh, điều trị và độc tính Vì: Các tiêu chuẩn đánh giá độ ổn định gồm đầy đủ 5 yếu tố để đảm bảo chất lượng toàn diện.","reference":"Mục 11.2"},{"id":176,"text":"Vùng khí hậu nóng ẩm ảnh hưởng đến độ ổn định của thuốc như thế nào?","answers":["A. Làm tăng tốc độ phân hủy hóa học và nguy cơ nhiễm khuẩn","B. Làm thuốc ổn định tốt hơn","C. Không ảnh hưởng đến thuốc","D. Làm giảm nguy cơ nhiễm khuẩn"],"correct":0,"explanation":"Đáp án đúng là: Làm tăng tốc độ phân hủy hóa học và nguy cơ nhiễm khuẩn Vì: Khí hậu nóng ẩm thúc đẩy quá trình phân hủy và phát triển vi sinh vật, giảm tuổi thọ thuốc.","reference":"Mục 11.2"},{"id":177,"text":"Thử nghiệm độ ổn định sẽ kiểm tra những yếu tố nào sau đây?","answers":["A. Hình ảnh quảng cáo","B. Thiết kế bao bì","C. Hàm lượng, độ hòa tan, tạp chất","D. Giá trị thương mại"],"correct":2,"explanation":"Đáp án đúng là: Hàm lượng, độ hòa tan, tạp chất Vì: Các chỉ tiêu như hàm lượng, độ hòa tan và tạp chất phản ánh sự ổn định.","reference":"Mục 11.2"},{"id":178,"text":"Quá trình nghiên cứu độ ổn định của thuốc bắt đầu được chú trọng từ thời kỳ nào?","answers":["A. Cuối thế kỷ 21","B. Đầu thế kỷ 19","C. Giữa thế kỷ 20","D. Đầu thế kỷ 18"],"correct":2,"explanation":"Đáp án đúng là: Giữa thế kỷ 20 Vì: Nghiên cứu độ ổn định chỉ thực sự được chú trọng từ giữa thế kỷ 20, khi ngành công nghiệp dược phẩm phát triển mạnh.","reference":"Mục 11.1"},{"id":179,"text":"Mục tiêu của đánh giá độ ổn định hóa học là gì?","answers":["A. Đánh giá tốc độ hòa tan của thuốc","B. Xác định sự phân hủy hoặc biến chất của hoạt chất theo thời gian","C. Đánh giá sự thay đổi hình thức của thuốc","D. Đánh giá sự nhiễm khuẩn của thuốc"],"correct":1,"explanation":"Đáp án đúng là: Xác định sự phân hủy hoặc biến chất của hoạt chất theo thời gian Vì: Đánh giá độ ổn định hóa học nhằm phát hiện sự thay đổi thành phần hoạt chất, ảnh hưởng đến hiệu quả thuốc.","reference":"Mục 11.2"},{"id":180,"text":"ICH được thành lập vào năm nào để chuẩn hóa nghiên cứu độ ổn định thuốc trên toàn cầu?","answers":["A. Năm 1990","B. Năm 1980","C. Năm 2000","D. Năm 1970"],"correct":0,"explanation":"Đáp án đúng là: Năm 1990 Vì: Hội nghị quốc tế ICH được thành lập năm 1990 nhằm thống nhất hướng dẫn về nghiên cứu độ ổn định.","reference":"Mục 11.1"},{"id":181,"text":"Nghiên cứu độ ổn định của thuốc nhằm mục đích gì?","answers":["A. Chỉ phục vụ mục tiêu tiếp thị","B. Tăng giá thành sản phẩm","C. Rút ngắn thời gian sản xuất","D. Đảm bảo chất lượng, hiệu quả và an toàn của thuốc"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo chất lượng, hiệu quả và an toàn của thuốc Vì: Mục đích chính của nghiên cứu độ ổn định là đảm bảo thuốc duy trì chất lượng, hiệu quả và an toàn trong suốt thời gian sử dụng.","reference":"Mục 11.1"},{"id":182,"text":"Phản ứng hóa học nào sau đây chủ yếu xảy ra khi thuốc tiếp xúc với ánh sáng?","answers":["A. Phản ứng trao đổi ion","B. Phản ứng đồng phân hóa","C. Phản ứng thủy phân","D. Phản ứng oxy hóa"],"correct":3,"explanation":"Đáp án đúng là: Phản ứng oxy hóa Vì: Ánh sáng, đặc biệt là tia UV, kích thích phản ứng oxy hóa, làm thuốc phân hủy nhanh chóng.","reference":"Mục 11.3"},{"id":183,"text":"Mục tiêu chính của đánh giá độ ổn định trong quá trình phát triển thuốc là gì?","answers":["A. Tăng giá bán thuốc","B. Đổi mới bao bì sản phẩm","C. Quảng bá thương hiệu","D. Đảm bảo thuốc hiệu quả và an toàn trong suốt vòng đời"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo thuốc hiệu quả và an toàn trong suốt vòng đời Vì: Đánh giá độ ổn định nhằm đảm bảo thuốc luôn hiệu quả và an toàn khi sử dụng.","reference":"Mục 11.2"},{"id":184,"text":"Khi đánh giá độ ổn định độc tính của thuốc thú y, yếu tố nào được chú trọng?","answers":["A. Phát hiện sản phẩm phân hủy có độc tính","B. Độ đồng đều hàm lượng","C. Sự thay đổi màu sắc của thuốc","D. Mức độ hòa tan của viên nén"],"correct":0,"explanation":"Đáp án đúng là: Phát hiện sản phẩm phân hủy có độc tính Vì: Mục tiêu là đảm bảo thuốc không sinh ra sản phẩm phân hủy gây độc hại cho động vật.","reference":"Mục 11.2"},{"id":185,"text":"Mục tiêu của đánh giá độ ổn định điều trị là gì?","answers":["A. Đảm bảo thuốc không kết tủa","B. Đảm bảo thuốc không bị đổi màu","C. Đảm bảo thuốc không bị nhiễm khuẩn","D. Đảm bảo thuốc vẫn duy trì hiệu quả điều trị trong suốt thời gian bảo quản"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo thuốc vẫn duy trì hiệu quả điều trị trong suốt thời gian bảo quản Vì: Độ ổn định điều trị nhằm kiểm tra hoạt tính và tác dụng điều trị còn được duy trì hay không.","reference":"Mục 11.2"},{"id":186,"text":"Yếu tố nào là tác nhân gây phân hủy thuốc?","answers":["A. Nhiệt độ cao","B. Giá thành rẻ","C. Thiết kế bao bì đẹp","D. Quá trình marketing"],"correct":0,"explanation":"Đáp án đúng là: Nhiệt độ cao Vì: Nhiệt độ cao là một trong những tác nhân làm thuốc phân hủy nhanh.","reference":"Mục 11.2"},{"id":187,"text":"Để làm giảm quá trình thủy phân trong dung dịch thuốc, biện pháp nào sau đây là phù hợp nhất?","answers":["A. Bảo quản trong điều kiện khô ráo và kín đáo","B. Sử dụng dung môi chứa nhiều nước","C. Tăng cường độ ẩm bảo quản","D. Bảo quản ở nơi có ánh sáng mạnh"],"correct":0,"explanation":"Đáp án đúng là: Bảo quản trong điều kiện khô ráo và kín đáo Vì: Điều kiện khô ráo và kín giúp hạn chế nước tiếp xúc với thuốc, từ đó giảm thủy phân.","reference":"Mục 11.3"},{"id":188,"text":"Bước ngoặt lớn trong yêu cầu nghiên cứu độ ổn định của thuốc xảy ra vào thời gian nào?","answers":["A. Những năm 1950","B. Những năm 1980","C. Những năm 2000","D. Những năm 1960"],"correct":3,"explanation":"Đáp án đúng là: Những năm 1960 Vì: Vào những năm 1960, FDA yêu cầu bắt buộc nghiên cứu độ ổn định trong hồ sơ đăng ký thuốc.","reference":"Mục 11.1"},{"id":189,"text":"Tuổi thọ (Shelf life) của thuốc được tính từ thời điểm nào?","answers":["A. Ngày phân phối","B. Ngày bán lẻ","C. Ngày sản xuất","D. Ngày thử nghiệm"],"correct":2,"explanation":"Đáp án đúng là: Ngày sản xuất Vì: Tuổi thọ được tính từ ngày sản xuất đến ngày hết hạn sử dụng.","reference":"Mục 11.2"},{"id":190,"text":"Yếu tố nào không thuộc các yếu tố ảnh hưởng đến độ ổn định của thuốc?","answers":["A. Độ sáng đèn phòng thí nghiệm","B. Thành phần bào chế","C. Ánh sáng","D. Nhiệt độ"],"correct":1,"explanation":"Đáp án đúng là: Thành phần bào chế Vì: Thành phần bào chế ảnh hưởng trực tiếp đến độ ổn định, độ sáng đèn không phải yếu tố chính.","reference":"Mục 11.2"},{"id":191,"text":"Nhiệt độ và độ ẩm bảo quản thuốc cần tuân thủ vì lý do nào?","answers":["A. Tăng tính cạnh tranh","B. Hợp pháp hóa nhãn mác","C. Đảm bảo tính ổn định","D. Tiết kiệm chi phí sản xuất"],"correct":2,"explanation":"Đáp án đúng là: Đảm bảo tính ổn định Vì: Bảo quản đúng nhiệt độ, độ ẩm giúp thuốc giữ độ ổn định lâu dài.","reference":"Mục 11.2"},{"id":192,"text":"Độ ổn định vi sinh chủ yếu nhằm kiểm tra điều gì?","answers":["A. Sự thay đổi màu sắc của thuốc","B. Khả năng hòa tan của viên nén","C. Sự phân hủy hoạt chất theo thời gian","D. Mức độ nhiễm khuẩn và sự phát triển vi sinh vật trong thuốc"],"correct":3,"explanation":"Đáp án đúng là: Mức độ nhiễm khuẩn và sự phát triển vi sinh vật trong thuốc Vì: Độ ổn định vi sinh đảm bảo thuốc không bị nhiễm khuẩn, vẫn an toàn khi bảo quản.","reference":"Mục 11.2"},{"id":193,"text":"Thử nghiệm độ ổn định gia tốc nhằm mục đích gì?","answers":["A. Rút ngắn quy trình sản xuất","B. Cải thiện màu sắc sản phẩm","C. Dự đoán độ ổn định trong thời gian dài","D. Tăng chi phí nghiên cứu"],"correct":2,"explanation":"Đáp án đúng là: Dự đoán độ ổn định trong thời gian dài Vì: Thử nghiệm gia tốc giúp dự đoán độ ổn định nhanh hơn nhờ điều kiện khắc nghiệt.","reference":"Mục 11.2"},{"id":194,"text":"Độ bền (Robustness) của thuốc biểu hiện khả năng gì?","answers":["A. Duy trì chất lượng khi thay đổi yếu tố môi trường","B. Chống chịu vi khuẩn","C. Gia tăng hàm lượng hoạt chất","D. Thay đổi hương vị theo yêu cầu"],"correct":0,"explanation":"Đáp án đúng là: Duy trì chất lượng khi thay đổi yếu tố môi trường Vì: Độ bền thể hiện khả năng thuốc giữ chất lượng khi môi trường thay đổi nhẹ.","reference":"Mục 11.2"},{"id":195,"text":"Để đánh giá độ ổn định vật lý, yếu tố nào sau đây cần được kiểm tra?","answers":["A. Màu sắc, độ hòa tan, độ rã, kết tủa","B. Hàm lượng hoạt chất","C. Hoạt tính sinh học","D. Mức độ nhiễm khuẩn"],"correct":0,"explanation":"Đáp án đúng là: Màu sắc, độ hòa tan, độ rã, kết tủa Vì: Đánh giá vật lý bao gồm các yếu tố liên quan đến hình thức và tính chất vật lý của thuốc.","reference":"Mục 11.2"},{"id":196,"text":"Hạn sử dụng của thuốc được xác định dựa trên cơ sở nào?","answers":["A. Giá thành sản phẩm","B. Mẫu mã bao bì","C. Thử nghiệm độ ổn định","D. Độ phổ biến thị trường"],"correct":2,"explanation":"Đáp án đúng là: Thử nghiệm độ ổn định Vì: Hạn sử dụng được xác định từ dữ liệu thử nghiệm độ ổn định.","reference":"Mục 11.2"},{"id":197,"text":"Độ ổn định của thuốc được định nghĩa là khả năng duy trì điều gì?","answers":["A. Tính chất đặc trưng và hiệu quả điều trị","B. Giá thành sản phẩm","C. Bao bì đẹp mắt","D. Mùi vị hấp dẫn"],"correct":0,"explanation":"Đáp án đúng là: Tính chất đặc trưng và hiệu quả điều trị Vì: Độ ổn định là khả năng duy trì tính chất và hiệu quả điều trị trong suốt thời gian bảo quản.","reference":"Mục 11.2"},{"id":198,"text":"Một yếu tố môi trường có thể ảnh hưởng đến kết quả thử dài hạn độ ổn định thuốc thú y là gì?","answers":["A. Số lượng nhà phân phối thuốc","B. Độ ẩm thay đổi ngoài kiểm soát","C. Nhu cầu tiêu thụ thuốc tăng cao","D. Giá bán biến động trên thị trường"],"correct":1,"explanation":"Đáp án đúng là: Độ ẩm thay đổi ngoài kiểm soát Vì: Độ ẩm và nhiệt độ không ổn định ngoài thực tế có thể làm sai lệch kết quả thử dài hạn.","reference":"Mục 12.3"},{"id":199,"text":"Hạn chế của phương pháp thử cấp tốc độ ổn định thuốc thú y là gì?","answers":["A. Không cần theo dõi chỉ tiêu chất lượng","B. Không thể hoàn toàn thay thế cho thử dài hạn","C. Dễ dàng ngoại suy hạn dùng chính xác tuyệt đối","D. Không cần đánh giá các sản phẩm phân hủy"],"correct":1,"explanation":"Đáp án đúng là: Không thể hoàn toàn thay thế cho thử dài hạn Vì: Thử cấp tốc chỉ mang tính chất hỗ trợ, cần phối hợp với thử dài hạn để đánh giá chính xác.","reference":"Mục 12.2"},{"id":200,"text":"Trong thử dài hạn độ ổn định thuốc thú y, mẫu thử cần được lấy như thế nào?","answers":["A. Lấy từ mẫu giả định chưa qua kiểm nghiệm","B. Lấy từ nguyên liệu thô trước sản xuất","C. Lấy từ lô sản xuất thực tế, đóng gói như sản phẩm thương mại","D. Lấy từ mẫu nghiên cứu trong phòng thí nghiệm"],"correct":2,"explanation":"Đáp án đúng là: Lấy từ lô sản xuất thực tế, đóng gói như sản phẩm thương mại Vì: Mẫu thử phải đại diện cho lô sản xuất thực tế để đảm bảo tính chính xác.","reference":"Mục 12.3"},{"id":201,"text":"Phương tiện lấy mẫu yêu cầu phải đạt tiêu chuẩn nào?","answers":["A. Phải mới hoàn toàn, chưa sử dụng","B. Phải sạch và phù hợp với loại thuốc cần lấy","C. Phải có màu sắc đặc biệt","D. Phải làm từ vật liệu kim loại"],"correct":1,"explanation":"Đáp án đúng là: Phải sạch và phù hợp với loại thuốc cần lấy Vì: Dụng cụ lấy mẫu cần sạch và phù hợp để tránh nhiễm bẩn, đảm bảo mẫu chính xác và đại diện.","reference":"Mục 12.1"},{"id":202,"text":"Phân tích cảm quan trong đánh giá độ ổn định thuốc thú y bao gồm việc kiểm tra yếu tố nào?","answers":["A. Màu sắc, mùi, hình thức","B. Độ hấp thu tia UV","C. Hàm lượng hoạt chất","D. Nồng độ tạp chất"],"correct":0,"explanation":"Đáp án đúng là: Màu sắc, mùi, hình thức Vì: Phân tích cảm quan tập trung vào màu sắc, mùi, hình thức để phát hiện sớm thay đổi.","reference":"Mục 12.4"},{"id":203,"text":"Phân tích và đánh giá kết quả thử độ ổn định có vai trò như thế nào?","answers":["A. Định hướng lại chiến lược quảng cáo","B. Thay đổi tên thương mại của thuốc","C. Tăng khả năng tiếp thị sản phẩm","D. Cung cấp cơ sở khoa học cho việc quyết định về sản phẩm"],"correct":3,"explanation":"Đáp án đúng là: Cung cấp cơ sở khoa học cho việc quyết định về sản phẩm Vì: Kết quả phân tích là căn cứ khoa học để điều chỉnh hoặc xác nhận sản phẩm","reference":"Mục 12.4"},{"id":204,"text":"Thời gian thông thường cho một nghiên cứu thử cấp tốc độ ổn định thuốc thú y là bao lâu?","answers":["A. Từ 3 đến 6 tháng","B. Từ 12 đến 24 tháng","C. Hơn 24 tháng","D. 1 đến 2 tháng"],"correct":0,"explanation":"Đáp án đúng là: Từ 3 đến 6 tháng Vì: Thử cấp tốc thường kéo dài 3–6 tháng để kịp thời đánh giá xu hướng biến đổi sản phẩm.","reference":"Mục 12.2"},{"id":205,"text":"Điều kiện thử nghiệm cấp tốc độ ổn định thuốc, tiêu chuẩn về nhiệt độ và độ ẩm là bao nhiêu?","answers":["A. 50°C ± 2°C và 85% ± 5% RH","B. 25°C ± 2°C và 60% ± 5% RH","C. 40°C ± 2°C và 75% ± 5% RH","D. 30°C ± 2°C và 65% ± 5% RH"],"correct":2,"explanation":"Đáp án đúng là: 40°C ± 2°C và 75% ± 5% RH Vì: Điều kiện chuẩn của thử cấp tốc là 40°C ± 2°C và 75% ± 5% RH.","reference":"Mục 12.2"},{"id":206,"text":"Nếu kết quả phân tích cho thấy thuốc không ổn định, giải pháp nào sau đây có thể được đề xuất?","answers":["A. Tăng thời gian lưu kho","B. Điều chỉnh công thức hoặc bao bì","C. Thay đổi đối tượng sử dụng thuốc","D. Giảm liều lượng sử dụng"],"correct":1,"explanation":"Đáp án đúng là: Điều chỉnh công thức hoặc bao bì Vì: Khi thuốc không đạt, cần cải tiến công thức hoặc bao bì để cải thiện độ ổn định.","reference":"Mục 12.4"},{"id":207,"text":"Trong ứng dụng thực tế, thử cấp tốc độ ổn định thuốc thú y giúp nhà sản xuất làm gì?","answers":["A. Đánh giá độ ổn định sơ bộ cho sản phẩm mới","B. Xác định hiệu quả điều trị trên người","C. Quyết định giá bán thuốc","D. Đánh giá khả năng lây nhiễm bệnh"],"correct":0,"explanation":"Đáp án đúng là: Đánh giá độ ổn định sơ bộ cho sản phẩm mới Vì: Thử cấp tốc giúp kiểm tra sơ bộ độ ổn định, hỗ trợ điều chỉnh công thức hoặc bao bì.","reference":"Mục 12.2"},{"id":208,"text":"Mục đích chính của việc phân tích kết quả thử độ ổn định thuốc thú y là gì?","answers":["A. Tăng giá bán sản phẩm","B. Giảm chi phí vận chuyển","C. Xác định sự biến đổi các chỉ tiêu chất lượng","D. Xác định phương pháp sản xuất"],"correct":2,"explanation":"Đáp án đúng là: Xác định sự biến đổi các chỉ tiêu chất lượng Vì: Phân tích giúp đánh giá sự thay đổi chất lượng của thuốc theo thời gian.","reference":"Mục 12.4"},{"id":209,"text":"Nguyên tắc nào sau đây là bắt buộc trong quá trình lấy mẫu nghiên cứu độ ổn định?","answers":["A. Lấy mẫu các sản phẩm có hình thức đẹp nhất","B. Lựa chọn mẫu ngẫu nhiên để tránh sai lệch","C. Chọn mẫu theo ý kiến cá nhân","D. Chỉ lấy mẫu ở đầu lô sản xuất"],"correct":1,"explanation":"Đáp án đúng là: Lựa chọn mẫu ngẫu nhiên để tránh sai lệch Vì: Lấy mẫu ngẫu nhiên giúp đảm bảo tính khách quan và đại diện cho toàn bộ lô thuốc.","reference":"Mục 12.1"},{"id":210,"text":"Mục đích chính của việc lấy mẫu trong nghiên cứu độ ổn định là gì?","answers":["A. Xác định phương pháp điều chế thuốc","B. Dự đoán nhu cầu thị trường","C. Đảm bảo mẫu thử đại diện cho toàn bộ lô sản phẩm","D. Đánh giá chi phí sản xuất thuốc"],"correct":2,"explanation":"Đáp án đúng là: Đảm bảo mẫu thử đại diện cho toàn bộ lô sản phẩm Vì: Lấy mẫu nhằm đảm bảo mẫu đại diện cho toàn lô, phản ánh đúng điều kiện sản xuất và bảo quản.","reference":"Mục 12.1"},{"id":211,"text":"Phân tích xu hướng trong thử dài hạn độ ổn định thuốc thú y nhằm mục đích gì?","answers":["A. Dự đoán hạn dùng chính thức của sản phẩm","B. Quyết định chiến lược marketing","C. Đánh giá quy trình sản xuất","D. Xác định giá thành sản phẩm"],"correct":0,"explanation":"Đáp án đúng là: Dự đoán hạn dùng chính thức của sản phẩm Vì: Phân tích xu hướng giúp dự đoán chính xác thời gian sử dụng an toàn của thuốc.","reference":"Mục 12.3"},{"id":212,"text":"Thời gian thử nghiệm dài hạn độ ổn định thuốc thú y thông thường kéo dài bao lâu?","answers":["A. Từ 1 đến 3 tháng","B. Từ 12 đến 24 tháng","C. Dưới 6 tháng","D. Trên 36 tháng"],"correct":1,"explanation":"Đáp án đúng là: Từ 12 đến 24 tháng Vì: Thử dài hạn kéo dài 12–24 tháng để phản ánh đúng biến động trong bảo quản thực tế.","reference":"Mục 12.3"},{"id":213,"text":"Hạn chế lớn nhất của phương pháp thử dài hạn độ ổn định thuốc thú y là gì?","answers":["A. Không cung cấp thông tin về độ ổn định","B. Cần thời gian dài và chi phí cao","C. Không áp dụng được cho các dạng bào chế mới","D. Không theo dõi được sự biến đổi của thuốc"],"correct":1,"explanation":"Đáp án đúng là: Cần thời gian dài và chi phí cao Vì: Thử dài hạn mất nhiều thời gian và chi phí lớn để duy trì thử nghiệm ổn định.","reference":"Mục 12.3"},{"id":214,"text":"Mục tiêu chính của thử dài hạn độ ổn định đối với thuốc thú y là gì?","answers":["A. Xác định giá thành sản phẩm","B. Xác định chính xác tuổi thọ của sản phẩm","C. Kiểm tra hiệu quả sinh học trên động vật","D. Đánh giá khả năng sinh lời khi bán ra thị trường"],"correct":1,"explanation":"Đáp án đúng là: Xác định chính xác tuổi thọ của sản phẩm Vì: Thử dài hạn nhằm xác định tuổi thọ thuốc trong điều kiện bảo quản thực tế.","reference":"Mục 12.3"},{"id":215,"text":"Phương pháp thử cấp tốc độ ổn định áp dụng nguyên lý nào trong dự đoán độ ổn định?","answers":["A. Định luật Arrhenius","B. Định luật Dalton","C. Định luật Boyle","D. Định luật Avogadro"],"correct":0,"explanation":"Đáp án đúng là: Định luật Arrhenius Vì: Định luật Arrhenius mô tả mối quan hệ giữa nhiệt độ và tốc độ phản ứng hóa học.","reference":"Mục 12.2"},{"id":216,"text":"Trong quy trình lấy mẫu, việc ghi chép đầy đủ có ý nghĩa gì?","answers":["A. Giảm số lượng mẫu cần lấy","B. Đảm bảo truy xuất nguồn gốc và tính minh bạch của mẫu","C. Giảm chi phí bảo quản mẫu","D. Rút ngắn thời gian thử nghiệm"],"correct":1,"explanation":"Đáp án đúng là: Đảm bảo truy xuất nguồn gốc và tính minh bạch của mẫu Vì: Ghi chép đầy đủ giúp đảm bảo tính minh bạch, kiểm soát chất lượng và truy xuất nguồn gốc mẫu.","reference":"Mục 12.1"},{"id":217,"text":"Một trong những chỉ tiêu chất lượng cần theo dõi trong thử dài hạn độ ổn định thuốc thú y là gì?","answers":["A. Hàm lượng hoạt chất chính","B. Nhu cầu thị trường của thuốc","C. Hiệu quả marketing sản phẩm","D. Độc tính cấp tính trên chuột"],"correct":0,"explanation":"Đáp án đúng là: Hàm lượng hoạt chất chính Vì: Hàm lượng hoạt chất là chỉ tiêu quan trọng để đánh giá độ ổn định thuốc.","reference":"Mục 12.3"},{"id":218,"text":"Thử cấp tốc độ ổn định thuốc thú y hỗ trợ doanh nghiệp trong việc gì sau đây?","answers":["A. Quảng bá thương hiệu sản phẩm","B. Đánh giá nhu cầu thị trường","C. Dự đoán hạn dùng và xác định điều kiện bảo quản hợp lý","D. Thay đổi cơ cấu tổ chức sản xuất"],"correct":2,"explanation":"Đáp án đúng là: Dự đoán hạn dùng và xác định điều kiện bảo quản hợp lý Vì: Kết quả thử cấp tốc giúp dự đoán hạn dùng, chọn bao bì và tối ưu công thức.","reference":"Mục 12.2"},{"id":219,"text":"Một trong các chỉ tiêu cần theo dõi trong thử cấp tốc độ ổn định thuốc thú y là gì?","answers":["A. Hiệu quả sinh học trên vật nuôi","B. Khả năng hấp thu qua da","C. Chi phí sản xuất sản phẩm","D. Hàm lượng hoạt chất chính"],"correct":3,"explanation":"Đáp án đúng là: Hàm lượng hoạt chất chính Vì: Hàm lượng hoạt chất là chỉ tiêu cơ bản để đánh giá độ ổn định của thuốc.","reference":"Mục 12.2"},{"id":220,"text":"Qua việc phân tích kết quả, doanh nghiệp có thể xác định được yếu tố nào sau đây?","answers":["A. Phương pháp điều trị bệnh mới","B. Số lượng đại lý phân phối","C. Giá bán lẻ tối ưu","D. Thời gian sử dụng (hạn dùng) của thuốc"],"correct":3,"explanation":"Đáp án đúng là: Thời gian sử dụng (hạn dùng) của thuốc Vì: Phân tích kết quả giúp tính toán hạn dùng chính thức của sản phẩm.","reference":"Mục 12.4"},{"id":221,"text":"Mục đích chính của thử cấp tốc độ ổn định đối với thuốc thú y là gì?","answers":["A. Xác định giá bán sản phẩm","B. Thử nghiệm tác dụng lâm sàng","C. Đánh giá nhanh xu hướng biến đổi của sản phẩm trong điều kiện khắc nghiệt","D. Nghiên cứu công thức điều chế mới"],"correct":2,"explanation":"Đáp án đúng là: Đánh giá nhanh xu hướng biến đổi của sản phẩm trong điều kiện khắc nghiệt Vì: Thử cấp tốc giúp nhanh chóng đánh giá độ ổn định trong điều kiện nhiệt độ, độ ẩm cao.","reference":"Mục 12.2"},{"id":222,"text":"Điều kiện tiêu chuẩn về nhiệt độ và độ ẩm trong thử dài hạn độ ổn định thuốc thú y là gì?","answers":["A. 30°C ± 2°C và 65% ± 5% RH","B. 25°C ± 2°C và 60% ± 5% RH","C. 40°C ± 2°C và 75% ± 5% RH","D. 15°C ± 2°C và 45% ± 5% RH"],"correct":1,"explanation":"Đáp án đúng là: 25°C ± 2°C và 60% ± 5% RH Vì: Thử dài hạn thực hiện ở nhiệt độ phòng (25°C) và độ ẩm 60% tương đối.","reference":"Mục 12.3"},{"id":223,"text":"Phương pháp nào sau đây dùng để xác định độ cứng, độ mài mòn, độ hòa tan của thuốc?","answers":["A. Phân tích vật lý","B. Phân tích nhiệt độ","C. Phân tích vi sinh","D. Phân tích hóa học"],"correct":0,"explanation":"Đáp án đúng là: Phân tích vật lý Vì: Phân tích vật lý kiểm tra các đặc tính cơ học và độ bền của thuốc.","reference":"Mục 12.4"},{"id":224,"text":"Nội độc tố là thành phần nào của vi khuẩn Gram âm?","answers":["A. Protein vách tế bào","B. Lipopolysaccharide (LPS)","C. Peptidoglycan","D. DNA plasmid"],"correct":1,"explanation":"Đáp án đúng là: Lipopolysaccharide (LPS) Vì: Nội độc tố là thành phần lipopolysaccharide (LPS) của vách tế bào vi khuẩn Gram âm.","reference":"Mục 7.6"},{"id":225,"text":"Khi thu thập dữ liệu trong thử nghiệm độ ổn định, các mẫu thuốc cần được kiểm tra ở mốc thời gian nào?","answers":["A. 1 tuần, 2 tuần, 1 tháng","B. 6 giờ, 12 giờ, 24 giờ","C. 2 năm, 3 năm, 4 năm","D. 0 tháng, 3 tháng, 6 tháng, 12 tháng, 24 tháng"],"correct":3,"explanation":"Đáp án đúng là: 0 tháng, 3 tháng, 6 tháng, 12 tháng, 24 tháng Vì: Các mốc tiêu chuẩn trong thử nghiệm dài hạn bao gồm 0, 3, 6, 12 và 24 tháng.","reference":"Mục 12.4"},{"id":226,"text":"Đo độ ẩm trong thuốc viên nén nhằm mục đích gì?","answers":["A. Đánh giá độ bền của nhãn mác","B. Kiểm tra độ pH","C. Xác định tốc độ hòa tan","D. Đánh giá nguy cơ ảnh hưởng đến độ ổn định"],"correct":3,"explanation":"Đáp án đúng là: Đánh giá nguy cơ ảnh hưởng đến độ ổn định Vì: Độ ẩm cao có thể gây phân hủy hoặc thay đổi đặc tính thuốc.","reference":"Mục 12.4"},{"id":227,"text":"Phương pháp phổ biến dùng để xác định hàm lượng hoạt chất trong thuốc là gì?","answers":["A. Kiểm tra sinh học","B. Sắc ký lỏng hiệu năng cao (HPLC)","C. Đo nhiệt độ nóng chảy","D. Phân tích cơ học"],"correct":1,"explanation":"Đáp án đúng là: Sắc ký lỏng hiệu năng cao (HPLC) Vì: HPLC là phương pháp định lượng hoạt chất chính xác và phổ biến.","reference":"Mục 12.4"},{"id":228,"text":"Trong phương pháp Gel-clot kiểm tra nội độc tố, kết quả dương tính được xác định như thế nào?","answers":["A. Dung dịch chuyển màu xanh lam","B. Có sự tạo bọt khí mạnh trong ống","C. Dung dịch trở nên trong suốt hoàn toàn","D. Có sự hình thành cục gel giữ nguyên khi nghiêng ống"],"correct":3,"explanation":"Đáp án đúng là: Có sự hình thành cục gel giữ nguyên khi nghiêng ống Vì: Kết quả dương tính khi dung dịch tạo thành cục gel không chảy xuống thành ống nghiệm.","reference":"Mục 7.6"},{"id":229,"text":"Một trong các mục tiêu của phân tích hàm lượng hoạt chất là gì?","answers":["A. Xác định chính xác lượng hoạt chất trong thuốc","B. Xác định pH dung dịch","C. Đo màu sắc của viên thuốc","D. Đánh giá độ trong của thuốc"],"correct":0,"explanation":"Đáp án đúng là: Xác định chính xác lượng hoạt chất trong thuốc Vì: Xác định hàm lượng hoạt chất đảm bảo hiệu quả điều trị và an toàn.","reference":"Mục 12.4"},{"id":230,"text":"Phương pháp nào giúp xác định mối liên hệ giữa thời gian bảo quản và sự thay đổi chất lượng thuốc?","answers":["A. Phân tích cơ học","B. Phân tích màu sắc","C. Phân tích thống kê","D. Phân tích cảm quan"],"correct":2,"explanation":"Đáp án đúng là: Phân tích thống kê Vì: Phân tích thống kê (như hồi quy) giúp mô tả và dự đoán xu hướng thay đổi.","reference":"Mục 12.4"},{"id":231,"text":"Độ hòa tan của thuốc viên nén giúp đánh giá yếu tố nào?","answers":["A. Mùi vị của thuốc","B. Khả năng hấp thu thuốc trong cơ thể","C. Khả năng bảo quản dài hạn","D. Độ bền cơ học của bao bì"],"correct":1,"explanation":"Đáp án đúng là: Khả năng hấp thu thuốc trong cơ thể Vì: Độ hòa tan liên quan trực tiếp đến mức độ hấp thu thuốc sau sử dụng.","reference":"Mục 12.4"},{"id":232,"text":"Phương pháp phổ biến nhất để kiểm tra nội độc tố trong thuốc tiêm thú y là gì?","answers":["A. Phương pháp đo độ dẫn điện","B. Phương pháp quang phổ UV","C. Phương pháp sắc ký lỏng HPLC","D. Phương pháp LAL (Limulus Amebocyte Lysate)"],"correct":3,"explanation":"Đáp án đúng là: Phương pháp LAL (Limulus Amebocyte Lysate) Vì: Phương pháp LAL dùng Lysate từ tế bào amebocyte của cua móng ngựa để phát hiện nội độc tố.","reference":"Mục 7.6"},{"id":233,"text":"Một yêu cầu quan trọng khi thực hiện kiểm tra nội độc tố bằng phương pháp gel-clot là gì?","answers":["A. Tuân thủ nghiêm ngặt điều kiện vô trùng","B. Ủ mẫu ở nhiệt độ phòng","C. Kiểm tra bằng ánh sáng cực tím","D. Sử dụng dung dịch có độ pH thấp"],"correct":0,"explanation":"Đáp án đúng là: Tuân thủ nghiêm ngặt điều kiện vô trùng Vì: Điều kiện vô trùng tuyệt đối cần thiết để tránh nhiễm tạp và sai lệch kết quả.","reference":"Mục 7.6"}];
</script>

<script>
(function () {
  var LETTERS = "ABCDEFGHIJ";
  var container = document.getElementById("questionContainer");
  var noResults = document.getElementById("noResults");
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");
  var countEl = document.getElementById("searchCount");
  var total = QUESTIONS.length;

  /* ── Escape HTML ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── Highlight từ khóa ── */
  function highlight(text, term) {
    if (!term) return esc(text);
    var safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return esc(text).replace(
      new RegExp("(" + safe.replace(/&amp;/g, "&amp;amp;") + ")", "gi"),
      "<mark>$1</mark>"
    );
  }

  /* ── Render 1 câu hỏi ── */
  function renderQ(q, term) {
    var answersHtml = q.answers.map(function (ans, i) {
      var isCorrect = i === q.correct;
      var cls = "answer-item" + (isCorrect ? " correct" : "");
      var check = isCorrect ? '<span class="check-mark">&#10003;</span>' : "";
      return (
        '<div class="' + cls + '">' +
        '<span class="answer-letter">' + (LETTERS[i] || i + 1) + ".</span>" +
        '<span class="answer-text">' + highlight(ans, term) + "</span>" +
        check +
        "</div>"
      );
    }).join("");

    var feedbackHtml = "";
    if (q.explanation || q.reference) {
      feedbackHtml =
        '<div class="feedback-section">' +
        (q.explanation
          ? "<p><strong>Vì: </strong>" + esc(q.explanation) + "</p>"
          : "") +
        (q.reference
          ? "<p><strong>Tham khảo: </strong>" + esc(q.reference) + "</p>"
          : "") +
        "</div>";
    }

    return (
      '<div class="question-block" id="q' + q.id + '">' +
      '<div class="question-header">' +
      '<span class="q-badge">Câu ' + q.id + "</span>" +
      "</div>" +
      '<div class="question-text">' + highlight(q.text, term) + "</div>" +
      '<div class="answers">' + answersHtml + "</div>" +
      feedbackHtml +
      "</div>"
    );
  }

  /* ── Render danh sách câu hỏi ── */
  function renderList(filtered, term) {
    // Xóa các block cũ (giữ lại #noResults)
    var old = container.querySelectorAll(".question-block");
    old.forEach(function (el) { el.remove(); });

    if (filtered.length === 0) {
      noResults.style.display = "block";
    } else {
      noResults.style.display = "none";
      var frag = document.createDocumentFragment();
      filtered.forEach(function (q) {
        var div = document.createElement("div");
        div.innerHTML = renderQ(q, term);
        frag.appendChild(div.firstChild);
      });
      container.appendChild(frag);
    }

    countEl.innerHTML =
      "<strong>" + filtered.length + "</strong> / " + total + " câu";
  }

  /* ── Lọc câu hỏi ── */
  function doSearch(term) {
    var t = term.trim().toLowerCase();
    var filtered = t
      ? QUESTIONS.filter(function (q) {
          return (
            q.text.toLowerCase().includes(t) ||
            q.answers.some(function (a) { return a.toLowerCase().includes(t); })
          );
        })
      : QUESTIONS;

    searchClear.style.display = term ? "block" : "none";
    renderList(filtered, term.trim());
  }

  /* ── Khởi tạo ── */
  renderList(QUESTIONS, "");

  searchInput.addEventListener("input", function () {
    doSearch(this.value);
  });
  searchClear.addEventListener("click", function () {
    searchInput.value = "";
    doSearch("");
    searchInput.focus();
  });

  /* ── Scroll to top ── */
  var scrollBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", function () {
    scrollBtn.style.display = window.scrollY > 320 ? "flex" : "none";
  }, { passive: true });
  scrollBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
