<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập - Kỹ Thuật Bào Chế Sinh Dược Học (233 câu)</title>
<style>
:root {
  --blue:      #2563eb;
  --blue-dark: #1e40af;
  --blue-bg:   #eff6ff;
  --green:     #16a34a;
  --green-bg:  #f0fdf4;
  --green-bd:  #86efac;
  --yellow-bg: #fefce8;
  --yellow-bd: #fde047;
  --gray:      #6b7280;
  --gray-lt:   #f3f4f6;
  --border:    #e5e7eb;
  --text:      #111827;
  --radius:    12px;
  --shadow:    0 1px 4px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f1f5f9; color: var(--text);
  line-height: 1.65; font-size: 15px;
}

/* ── HEADER ── */
.page-header {
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
  color: #fff; padding: 28px 20px 22px; text-align: center;
  position: relative;
}
.page-header h1 { font-size: clamp(1.1em, 4vw, 1.7em); font-weight: 700; margin-bottom: 5px; }
.page-header p  { opacity: .85; font-size: .88em; }
.back-btn {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.35);
  color: #fff; padding: 6px 13px; border-radius: 7px;
  text-decoration: none; font-size: .82em; font-weight: 600;
  white-space: nowrap; transition: background .15s; line-height: 1.4;
}
.back-btn:hover { background: rgba(255,255,255,.3); }
@media (max-width: 480px) {
  .back-btn { position: static; transform: none; display: inline-block;
              margin-bottom: 10px; font-size: .8em; }
  .page-header { padding-top: 16px; }
}

/* ── SEARCH BAR ── */
.search-wrap {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.search-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px;
}
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%; padding: 9px 36px 9px 38px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .95em; outline: none; background: var(--gray-lt);
  transition: border-color .15s, background .15s;
  -webkit-appearance: none;
}
.search-box input:focus { border-color: var(--blue); background: #fff; }
.search-icon {
  position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%); color: var(--gray);
  pointer-events: none; font-size: 1em;
}
.search-clear {
  position: absolute; right: 9px; top: 50%;
  transform: translateY(-50%); background: none; border: none;
  cursor: pointer; color: var(--gray); font-size: 1.1em;
  padding: 2px 4px; display: none; line-height: 1; border-radius: 50%;
}
.search-clear:hover { color: #111; background: var(--gray-lt); }
.search-count {
  white-space: nowrap; font-size: .88em; color: var(--gray);
  min-width: 90px; text-align: right;
}
.search-count strong { color: var(--blue-dark); }

/* ── CONTAINER ── */
.container {
  max-width: 860px; margin: 18px auto;
  padding: 0 14px 80px;
}

/* ── QUESTION CARD ── */
.question-block {
  background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 16px;
  border-left: 4px solid var(--blue);
  overflow: hidden;
  transition: box-shadow .15s;
}
.question-block:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.08);
}

.question-header {
  display: flex; align-items: center; gap: 8px;
  background: var(--blue-bg); padding: 8px 14px;
  border-bottom: 1px solid #dbeafe;
}
.q-badge {
  background: var(--blue); color: #fff;
  border-radius: 20px; padding: 1px 9px;
  font-size: .78em; font-weight: 700; letter-spacing: .3px;
}

.question-text {
  padding: 14px 16px 8px;
  font-size: 1em; font-weight: 500; color: #1e293b;
}
.question-text mark {
  background: #fef08a; color: inherit;
  border-radius: 3px; padding: 0 2px;
}

/* ── ANSWERS ── */
.answers {
  padding: 4px 16px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.answer-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--gray-lt);
}
.answer-item.correct {
  background: var(--green-bg);
  border-color: var(--green-bd);
  font-weight: 600;
}
.answer-letter {
  font-weight: 700; font-size: .9em;
  width: 22px; flex-shrink: 0; padding-top: 1px; color: var(--gray);
}
.answer-item.correct .answer-letter { color: var(--green); }
.answer-text {
  flex: 1; color: #374151; font-size: .95em;
}
.answer-item.correct .answer-text { color: #14532d; }
.answer-text mark {
  background: #bbf7d0; color: inherit;
  border-radius: 3px; padding: 0 2px;
}
.check-mark {
  flex-shrink: 0; margin-left: auto; padding-left: 6px;
  color: var(--green); font-weight: 700;
}

/* ── FEEDBACK ── */
.feedback-section {
  background: var(--yellow-bg);
  border-top: 1.5px solid var(--yellow-bd);
  padding: 10px 16px; font-size: .875em; color: #44403c;
}
.feedback-section p { margin: 3px 0; }
.feedback-section strong { color: #1c1917; }

/* ── EMPTY STATE ── */
#noResults {
  display: none; text-align: center;
  padding: 60px 20px; color: var(--gray);
}
#noResults .nr-icon { font-size: 2.5em; margin-bottom: 12px; }
#noResults p { font-size: .95em; }

/* ── SCROLL TOP ── */
#scrollTopBtn {
  position: fixed; bottom: 20px; right: 16px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--blue); color: #fff; border: none;
  font-size: 1.3em; cursor: pointer; display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(37,99,235,.4);
  transition: background .15s, transform .15s;
  z-index: 200; text-decoration: none;
  line-height: 44px; text-align: center;
}
#scrollTopBtn:hover { background: var(--blue-dark); transform: translateY(-2px); }

/* ── MOBILE ── */
@media (max-width: 600px) {
  body { font-size: 14px; }
  .page-header { padding: 18px 14px 14px; }
  .container { margin: 12px auto; padding: 0 10px 80px; }
  .question-text { padding: 12px 12px 6px; }
  .answers { padding: 4px 12px 10px; gap: 5px; }
  .answer-item { padding: 7px 10px; }
  .feedback-section { padding: 9px 12px; }
  .search-count { display: none; }
}
</style>
</head>

  <a href="index.html" class="back-btn">&#8592; Trang ch&#7911;</a>

</div>

<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="search" id="searchInput"
             placeholder="Tìm câu hỏi hoặc đáp án..." autocomplete="off">
      <button class="search-clear" id="searchClear" title="Xóa">&#10005;</button>
    </div>
    <div class="search-count" id="searchCount">
      <strong>233</strong> / 233 câu
    </div>
  </div>
</div>

<div class="container" id="questionContainer">
  <div id="noResults">
    <div class="nr-icon">&#128269;</div>
    <p>Không tìm thấy câu hỏi phù hợp.</p>
  </div>
</div>

<script>
const QUESTIONS = [{"id":1,"text":"Động vật dùng trong thí nghiệm phải đáp ứng yêu cầu gì?","answers":["A. Có độ tuổi lớn, không có thai","B. Có khả năng sinh sản tốt","C. Đồng đều về nòi giống, khoẻ mạnh, không nhiễm bệnh","D. Được nuôi dưỡng trong môi trường tự nhiên"],"correct":2,"explanation":"Đáp án đúng là: Đồng đều về nòi giống, khoẻ mạnh, không nhiễm bệnh Vì: Động vật thí nghiệm cần đồng đều về nòi giống, khoẻ mạnh, không nhiễm bệnh, và không có thai để đảm bảo độ chính xác của phép thử.","reference":"Mục 5.2"},{"id":2,"text":"Xu hướng thay thế và giảm thiểu thử nghiệm trên động vật là gì?","answers":["A. 2D: Design, Development","B. 4M: Monitor, Model, Measure, Manage","C. 3R: Replacement, Reduction, Refinement","D. 1P: Prediction"],"correct":2,"explanation":"Đáp án đúng là: 3R: Replacement, Reduction, Refinement Vì: Xu hướng \"3R\" (Replacement, Reduction, Refinement) nhằm giảm thiểu và thay thế thử nghiệm trên động vật trong kiểm nghiệm dược phẩm.","reference":"Mục 5.2"},{"id":3,"text":"Môi trường nào thường được dùng để thử vô trùng trong kiểm nghiệm thuốc?","answers":["A. Môi trường Canh thang cao thịt","B. Môi trường Thioglycolat lỏng và Casein đậu tương lỏng","C. Môi trường Sabouraud đặc","D. Môi trường thạch thông thường"],"correct":1,"explanation":"Đáp án đúng là: Môi trường Thioglycolat lỏng và Casein đậu tương lỏng Vì: Môi trường Thioglycolat lỏng và Casein đậu tương lỏng thường được dùng để thử vi khuẩn và vi nấm trong kiểm nghiệm thuốc.","reference":"Mục 5.3"},{"id":4,"text":"Chất chuẩn trong phương pháp sinh học có vai trò gì?","answers":["A. Đánh giá chất lượng chất thử","B. Cải thiện độ bền của thuốc","C. Tăng cường tác dụng của thuốc thử","D. Giảm độ độc tính của thuốc"],"correct":0,"explanation":"Đáp án đúng là: Đánh giá chất lượng chất thử Vì: Kết quả thử nghiệm sinh học được đánh giá bằng toán thống kê để đảm bảo độ chính xác, vì thử nghiệm có thể phụ thuộc vào nhiều yếu tố không ổn định.","reference":"Mục 5.1"},{"id":5,"text":"Phương pháp nuôi cấy trực tiếp trong thử vô trùng có ưu điểm gì?","answers":["A. Phát hiện chính xác ngay cả khi vi sinh vật ít","B. Dễ dàng phát hiện vi sinh vật trong mẫu","C. Kiểm tra hiệu quả với mẫu có tác dụng ức chế","D. Kỹ thuật đơn giản"],"correct":3,"explanation":"Đáp án đúng là: Kỹ thuật đơn giản Vì: Phương pháp nuôi cấy trực tiếp có kỹ thuật đơn giản, nhưng có thể khó phát hiện vi sinh vật khi số lượng ít.","reference":"Mục 5.3"},{"id":6,"text":"Chất chuẩn thứ cấp khác gì với chất chuẩn gốc?","answers":["A. Có độ tinh khiết thấp, không có hoạt tính sinh học","B. Có độ tinh khiết cao, hoạt tính sinh học xác định theo chất chuẩn gốc","C. Là chất có nguồn gốc tự nhiên, không qua xử lý","D. Là chất chuẩn không có hoạt tính sinh học"],"correct":1,"explanation":"Đáp án đúng là: Có độ tinh khiết cao, hoạt tính sinh học xác định theo chất chuẩn gốc Vì: Chất chuẩn phải được bảo quản trong các ống thủy tinh, ở nhiệt độ dưới 5°C, trong điều kiện khô, tránh ánh sáng để duy trì tính chính xác.","reference":"Mục 5.1"},{"id":7,"text":"Mục đích của thử nghiệm xác định hiệu lực của vaccin là gì?","answers":["A. Kiểm tra tác dụng phụ của vaccin","B. Đo lường khả năng tạo miễn dịch hoặc trung hòa độc tố","C. Đánh giá mức độ ổn định của vaccin","D. Xác định liều lượng vaccin"],"correct":1,"explanation":"Đáp án đúng là: Đo lường khả năng tạo miễn dịch hoặc trung hòa độc tố Vì: Thử nghiệm hiệu lực vaccin đo lường khả năng tạo miễn dịch hoặc khả năng trung hòa độc tố của vaccin.","reference":"Mục 5.2"},{"id":8,"text":"Mục đích của thử nghiệm chất hạ huyết áp là gì?","answers":["A. Phát hiện chất gây sốt trong thuốc","B. Đo sự tương tác của thuốc với máu","C. Kiểm tra sự thay đổi huyết áp sau khi ăn","D. Đánh giá tác dụng làm giảm huyết áp của thuốc"],"correct":3,"explanation":"Đáp án đúng là: Đánh giá tác dụng làm giảm huyết áp của thuốc Vì: Thử nghiệm chất hạ huyết áp giúp đánh giá tác dụng của thuốc trong việc làm giảm huyết áp, đặc biệt trong điều trị tăng huyết áp.","reference":"Mục 5.2"},{"id":9,"text":"Khi nuôi cấy mẫu trong môi trường thạch Sabouraud, nhiệt độ ủ thích hợp cho vi nấm là gì?","answers":["A. 25 - 28°C","B. 30 - 35°C","C. 20 - 25°C","D. 35 - 40°C"],"correct":0,"explanation":"Đáp án đúng là: 25 - 28°C Vì: Nhiệt độ ủ thích hợp cho vi nấm trong môi trường thạch Sabouraud là 25 - 28°C.","reference":"Mục 5.3"},{"id":10,"text":"Nguyên tắc của phương pháp thử vô trùng dựa trên yếu tố nào?","answers":["A. Vi sinh vật chỉ phát triển trong môi trường khô","B. Vi sinh vật không thể phát triển khi thiếu oxygen","C. Vi sinh vật phát triển trên môi trường dinh dưỡng, làm đục môi trường","D. Môi trường cần giữ nhiệt độ ổn định"],"correct":2,"explanation":"Đáp án đúng là: Vi sinh vật phát triển trên môi trường dinh dưỡng, làm đục môi trường Vì: Nguyên tắc thử vô trùng là vi sinh vật có trong chế phẩm sẽ phát triển trên môi trường dinh dưỡng, làm đục môi trường lỏng.","reference":"Mục 5.3"},{"id":11,"text":"Ưu điểm chính của việc sử dụng động vật trong kiểm nghiệm thuốc là gì?","answers":["A. Giảm thiểu chi phí và thời gian thử nghiệm","B. Cải thiện kết quả thử nghiệm trong ống nghiệm","C. Tăng khả năng kiểm tra các phản ứng bất lợi","D. Cung cấp dữ liệu an toàn và hiệu quả trên sinh vật sống"],"correct":3,"explanation":"Đáp án đúng là: Cung cấp dữ liệu an toàn và hiệu quả trên sinh vật sống Vì: Sử dụng động vật trong kiểm nghiệm thuốc giúp cung cấp dữ liệu an toàn và hiệu quả trên sinh vật sống có cơ chế sinh lý tương tự người.","reference":"Mục 5.2"},{"id":12,"text":"Mục đích của thử vô trùng trong kiểm nghiệm thuốc là gì?","answers":["A. Kiểm tra chất lượng dược liệu","B. Đánh giá độ ổn định của chế phẩm thuốc","C. Xác định tính năng bảo quản của thuốc","D. Phát hiện sự có mặt của vi khuẩn, vi nấm trong các chế phẩm cần vô trùng"],"correct":3,"explanation":"Đáp án đúng là: Phát hiện sự có mặt của vi khuẩn, vi nấm trong các chế phẩm cần vô trùng Vì: Thử vô trùng nhằm mục đích phát hiện sự có mặt của vi khuẩn, vi nấm trong các chế phẩm cần vô trùng.","reference":"Mục 5.3"},{"id":13,"text":"Thử nghiệm chất gây sốt nhằm mục đích gì?","answers":["A. Phát hiện sự hiện diện của chất gây sốt trong thuốc tiêm","B. Xác định mức độ an toàn của thuốc tiêm","C. Đo nhiệt độ cơ thể của động vật thí nghiệm","D. Kiểm tra sự tác dụng của thuốc trong điều trị sốt"],"correct":0,"explanation":"Đáp án đúng là: Phát hiện sự hiện diện của chất gây sốt trong thuốc tiêm Vì: Mục đích của thử nghiệm chất gây sốt là phát hiện sự có mặt của chất gây sốt trong thuốc tiêm.","reference":"Mục 5.2"},{"id":14,"text":"Thử nghiệm in vitro khác với in vivo ở điểm nào?","answers":["A. In vitro chỉ dùng cho thuốc tiêm truyền","B. In vitro là thử nghiệm trên cơ thể động vật sống","C. Thử nghiệm in vitro thực hiện trên cơ quan cô lập, hoặc điều kiện mô phỏng","D. Thử nghiệm in vivo không cần động vật"],"correct":2,"explanation":"Đáp án đúng là: Thử nghiệm in vitro thực hiện trên cơ quan cô lập Vì: Thử nghiệm in vitro được thực hiện trên cơ quan cô lập của động vật, trong khi in vivo thực hiện trên cơ thể động vật sống.","reference":"Mục 5.2"},{"id":15,"text":"Phương pháp sinh học thường được sử dụng để kiểm tra đặc tính nào của dược phẩm?","answers":["A. Độ mài mòn của viên thuốc","B. Hoạt tính sinh học của thuốc","C. Tính an toàn về mặt vật lý","D. Thành phần hóa học của thuốc"],"correct":1,"explanation":"Đáp án đúng là: Hoạt tính sinh học của thuốc Vì: Chất chuẩn gốc có độ tinh khiết cao và thường được làm tại các viện nghiên cứu quốc gia hoặc quốc tế chuyên về chất chuẩn sinh học.","reference":"Mục 5.1"},{"id":16,"text":"Phép thử độc tính bất thường giúp xác định gì?","answers":["A. Độ an toàn lâu dài của thuốc","B. Khả năng gây dị ứng của thuốc","C. Hiệu quả của thuốc trong điều trị bệnh","D. Mức độ độc cấp tính của thuốc"],"correct":3,"explanation":"Đáp án đúng là: Mức độ độc cấp tính của thuốc Vì: Thử độc tính bất thường giúp xác định mức độ độc cấp tính của thuốc khi sử dụng liều cao.","reference":"Mục 5.2"},{"id":17,"text":"Phương pháp nào dưới đây có thể được sử dụng để thử vô trùng?","answers":["A. Phương pháp tách ly tâm","B. Phương pháp ủ nhiệt độ cao","C. Phương pháp lọc qua màng lọc","D. Phương pháp chiếu xạ"],"correct":2,"explanation":"Đáp án đúng là: Phương pháp lọc qua màng lọc Vì: Phương pháp lọc qua màng lọc được sử dụng để thử vô trùng, đặc biệt với thuốc kháng sinh.","reference":"Mục 5.3"},{"id":18,"text":"Phương pháp kiểm nghiệm thuốc trên động vật dựa trên yếu tố nào?","answers":["A. Sự tương thích của thuốc với các hóa chất khác","B. Môi trường thí nghiệm và thiết bị","C. Thành phần hóa học của thuốc thử","D. Sự đáp ứng của động vật thí nghiệm với chế phẩm"],"correct":3,"explanation":"Đáp án đúng là: Sự đáp ứng của động vật thí nghiệm với chế phẩm Vì: Kiểm nghiệm thuốc trên động vật dựa trên phản ứng của động vật đối với thuốc thử để đánh giá chất lượng của chế phẩm.","reference":"Mục 5.2"},{"id":19,"text":"Nguyên tắc của phương pháp sinh học trong kiểm nghiệm thuốc là gì?","answers":["A. So sánh hiệu lực tác dụng của chất thử với chất chuẩn trong điều kiện thí nghiệm giống nhau","B. Đo lường độ hòa tan của thuốc trong môi trường nước","C. Phân tích thành phần hóa học của thuốc","D. Đo độ cứng của viên thuốc"],"correct":0,"explanation":"Đáp án đúng là: So sánh hiệu lực tác dụng của chất thử với chất chuẩn trong điều kiện thí nghiệm giống nhau Vì: Chất chuẩn trong thử nghiệm sinh học giúp đánh giá chất lượng của chất thử bằng cách so sánh với chất chuẩn trong cùng điều kiện thí nghiệm.","reference":"Mục 5.1"},{"id":20,"text":"Định lượng các hormon được sử dụng để làm gì trong kiểm nghiệm thuốc?","answers":["A. Phát hiện tác dụng phụ của thuốc","B. Đo độ ổn định của thuốc","C. Xác định hàm lượng hoạt chất sinh học trong chế phẩm","D. Kiểm tra tính an toàn của thuốc"],"correct":2,"explanation":"Đáp án đúng là: Xác định hàm lượng hoạt chất sinh học trong chế phẩm Vì: Thử nghiệm định lượng hormon giúp xác định chính xác hàm lượng hoạt chất sinh học trong các chế phẩm hormon.","reference":"Mục 5.2"},{"id":21,"text":"Đặc điểm nào dưới đây của màng lọc được sử dụng trong phương pháp lọc qua màng lọc?","answers":["A. Màng lọc có thể thấm dung dịch nước nóng","B. Lỗ màng lọc có đường kính > 0,45µm","C. Lỗ màng lọc có đường kính ≤ 0,45µm","D. Màng lọc không cần tiệt trùng"],"correct":2,"explanation":"Đáp án đúng là: Lỗ màng lọc có đường kính ≤ 0,45µm Vì: Lỗ màng lọc trong phương pháp lọc qua màng lọc có đường kính ≤ 0,45µm để giữ lại vi sinh vật.","reference":"Mục 5.3"},{"id":22,"text":"Khi lấy mẫu thử cho thử vô trùng, số lượng đơn vị lấy mẫu sẽ như thế nào?","answers":["A. Lấy 3 đơn vị nếu lô thuốc có ít hơn 100 đơn vị","B. Lấy 5 đơn vị cho bất kỳ lô thuốc nào","C. Lấy 10 đơn vị nếu lô thuốc có hơn 200 đơn vị","D. Lấy tất cả các đơn vị trong lô thuốc"],"correct":0,"explanation":"Đáp án đúng là: Lấy 3 đơn vị nếu lô thuốc có ít hơn 100 đơn vị Vì: Khi một lô có ít hơn 100 đơn vị, lấy 3 đơn vị để kiểm nghiệm.","reference":"Mục 5.3"},{"id":23,"text":"Thử in vivo được thực hiện trên loại gì?","answers":["A. Môi trường ống nghiệm","B. Các cơ quan cô lập của động vật","C. Các mô tế bào ngoài cơ thể","D. Cơ thể động vật sống"],"correct":3,"explanation":"Đáp án đúng là: Cơ thể động vật sống Vì: Thử in vivo là thử nghiệm trên cơ thể động vật sống để đánh giá tác dụng của thuốc.","reference":"Mục 5.2"},{"id":24,"text":"Thử nghiệm tính an toàn của vaccin giúp làm gì?","answers":["A. Kiểm tra hiệu quả của vaccin","B. Xác định tác dụng phụ của vaccin","C. Đo lường liều lượng vaccin","D. Đảm bảo vaccin không gây phản ứng có hại nghiêm trọng"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo vaccin không gây phản ứng có hại nghiêm trọng Vì: Mục đích thử nghiệm tính an toàn của vaccin là đảm bảo rằng vaccin không gây phản ứng có hại nghiêm trọng đối với cơ thể sống.","reference":"Mục 5.2"},{"id":25,"text":"Phương pháp sinh học trong kiểm nghiệm thuốc được áp dụng để đánh giá đặc tính nào?","answers":["A. Thành phần hóa học của thuốc","B. Đặc tính vật lý của thuốc","C. Độ hòa tan của thuốc","D. Hoạt lực tác dụng của chất kháng sinh"],"correct":3,"explanation":"Đáp án đúng là: Hoạt lực tác dụng của chất kháng sinh Vì: Phương pháp sinh học chủ yếu dùng để xác định các đặc tính sinh học như hoạt lực tác dụng của chất kháng sinh, sự vô trùng, độc tính, hiệu lực và tính an toàn của vaccine.","reference":"Mục 5.1"},{"id":26,"text":"Phương pháp đo pH nào được dùng trong kiểm nghiệm chính thức?","answers":["A. Dùng máy đo pH (pH meter)","B. Quan sát bằng mắt thường","C. Đo bằng nhiệt kế điện tử","D. Dùng giấy quỳ tím"],"correct":0,"explanation":"Đáp án đúng là: Dùng máy đo pH (pH meter) Vì: Máy đo pH cho kết quả chính xác, được sử dụng trong kiểm nghiệm chính thức.","reference":"Mục 6.4"},{"id":27,"text":"Mục đích chính của việc kiểm tra độ nhiễm khuẩn trong dung dịch thuốc thú y là gì?","answers":["A. Giảm chi phí sản xuất","B. Làm tăng tác dụng của thuốc","C. Đảm bảo an toàn cho vật nuôi và hiệu quả điều trị","D. Tăng tốc độ hấp thu thuốc"],"correct":2,"explanation":"Đáp án đúng là: Đảm bảo an toàn cho vật nuôi và hiệu quả điều trị Vì: Kiểm tra nhiễm khuẩn giúp ngăn ngừa các nguy cơ nhiễm trùng cho vật nuôi và đảm bảo thuốc phát huy tác dụng.","reference":"Mục 6.6"},{"id":28,"text":"Phương pháp nào sau đây phù hợp nhất để kiểm tra thể tích dung dịch trong dây chuyền sản xuất lớn?","answers":["A. Lắc nhẹ để ước lượng thể tích","B. Đo bằng nhiệt kế thủy ngân","C. Sử dụng máy đo thể tích tự động","D. Nhỏ từng giọt vào cốc đong"],"correct":2,"explanation":"Đáp án đúng là: Sử dụng máy đo thể tích tự động Vì: Máy đo thể tích tự động giúp kiểm tra nhanh, chính xác và phù hợp với quy mô công nghiệp.","reference":"Mục 6.3"},{"id":29,"text":"Trong kiểm tra độ trong, bước nào sau đây cần thực hiện trước khi tiến hành đo bằng turbidimeter?","answers":["A. Đun nóng dung dịch đến 60°C","B. Hiệu chuẩn thiết bị với dung dịch chuẩn","C. Thêm chất chỉ thị màu vào mẫu","D. Lắc mạnh dung dịch trước khi đo"],"correct":1,"explanation":"Đáp án đúng là: Hiệu chuẩn thiết bị với dung dịch chuẩn Vì: Hiệu chuẩn với dung dịch chuẩn giúp đảm bảo độ chính xác cho kết quả đo độ đục.","reference":"Mục 6.2"},{"id":30,"text":"Thiết bị nào sau đây có thể đánh giá chính xác số lượng và kích thước hạt trong dung dịch tiêm truyền?","answers":["A. Máy đo pH","B. Máy đếm tiểu phân tự động","C. Máy đo độ nhớt","D. Cân phân tích điện tử"],"correct":1,"explanation":"Đáp án đúng là: Máy đếm tiểu phân tự động Vì: Máy đếm tiểu phân tự động có độ chính xác cao, dùng để kiểm tra độ trong trong các dung dịch yêu cầu nghiêm ngặt như dung dịch tiêm truyền.","reference":"Mục 6.2"},{"id":31,"text":"Khi đo tỷ trọng, yếu tố nào cần kiểm soát để đảm bảo độ chính xác?","answers":["A. Loại chai lọ đựng dung dịch","B. Độ ẩm không khí","C. Màu sắc của dung dịch","D. Nhiệt độ dung dịch đo"],"correct":3,"explanation":"Đáp án đúng là: Nhiệt độ dung dịch đo Vì: Tỷ trọng phụ thuộc vào nhiệt độ, do đó cần kiểm tra ở nhiệt độ quy định hoặc hiệu chỉnh kết quả.","reference":"Mục 6.5"},{"id":32,"text":"Khi kiểm tra bằng thiết bị đo độ đục (turbidimeter), ánh sáng tán xạ thường được đo ở góc bao nhiêu?","answers":["A. 90 độ","B. 180 độ","C. 45 độ","D. 0 độ"],"correct":0,"explanation":"Đáp án đúng là: 90 độ Vì: Turbidimeter đo ánh sáng tán xạ tại góc 90 độ để xác định giá trị độ đục của dung dịch.","reference":"Mục 6.2"},{"id":33,"text":"Màu sắc của thuốc cần phù hợp với tiêu chuẩn nào?","answers":["A. Màu sắc do chuyên gia đánh giá bằng cảm tính","B. Tiêu chuẩn cảm quan của các thuốc khác","C. Tiêu chuẩn đã đăng ký","D. Màu sắc theo quy định chung của dược điển"],"correct":2,"explanation":"Đáp án đúng là: Tiêu chuẩn đã đăng ký Vì: Màu sắc thuốc cần phù hợp với tiêu chuẩn đã đăng ký để đảm bảo tính ổn định và chất lượng sản phẩm.","reference":"Mục 6.1"},{"id":34,"text":"Vì sao cần tuân thủ quy định pháp lý về độ nhiễm khuẩn trong thuốc thú y?","answers":["A. Để giảm số lần tiêm cho vật nuôi","B. Vì quy định bắt buộc phải làm xét nghiệm máu","C. Để đảm bảo chất lượng và tránh gây hại cho người sử dụng và vật nuôi","D. Vì thuốc có thể tự vô trùng sau một thời gian"],"correct":2,"explanation":"Đáp án đúng là: Để đảm bảo chất lượng và tránh gây hại cho người sử dụng và vật nuôi Vì: Quy định về độ nhiễm khuẩn nhằm đảm bảo sản phẩm an toàn cho vật nuôi, người sử dụng và đúng tiêu chuẩn chất lượng.","reference":"Mục 6.6"},{"id":35,"text":"Mục đích chính của việc kiểm tra độ trong dung dịch là gì?","answers":["A. Xác định hoạt chất chính","B. Kiểm tra độ ổn định hóa học","C. Đánh giá độ tinh khiết và chất lượng dung dịch","D. Kiểm tra khả năng hấp thu ánh sáng"],"correct":2,"explanation":"Đáp án đúng là: Đánh giá độ tinh khiết và chất lượng dung dịch Vì: Độ trong giúp phát hiện sự hiện diện của tạp chất, hạt rắn không tan ảnh hưởng đến chất lượng và an toàn sản phẩm.","reference":"Mục 6.2"},{"id":36,"text":"Ưu điểm chính của Densitometer là gì?","answers":["A. Đo nhanh, chính xác, tự động","B. Không bị ảnh hưởng bởi nhiệt độ","C. Có thể dùng cho mọi loại chất rắn và lỏng","D. Không cần điện để hoạt động"],"correct":0,"explanation":"Đáp án đúng là: Đo nhanh, chính xác, tự động Vì: Densitometer là thiết bị hiện đại, độ chính xác cao, thường dùng trong sản xuất quy mô lớn.","reference":"Mục 6.5"},{"id":37,"text":"Khi kiểm tra cảm quan dung dịch thuốc, cần quan sát dưới loại ánh sáng nào?","answers":["A. Ánh sáng tự nhiên hoặc ánh sáng trắng tiêu chuẩn","B. Ánh sáng huỳnh quang xanh","C. Ánh sáng nhân tạo thông thường","D. Ánh sáng vàng ấm để dễ nhận diện màu"],"correct":0,"explanation":"Đáp án đúng là: Ánh sáng tự nhiên hoặc ánh sáng trắng tiêu chuẩn Vì: Quan sát bằng ánh sáng tự nhiên hoặc trắng tiêu chuẩn giúp phát hiện chính xác màu sắc, độ đục, dị vật.","reference":"Mục 6.1"},{"id":38,"text":"Phương pháp nào dưới đây đo tỷ trọng bằng nguyên lý nổi của vật trong dung dịch?","answers":["A. Phương pháp chuẩn độ thể tích","B. Phương pháp dùng Densitometer","C. Phương pháp dùng thủy kế (hydrometer)","D. Phương pháp sắc ký lỏng"],"correct":2,"explanation":"Đáp án đúng là: Phương pháp dùng thủy kế (hydrometer) Vì: Thủy kế hoạt động dựa trên nguyên lý nổi, đọc kết quả theo mức chìm của dụng cụ trong dung dịch.","reference":"Mục 6.5"},{"id":39,"text":"Tỷ trọng của dung dịch là gì?","answers":["A. Là tỷ lệ giữa nồng độ và thể tích","B. Là tỷ lệ giữa khối lượng riêng và nồng độ","C. Là tỷ lệ giữa thể tích và nhiệt độ","D. Là tỷ lệ giữa khối lượng và thể tích của dung dịch"],"correct":3,"explanation":"Đáp án đúng là: Là tỷ lệ giữa khối lượng và thể tích của dung dịch Vì: Tỷ trọng được xác định bằng công thức ρ = m/V, là chỉ tiêu quan trọng trong kiểm nghiệm dung dịch.","reference":"Mục 6.5"},{"id":40,"text":"Khi sử dụng máy đo pH, bước nào sau đây là cần thiết để đảm bảo độ chính xác?","answers":["A. Hiệu chuẩn thiết bị bằng dung dịch chuẩn","B. Nhúng điện cực vào bất kỳ dung dịch nào","C. Sử dụng ngay khi lấy ra khỏi hộp","D. Đo ở nhiệt độ bất kỳ"],"correct":0,"explanation":"Đáp án đúng là: Hiệu chuẩn thiết bị bằng dung dịch chuẩn Vì: Hiệu chuẩn thiết bị trước khi đo giúp đảm bảo kết quả pH chính xác.","reference":"Mục 6.4"},{"id":41,"text":"Vì sao không nên kiểm tra cảm quan trong điều kiện ánh sáng yếu hoặc ánh sáng có màu sắc không tự nhiên?","answers":["A. Gây sai lệch kết quả định lượng hoạt chất","B. Không ảnh hưởng đáng kể đến cảm quan","C. Làm mẫu thử bị biến tính","D. Dễ gây sai lệch khi quan sát màu sắc, độ trong và dị vật"],"correct":3,"explanation":"Đáp án đúng là: Dễ gây sai lệch khi quan sát màu sắc, độ trong và dị vật Vì: Ánh sáng không phù hợp khiến việc quan sát trở nên kém chính xác, có thể bỏ sót các dấu hiệu bất thường.","reference":"Mục 6.1"},{"id":42,"text":"Mục đích chính của việc kiểm tra pH dung dịch thuốc thú y là gì?","answers":["A. Xác định hàm lượng hoạt chất","B. Xác định độ hòa tan của tá dược","C. Kiểm tra độ nhớt của thuốc","D. Đảm bảo ổn định và an toàn của thuốc"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo ổn định và an toàn của thuốc Vì: pH ảnh hưởng đến sự ổn định hoạt chất và an toàn khi sử dụng, đặc biệt với thuốc tiêm.","reference":"Mục 6.4"},{"id":43,"text":"Việc nhẹ nhàng mở nắp và ngửi thuốc giúp phát hiện điều gì?","answers":["A. Độ bay hơi của dung môi","B. Mùi lạ hoặc bất thường","C. Nồng độ hoạt chất dễ bay hơi","D. Thời hạn sử dụng của thuốc"],"correct":1,"explanation":"Đáp án đúng là: Mùi lạ hoặc bất thường Vì: Mùi bất thường có thể là dấu hiệu của sự phân hủy, nhiễm khuẩn hoặc thay đổi thành phần.","reference":"Mục 6.1"},{"id":44,"text":"Một lọ dung dịch có nhãn ghi 10 ml, thực tế đo được 9,8 ml. Theo tiêu chuẩn cho phép ±10%, vậy kết luận lọ thuốc này như nào?","answers":["A. Không đạt vì thiếu thể tích","B. Phải kiểm tra lại độ đục","C. Bị loại ngay lập tức","D. Vẫn đạt yêu cầu"],"correct":3,"explanation":"Đáp án đúng là: Vẫn đạt yêu cầu Vì: 9,8 ml nằm trong khoảng cho phép 9,0–11,0 ml nên vẫn đạt yêu cầu.","reference":"Mục 6.3"},{"id":45,"text":"Yêu cầu kỹ thuật khi đọc mức thể tích trên dụng cụ đo là gì?","answers":["A. Đọc trong điều kiện ánh sáng mờ","B. Đọc nhanh để tránh bay hơi","C. Mắt phải ngang tầm với mức dung dịch","D. Đọc từ phía trên miệng bình"],"correct":2,"explanation":"Đáp án đúng là: Mắt phải ngang tầm với mức dung dịch Vì: Đọc ngang tầm tránh sai số do góc nhìn (hiện tượng parallax).","reference":"Mục 6.3"},{"id":46,"text":"Trong phương pháp cân gián tiếp để kiểm tra thể tích, cần thêm thông tin nào để tính được thể tích?","answers":["A. Độ nhớt của dung dịch","B. Nhiệt độ môi trường","C. Tỷ lệ phần trăm hoạt chất","D. Khối lượng riêng của dung dịch"],"correct":3,"explanation":"Đáp án đúng là: Khối lượng riêng của dung dịch Vì: Từ khối lượng dung dịch và khối lượng riêng, ta tính được thể tích chính xác.","reference":"Mục 6.3"},{"id":47,"text":"pH quá thấp hoặc quá cao trong thuốc thú y có thể gây hậu quả gì?","answers":["A. Làm thuốc dễ bay hơi hơn","B. Không gây ảnh hưởng gì","C. Gây kích ứng, tổn thương mô ở vật nuôi","D. Làm tăng hiệu lực thuốc"],"correct":2,"explanation":"Đáp án đúng là: Gây kích ứng, tổn thương mô ở vật nuôi Vì: Thuốc có pH không phù hợp dễ gây viêm, kích ứng tại vị trí tiêm.","reference":"Mục 6.4"},{"id":48,"text":"Phương pháp cảm quan giúp phát hiện điều gì trong kiểm nghiệm thuốc?","answers":["A. Đo độ tan và độ rã của thuốc","B. Đánh giá nhanh và tổng quát các đặc điểm bên ngoài của thuốc","C. Kiểm tra độ tinh khiết của dung môi","D. Xác định thành phần hoạt chất trong thuốc"],"correct":1,"explanation":"Đáp án đúng là: Đánh giá nhanh và tổng quát các đặc điểm bên ngoài của thuốc Vì: Phương pháp cảm quan giúp phát hiện nhanh các sai sót về hình thức, màu sắc, mùi vị, bao bì có thể ảnh hưởng đến chất lượng và an toàn của thuốc.","reference":"Mục 6.1"},{"id":49,"text":"Sau khi đo pH bằng máy, việc xử lý điện cực đúng là gì?","answers":["A. Ngâm điện cực trong nước muối sinh lý","B. Để khô hoàn toàn rồi cất","C. Dùng khăn lau mạnh điện cực","D. Rửa bằng nước cất và bảo quản đúng cách"],"correct":3,"explanation":"Đáp án đúng là: Rửa bằng nước cất và bảo quản đúng cách Vì: Việc vệ sinh và bảo quản đúng giúp duy trì độ chính xác và tuổi thọ điện cực.","reference":"Mục 6.4"},{"id":50,"text":"Kiểm tra thể tích dung dịch nhằm mục đích gì?","answers":["A. Đánh giá mức độ hòa tan của dược chất","B. Đảm bảo lượng dung dịch thực tế phù hợp với thể tích ghi nhãn","C. Xác định độ tinh khiết của dung dịch","D. Kiểm tra độ ổn định của hoạt chất"],"correct":1,"explanation":"Đáp án đúng là: Đảm bảo lượng dung dịch thực tế phù hợp với thể tích ghi nhãn Vì: Việc kiểm tra giúp đảm bảo người dùng nhận đúng lượng thuốc như cam kết trên nhãn.","reference":"Mục 6.3"},{"id":51,"text":"Điều kiện khi lấy mẫu tại nơi chứa sản phẩm là gì?","answers":["A. Không gây nhiễm bẩn và không bị tác động làm thay đổi tính chất mẫu","B. Bất kỳ nơi nào thuận tiện","C. Nơi có thể lấy mẫu nhanh nhất","D. Nơi gần phòng kiểm nghiệm nhất"],"correct":0,"explanation":"Đáp án đúng là: Không gây nhiễm bẩn và không bị tác động làm thay đổi tính chất mẫu Vì: Theo quy định về kỹ thuật lấy mẫu thuốc thú y để kiểm nghiệm","reference":"Mục 2.1"},{"id":52,"text":"Khi so sánh độ đục trong thử nghiệm, phải quan sát như thế nào?","answers":["A. Nhìn nghiêng","B. Nhìn từ trên xuống","C. Nhìn từ dưới lên","D. Nhìn ngang nền tối"],"correct":1,"explanation":"Đáp án đúng là: Nhìn từ trên xuống Vì: Quan sát độ đục phải nhìn từ trên xuống để dễ phát hiện sự khác biệt.","reference":"Mục 3.2"},{"id":53,"text":"Chỉ thị màu nào thường được sử dụng để xác định điểm tương đương trong chuẩn độ acid-base?","answers":["A. Vàng methylphenol","B. Tím phenol","C. Màu xanh bromothymol","D. Tím metyl"],"correct":3,"explanation":"Đáp án đúng là: Tím metyl Vì: Tím metyl là chỉ thị màu phổ biến để xác định điểm tương đương trong môi trường khan.","reference":"Mục 3.3"},{"id":54,"text":"Phương pháp nào dưới đây phù hợp nhất để kiểm tra sự nhiễm khuẩn trong dung dịch thuốc thú y có độ trong cao?","answers":["A. Phương pháp màng lọc (Membrane Filtration Method)","B. Phương pháp bộ test nhanh (Rapid Test Kits)","C. Phương pháp PCR","D. Phương pháp cấy trực tiếp (Direct Plating Method)"],"correct":0,"explanation":"Đáp án đúng là: Phương pháp màng lọc (Membrane Filtration Method) Vì: Phương pháp màng lọc rất hiệu quả đối với dung dịch trong suốt, giúp giữ lại vi sinh vật trên màng lọc và cấy lên môi trường nuôi cấy để phát hiện nhiễm khuẩn.","reference":"Mục 6.6"},{"id":55,"text":"Mục đích của phương pháp kiểm tra độ đồng đều hàm lượng trong dung dịch thuốc thú y là gì?","answers":["A. Đảm bảo hàm lượng hoạt chất đồng đều trong dung dịch","B. Xác định sự hiện diện của các thành phần trong thuốc","C. Kiểm tra mức độ nhiễm khuẩn trong dung dịch","D. Xác định tỷ trọng của dung dịch"],"correct":0,"explanation":"Đáp án đúng là: Đảm bảo hàm lượng hoạt chất đồng đều trong dung dịch Vì: Mục đích của phương pháp kiểm tra độ đồng đều hàm lượng là đảm bảo rằng hàm lượng hoạt chất trong dung dịch thuốc đồng đều, giúp thuốc phát huy hiệu quả điều trị đồng nhất.","reference":"Mục 6.11"},{"id":56,"text":"Ứng dụng nào sau đây thuộc về phổ hấp thụ UV-Vis trong kiểm nghiệm thuốc thú y?","answers":["A. Đo kích thước hạt","B. Đo tốc độ hòa tan","C. Xác định độ nhớt của dung dịch","D. Xác định hàm lượng kháng sinh trong dung dịch"],"correct":3,"explanation":"Đáp án đúng là: Xác định hàm lượng kháng sinh trong dung dịch Vì: UV-Vis giúp xác định hàm lượng hoạt chất như kháng sinh.","reference":"Mục 4.1"},{"id":57,"text":"Sổ tay kiểm nghiệm viên được coi là gì?","answers":["A. Biên bản kiểm tra","B. Phiếu giao mẫu","C. Chứng từ gốc của các số liệu","D. Hồ sơ lô sản xuất"],"correct":2,"explanation":"Đáp án đúng là: Chứng từ gốc của các số liệu Vì: Theo quy định các vấn đề tiến hành kiểm nghiệm thuốc thú y","reference":"Mục 2.2"},{"id":58,"text":"Trong sắc ký lớp mỏng, chất hấp phụ phổ biến là gì?","answers":["A. Aluminun oxide","B. Polyamide","C. Silica gel","D. Cellulose"],"correct":2,"explanation":"Đáp án đúng là: Silica gel Vì: Silica gel là chất hấp phụ phổ biến trong sắc ký lớp mỏng.","reference":"Mục 4.2"},{"id":59,"text":"Mục đích của kiểm tra định tính dung dịch thuốc thú y là gì?","answers":["A. Xác định lượng hoạt chất có trong dung dịch","B. Xác định sự hiện diện của thành phần trong dung dịch","C. Phát hiện các tạp chất trong thuốc","D. Đảm bảo thuốc không có tác dụng phụ"],"correct":1,"explanation":"Đáp án đúng là: Xác định sự hiện diện của thành phần trong dung dịch Vì: Mục đích của kiểm tra định tính là xác định sự hiện diện của các thành phần hoạt chất, giúp phát hiện các lỗi trong quá trình sản xuất hoặc bảo quản.","reference":"Mục 6.7"},{"id":60,"text":"Ai là người chịu trách nhiệm kiểm tra niêm phong khi nhận mẫu qua đường bưu điện?","answers":["A. Người giao mẫu","B. Người lấy mẫu","C. Người gửi mẫu","D. Bộ phận nhận mẫu của cơ quan kiểm nghiệm"],"correct":3,"explanation":"Đáp án đúng là: Bộ phận nhận mẫu của cơ quan kiểm nghiệm Vì: Theo quy định các vấn đề tiến hành kiểm nghiệm thuốc thú y","reference":"Mục 2.2"},{"id":61,"text":"Mẫu thuốc do thanh tra lấy về phải kèm theo gì?","answers":["A. Giấy phép sản xuất","B. Biên bản lấy mẫu","C. Giấy giới thiệu","D. Giấy chứng nhận kiểm nghiệm"],"correct":1,"explanation":"Đáp án đúng là: Biên bản lấy mẫu Vì: Theo quy định các vấn đề tiến hành kiểm nghiệm thuốc thú y","reference":"Mục 2.2"},{"id":62,"text":"Ion sắt (II) được phát hiện bằng phản ứng:","answers":["A. Tạo màu đỏ với dung dịch phenol","B. Tạo màu xanh với dung dịch hexacyanoferrat (III)","C. Tạo màu nâu đỏ với dung dịch iod","D. Tạo màu vàng với dung dịch cromat"],"correct":1,"explanation":"Đáp án đúng là: Tạo màu xanh với dung dịch hexacyanoferrat (III) Vì: Ion Fe²⁺ tạo phức màu xanh Prussian với ion hexacyanoferrat (III).","reference":"Mục 3.1"},{"id":63,"text":"Phương pháp nào dưới đây là một trong những phương pháp kiểm tra định tính dung dịch thuốc thú y?","answers":["A. Phương pháp chuẩn độ","B. Phản ứng hóa học đặc trưng","C. Phương pháp quang phổ UV-Vis","D. Phương pháp khối lượng"],"correct":1,"explanation":"Đáp án đúng là: Phản ứng hóa học đặc trưng Vì: Phản ứng hóa học đặc trưng là phương pháp kiểm tra định tính, giúp phát hiện sự hiện diện của thành phần qua phản ứng hóa học đặc trưng như thay đổi màu sắc hoặc hình thành kết tủa.","reference":"Mục 6.8"},{"id":64,"text":"Biên bản lấy mẫu phải có gì để hợp lệ?","answers":["A. Chỉ cần chữ ký của người lấy mẫu","B. Không cần chữ ký xác nhận","C. Phải có đủ chữ ký xác nhận của người lấy mẫu và cơ sở được lấy mẫu","D. Chỉ cần có dấu của cơ sở"],"correct":2,"explanation":"Đáp án đúng là: Phải có đủ chữ ký xác nhận của người lấy mẫu và cơ sở được lấy mẫu Vì: Theo quy định về kỹ thuật lấy mẫu thuốc thú y để kiểm nghiệm","reference":"Mục 2.1"},{"id":65,"text":"Phương pháp nào dưới đây sử dụng phản ứng miễn dịch, hóa học hoặc phát quang để phát hiện vi sinh vật trong dung dịch thuốc thú y?","answers":["A. Phương pháp màng lọc (Membrane Filtration Method)","B. Phương pháp bộ test nhanh (Rapid Test Kits)","C. Phương pháp cấy trực tiếp (Direct Plating Method)","D. Phương pháp PCR"],"correct":1,"explanation":"Đáp án đúng là: Phương pháp bộ test nhanh (Rapid Test Kits) Vì: Phương pháp bộ test nhanh sử dụng phản ứng hóa học hoặc miễn dịch để phát hiện vi sinh vật, thường thay đổi màu sắc khi có vi khuẩn.","reference":"Mục 6.6"},{"id":66,"text":"Kiểm tra định lượng dung dịch thuốc thú y nhằm mục đích gì?","answers":["A. Đảm bảo thuốc có lượng hoạt chất chính xác","B. Kiểm tra độ đồng đều hàm lượng","C. Xác định sự hiện diện của các thành phần","D. Phát hiện các tạp chất"],"correct":0,"explanation":"Đáp án đúng là: Đảm bảo thuốc có lượng hoạt chất chính xác Vì: Kiểm tra định lượng giúp xác định chính xác lượng hoạt chất trong dung dịch, đảm bảo thuốc phát huy tác dụng hiệu quả khi điều trị.","reference":"Mục 6.9"},{"id":67,"text":"Phương pháp nào dưới đây thường được sử dụng để định lượng các hoạt chất trong dung dịch thuốc thú y?","answers":["A. Phương pháp quang phổ UV-Vis","B. Phương pháp chuẩn độ","C. Phương pháp cấy trực tiếp","D. Phương pháp sắc ký lỏng"],"correct":1,"explanation":"Đáp án đúng là: Phương pháp chuẩn độ Vì: Phương pháp chuẩn độ là phương pháp phổ biến để định lượng hoạt chất trong dung dịch thuốc thú y, dựa vào phản ứng giữa chất cần xác định và dung dịch chuẩn.","reference":"Mục 6.10"},{"id":68,"text":"Theo Quyết định 72/2007/QĐ-BNN, thuốc thú y nào phải kiểm tra chất lượng?","answers":["A. Thuốc thú y đã hết hạn sử dụng","B. Thuốc thú y trong danh mục hoặc được duyệt nhập khẩu phục vụ sản xuất, phòng chống dịch","C. Thuốc thú y phục vụ triển lãm","D. Thuốc thú y là hàng mẫu"],"correct":1,"explanation":"Đáp án đúng là: Thuốc thú y trong danh mục hoặc được duyệt nhập khẩu phục vụ sản xuất, phòng chống dịch Vì: Các quy định về kiểm tra chất lượng thuốc thú y","reference":"Mục 1.2"},{"id":69,"text":"Trong phương pháp chuẩn độ acid-base trong môi trường khan, điện cực chỉ thị thường là gì?","answers":["A. Điện cực thủy tinh","B. Điện cực kim loại","C. Điện cực calomel","D. Điện cực bạc clorid"],"correct":0,"explanation":"Đáp án đúng là: Điện cực thủy tinh Vì: Điện cực thủy tinh là điện cực chỉ thị thường dùng trong chuẩn độ acid-base môi trường khan.","reference":"Mục 3.3"},{"id":70,"text":"Thuốc kém phẩm chất là gì?","answers":["A. Thuốc bị nhiễm bẩn nhẹ","B. Giá thành cao hơn tiêu chuẩn","C. Thuốc được quảng cáo sai sự thật","D. Thuốc không đạt tiêu chuẩn kỹ thuật đã đăng ký"],"correct":3,"explanation":"Đáp án đúng là: Thuốc không đạt tiêu chuẩn kỹ thuật đã đăng ký Vì: Đặc điểm của thuốc và yêu cầu chất lượng thuốc","reference":"Mục 1.1"},{"id":71,"text":"Thiết bị nào dùng để ghi phổ hấp thụ UV-Vis?","answers":["A. Máy quang phổ UV-Vis","B. Máy ly tâm","C. Kính hiển vi điện tử","D. Máy đo pH"],"correct":0,"explanation":"Đáp án đúng là: Máy quang phổ UV-Vis Vì: Máy quang phổ UV-Vis là thiết bị chuyên dụng cho phép ghi phổ hấp thụ.","reference":"Mục 4.1"},{"id":72,"text":"Khi thử tạp chất về màu, quan sát như thế nào?","answers":["A. Nhìn từ dưới lên","B. Nhìn qua nền đen","C. Nhìn ngang trên nền trắng","D. Không cần nền"],"correct":2,"explanation":"Đáp án đúng là: Nhìn ngang trên nền trắng Vì: Khi quan sát màu, cần nhìn ngang trên nền trắng để so màu chính xác.","reference":"Mục 3.2"},{"id":73,"text":"Trong kiểm tra khối lượng chế phẩm dạng bột, khối lượng thuốc được xác định bằng cách nào?","answers":["A. Cân thuốc cùng vỏ rồi chia đôi khối lượng.","B. Dựa vào thể tích và khối lượng riêng của thuốc.","C. Dự đoán từ khối lượng trung bình của 3 mẫu.","D. Lấy hiệu số giữa hai lần cân trước và sau khi loại bỏ thuốc khỏi vỏ."],"correct":3,"explanation":"Đáp án đúng là: Lấy hiệu số giữa hai lần cân trước và sau khi loại bỏ thuốc khỏi vỏ. Vì: Cách xác định chính xác khối lượng thuốc là lấy hiệu số giữa khối lượng cả thuốc và vỏ ban đầu, và khối lượng vỏ sau khi làm sạch.","reference":"Mục 7.3"},{"id":74,"text":"Khi kiểm tra thuốc tiêm thể tích nhỏ hơn hoặc bằng 5ml, cần lấy bao nhiêu ống để tiến hành đo thể tích?","answers":["A. Lấy 3 ống, đo cả 3","B. Lấy 6 ống, dùng 1 ống để tráng, 5 ống để đo","C. Lấy 5 ống, đo cả 5","D. Lấy 4 ống, đo cả 4"],"correct":1,"explanation":"Đáp án đúng là: Lấy 6 ống, dùng 1 ống để tráng, 5 ống để đo Vì: Theo hướng dẫn, cần lấy 6 ống thuốc, tráng bơm tiêm bằng 1 ống và sử dụng 5 ống còn lại để đo thể tích nhằm đảm bảo tính chính xác và đại diện.","reference":"Mục 7.3"},{"id":75,"text":"Chế phẩm đạt yêu cầu khi có bao nhiêu đơn vị có giá trị hàm lượng nằm ngoài khoảng 85-115% của hàm lượng trung bình?","answers":["A. Không quá 1 đơn vị","B. Không quá 2 đơn vị","C. Không quá 3 đơn vị","D. Không quá 4 đơn vị"],"correct":0,"explanation":"Đáp án đúng là: Không quá 1 đơn vị Vì: Chế phẩm đạt yêu cầu nếu không có quá 1 đơn vị có giá trị hàm lượng nằm ngoài khoảng 85-115% của hàm lượng trung bình.","reference":"Mục 7.9"},{"id":76,"text":"Phương pháp đơn giản, nhanh và dễ thực hiện để kiểm tra pH trong điều kiện thực địa là gì?","answers":["A. Dùng thiết bị đo độ nhớt","B. Sử dụng giấy chỉ thị pH","C. Sử dụng máy đo độ tan","D. Dùng máy quang phổ hấp thụ UV"],"correct":1,"explanation":"Đáp án đúng là: Sử dụng giấy chỉ thị pH Vì: Giấy chỉ thị pH là phương pháp đơn giản, tiện lợi, cho kết quả nhanh, phù hợp với điều kiện thực địa hoặc kiểm tra sơ bộ.","reference":"Mục 7.4"},{"id":77,"text":"Phương pháp phổ biến nhất hiện nay để kiểm tra nội độc tố là gì?","answers":["A. Phản ứng với Lysate tế bào amebocyte cua móng ngựa (LAL test)","B. Phản ứng kết tủa bạc","C. Đo độ nhớt dung dịch","D. Sắc ký lỏng hiệu năng cao (HPLC)"],"correct":0,"explanation":"Đáp án đúng là: Phản ứng với Lysate tế bào amebocyte cua móng ngựa (LAL test) Vì: LAL test sử dụng enzyme từ tế bào amebocyte của cua móng ngựa, là phương pháp chính xác và được sử dụng rộng rãi để phát hiện nội độc tố.","reference":"Mục 7.6"},{"id":78,"text":"Một trong các phương pháp kiểm tra thể tích thuốc tiêm là gì?","answers":["A. Sử dụng giấy đo pH","B. Đo độ nhớt của dung dịch","C. Phương pháp cân gián tiếp (dùng khối lượng)","D. Kiểm tra màu sắc"],"correct":2,"explanation":"Đáp án đúng là: Phương pháp cân gián tiếp (dùng khối lượng) Vì: Phương pháp cân gián tiếp dựa vào khối lượng của thuốc tiêm, là một trong các phương pháp xác định thể tích thông qua khối lượng và tỉ trọng.","reference":"Mục 7.3"},{"id":79,"text":"Một trong những phương pháp kiểm tra pH phổ biến hiện nay là gì?","answers":["A. Đun sôi dung dịch rồi quan sát màu sắc","B. Dùng kính hiển vi để soi mẫu","C. Sử dụng máy đo pH (pH meter)","D. Sử dụng đèn cực tím để phát hiện tia huỳnh quang"],"correct":2,"explanation":"Đáp án đúng là: Sử dụng máy đo pH (pH meter) Vì: Máy đo pH là phương pháp chính xác, phổ biến và được sử dụng rộng rãi trong kiểm nghiệm dược phẩm để xác định pH.","reference":"Mục 7.4"},{"id":80,"text":"Phương pháp kiểm tra chất gây sốt phổ biến hiện nay là gì?","answers":["A. Sắc ký lỏng","B. Thử nghiệm trên thỏ","C. Kiểm tra bằng máy quang phổ","D. Phản ứng gel-clot"],"correct":1,"explanation":"Đáp án đúng là: Thử nghiệm trên thỏ Vì: Phương pháp thử nghiệm trên thỏ được sử dụng để phát hiện chất gây sốt bằng cách theo dõi sự thay đổi nhiệt độ cơ thể thỏ sau khi tiêm thuốc.","reference":"Mục 7.7"},{"id":81,"text":"Khi kiểm tra khối lượng chế phẩm bột, phép thử được tiến hành trên bao nhiêu đơn vị mẫu?","answers":["A. 9 đơn vị bất kỳ","B. 10 đơn vị liên tiếp","C. 5 đơn vị đầu tiên trong lô","D. 3 đơn vị có khối lượng lớn nhất"],"correct":0,"explanation":"Đáp án đúng là: 9 đơn vị bất kỳ Vì: Theo quy định, cần tiến hành phép thử với 9 đơn vị bất kỳ để đảm bảo tính đại diện và độ chính xác trong kiểm nghiệm.","reference":"Mục 7.3"},{"id":82,"text":"Mục đích của kiểm tra độ vô khuẩn trong thuốc tiêm thú y là gì?","answers":["A. Đo pH của dung dịch tiêm","B. Đảm bảo thuốc không chứa vi sinh vật sống gây hại","C. Xác định hàm lượng hoạt chất chính xác","D. Kiểm tra độ ổn định về màu sắc"],"correct":1,"explanation":"Đáp án đúng là: Đảm bảo thuốc không chứa vi sinh vật sống gây hại Vì: Kiểm tra độ vô khuẩn giúp đảm bảo thuốc an toàn tuyệt đối, không gây nhiễm trùng khi tiêm cho động vật.","reference":"Mục 7.5"},{"id":83,"text":"Nội độc tố là thành phần nào sau đây có trong vi khuẩn Gram âm?","answers":["A. Peptidoglycan","B. Lipopolysaccharide (LPS)","C. DNA plasmid","D. Protein vách tế bào"],"correct":1,"explanation":"Đáp án đúng là: Lipopolysaccharide (LPS) Vì: Nội độc tố là LPS – thành phần của vách tế bào vi khuẩn Gram âm, được giải phóng khi vi khuẩn chết.","reference":"Mục 7.6"},{"id":84,"text":"Yêu cầu đối với thỏ dùng để thử nghiệm kiểm tra chất gây sốt là gì?","answers":["A. Thỏ phải khỏe mạnh, cân nặng ít nhất 1,5 kg","B. Thỏ phải là loài động vật hoang dã","C. Thỏ phải có cân nặng trên 2 kg","D. Thỏ có thể khỏe mạnh hoặc bị bệnh nhẹ"],"correct":0,"explanation":"Đáp án đúng là: Thỏ phải khỏe mạnh, cân nặng ít nhất 1,5 kg Vì: Thỏ phải khỏe mạnh, có cân nặng ít nhất 1,5 kg, không bệnh và không có phản ứng bất thường trước khi thử nghiệm.","reference":"Mục 7.7"},{"id":85,"text":"Phép thử độ đồng đều hàm lượng/khối lượng được tiến hành sau phép thử nào?","answers":["A. Định lượng","B. Cảm quan","C. Độ vô khuẩn","D. Độ ổn định"],"correct":0,"explanation":"Đáp án đúng là: Định lượng Vì: Phép thử độ đồng đều hàm lượng/khối lượng được thực hiện sau phép thử định lượng và hàm lượng hoạt chất để đảm bảo tính đồng đều trong sản phẩm.","reference":"Mục 7.9"},{"id":86,"text":"Tác hại chính của nội độc tố trong thuốc tiêm dùng cho thú y là gì?","answers":["A. Làm đổi màu thuốc tiêm","B. Gây dị ứng nhẹ ngoài da","C. Làm giảm tác dụng của hoạt chất","D. Gây sốt, viêm hoặc sốc nhiễm trùng"],"correct":3,"explanation":"Đáp án đúng là: Gây sốt, viêm hoặc sốc nhiễm trùng Vì: Nội độc tố có thể gây phản ứng nghiêm trọng như sốt, viêm hoặc sốc nhiễm trùng, đặc biệt nguy hiểm khi tiêm tĩnh mạch.","reference":"Mục 7.6"},{"id":87,"text":"Khi kiểm tra thể tích thuốc tiêm dưới 5ml, thể tích thực tế phải nằm trong khoảng nào so với thể tích ghi trên nhãn?","answers":["A. 90 - 110%","B. 100 - 115%","C. 95 - 105%","D. 100 - 110%"],"correct":1,"explanation":"Đáp án đúng là: 100 - 115% Vì: Theo quy định, thuốc tiêm đóng ống dưới 5ml phải có thể tích nằm trong khoảng 100 - 115% so với thể tích ghi trên nhãn để đảm bảo đủ liều khi sử dụng.","reference":"Mục 7.3"},{"id":88,"text":"Đối với thuốc tiêm dạng hỗn dịch, yêu cầu sau khi lắc nhẹ là gì?","answers":["A. Không cần lắc nếu để lâu.","B. Có thể phân tán không đều nếu dùng ngay.","C. Chỉ cần không tách lớp là đạt yêu cầu.","D. Phải phân tán đồng nhất và giữ được sự phân tán đủ lâu để lấy đúng liều."],"correct":3,"explanation":"Đáp án đúng là: Phải phân tán đồng nhất và giữ được sự phân tán đủ lâu để lấy đúng liều. Vì: Thuốc tiêm dạng hỗn dịch cần phân tán đồng nhất ngay khi lắc nhẹ và giữ được trạng thái đó trong thời gian đủ để lấy thuốc.","reference":"Mục 7.1"},{"id":89,"text":"Kiểm tra định tính và định lượng của thuốc tiêm nhằm mục đích gì?","answers":["A. Kiểm tra màu sắc và trạng thái của thuốc","B. Kiểm tra độ vô khuẩn của thuốc","C. Kiểm tra khả năng hòa tan của thuốc","D. Đảm bảo thuốc tiêm có hoạt chất đúng theo quy định và đúng hàm lượng"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo thuốc tiêm có hoạt chất đúng theo quy định và đúng hàm lượng Vì: Kiểm tra định tính giúp xác định đúng hoạt chất có trong thuốc, còn định lượng đảm bảo hàm lượng của dược chất trong thuốc tiêm nằm trong giới hạn cho phép.","reference":"Mục 7.8"},{"id":90,"text":"Kểm tra cảm quan dung dịch thuốc tiêm, yêu cầu nào sau đây là đúng?","answers":["A. Dung dịch thuốc tiêm có thể có một ít tủa nhẹ là bình thường.","B. Chỉ cần thuốc không có mùi là đạt.","C. Dung dịch thuốc tiêm phải trong, không có cặn lơ lửng hay đổi màu bất thường.","D. Dung dịch có thể có màu bất kỳ do ánh sáng."],"correct":2,"explanation":"Đáp án đúng là: Dung dịch thuốc tiêm phải trong, không có cặn lơ lửng hay đổi màu bất thường. Vì: Dựa vào cảm quan, thuốc tiêm phải trong, không có cặn lơ lửng, không đổi màu bất thường để đảm bảo chất lượng.","reference":"Mục 7.1"},{"id":91,"text":"Nếu một đơn vị có giá trị hàm lượng nằm ngoài khoảng 85-115% nhưng nằm trong khoảng 75-125%, thì cần phải làm gì?","answers":["A. Chấp nhận kết quả","B. Thử lại trên 20 đơn vị khác","C. Đảm bảo thử lại trên 10 đơn vị khác","D. Không cần thử lại"],"correct":1,"explanation":"Đáp án đúng là: Thử lại trên 20 đơn vị khác Vì: Nếu một đơn vị nằm ngoài giới hạn 85-115% nhưng trong khoảng 75-125%, cần thử lại trên 20 đơn vị khác để xác nhận kết quả.","reference":"Mục 7.9"},{"id":92,"text":"Tiêu chuẩn nào để đánh giá kết quả kiểm tra thuốc không có chất gây sốt bằng thử nghiệm trên thỏ?","answers":["A. Tăng nhiệt độ vượt quá 2,0°C","B. Tổng số tăng nhiệt độ không được vượt quá 1,4°C","C. Nhiệt độ cơ thể phải giảm xuống","D. Không có quy định về tăng nhiệt độ"],"correct":1,"explanation":"Đáp án đúng là: Tổng số tăng nhiệt độ không được vượt quá 1,4°C Vì: Tổng số tăng nhiệt độ của các thỏ thử nghiệm không được vượt quá 1,4°C trong thử nghiệm sơ bộ để đảm bảo không có chất gây sốt.","reference":"Mục 7.7"},{"id":93,"text":"Dấu hiệu nào cho thấy kết quả dương tính trong phương pháp gel-clot?","answers":["A. Dung dịch tạo bọt khí","B. Hình thành cục gel giữ nguyên khi nghiêng ống nghiệm","C. Xuất hiện tủa màu trắng","D. Dung dịch đổi màu sang vàng"],"correct":1,"explanation":"Đáp án đúng là: Hình thành cục gel giữ nguyên khi nghiêng ống nghiệm Vì: Nếu có nội độc tố, dung dịch sẽ hình thành cục gel đông lại và không chảy khi nghiêng ống, chứng tỏ kết quả dương tính.","reference":"Mục 7.6"},{"id":94,"text":"Chất gây sốt (pyrogen) trong thuốc tiêm có thể là gì?","answers":["A. Nội độc tố vi khuẩn Gram âm và các chất khác","B. Các ion kim loại","C. Kháng sinh","D. Vitamin C"],"correct":0,"explanation":"Đáp án đúng là: Nội độc tố vi khuẩn Gram âm và các chất khác Vì: Chất gây sốt bao gồm nội độc tố từ vi khuẩn Gram âm và ngoại độc tố, cũng như các tạp chất trong quá trình sản xuất.","reference":"Mục 7.7"},{"id":95,"text":"Thuốc tiêm dạng dung dịch cần phải đạt yêu cầu nào sau đây về độ trong?","answers":["A. Chấp nhận có cặn nếu được lọc trước khi tiêm.","B. Phải đạt độ trong cho phép, đặc biệt đối với thuốc tiêm và thuốc tiêm truyền.","C. Chỉ cần không đổi màu là đạt yêu cầu.","D. Không cần kiểm tra nếu đã đạt thử nghiệm độ vô khuẩn."],"correct":1,"explanation":"Đáp án đúng là: Phải đạt độ trong cho phép, đặc biệt đối với thuốc tiêm và thuốc tiêm truyền. Vì: Độ trong là tiêu chí quan trọng với thuốc tiêm, đặc biệt là thuốc tiêm truyền, để đảm bảo an toàn khi sử dụng.","reference":"Mục 7.2"},{"id":96,"text":"Khi kiểm tra bao bì và nhãn thuốc tiêm, yêu cầu nào sau đây là đúng?","answers":["A. Không cần quan tâm nhãn nếu thuốc đạt chất lượng.","B. Ống/lọ không nứt vỡ, nhãn đầy đủ thông tin, không lem mờ, đúng quy cách đóng gói.","C. Nhãn có thể thiếu thông tin nếu lọ nhỏ.","D. Chỉ cần không có rò rỉ là đạt yêu cầu."],"correct":1,"explanation":"Đáp án đúng là: Ống/lọ không nứt vỡ, nhãn đầy đủ thông tin, không lem mờ, đúng quy cách đóng gói. Vì: Bao bì và nhãn cần đảm bảo độ nguyên vẹn, đầy đủ thông tin, rõ ràng để đảm bảo an toàn và truy xuất nguồn gốc.","reference":"Mục 7.1"},{"id":97,"text":"Một trong các phương pháp kiểm tra độ vô khuẩn của thuốc tiêm là gì?","answers":["A. Phương pháp đo độ tan","B. Phương pháp đo độ nhớt","C. Phương pháp sắc ký lớp mỏng","D. Phương pháp màng lọc"],"correct":3,"explanation":"Đáp án đúng là: Phương pháp màng lọc Vì: Phương pháp màng lọc là một trong hai phương pháp chính được dùng để kiểm tra độ vô khuẩn, đặc biệt phù hợp với thuốc dạng lỏng.","reference":"Mục 7.5"},{"id":98,"text":"Yêu cầu cảm quan đối với thể chất thuốc mỡ là gì?","answers":["A. Có vết cát nhỏ li ti, có thể tách lớp nhẹ","B. Cứng lại khi để ở nhiệt độ phòng","C. Chảy hoàn toàn ở nhiệt độ cơ thể","D. Mịn, đồng nhất, không tách lớp, không chảy lỏng ở 37°C"],"correct":3,"explanation":"Đáp án đúng là: Mịn, đồng nhất, không tách lớp, không chảy lỏng ở 37°C Vì: Thuốc mỡ đạt yêu cầu khi có thể chất mịn, đồng nhất, không tách lớp và không chảy lỏng ở 37°C.","reference":"Mục 8.1"},{"id":99,"text":"Nếu kiểm tra độ đồng nhất của thuốc mỡ mà không đạt yêu cầu với 4 tiêu bản ban đầu, cách xử lý là gì?","answers":["A. Loại bỏ lô thuốc và không kiểm tra tiếp","B. Thực hiện định tính lại bằng phương pháp khác","C. Tăng khối lượng mẫu thử lên gấp đôi","D. Lặp lại phép thử với 8 đơn vị đóng gói và không được có quá 2 tiêu bản thấy tiểu phân"],"correct":3,"explanation":"Đáp án đúng là: Lặp lại phép thử với 8 đơn vị đóng gói và không được có quá 2 tiêu bản thấy tiểu phân Vì: Nếu kết quả ban đầu không đạt, tiến hành lại phép thử với 8 đơn vị, yêu cầu số tiêu bản thấy tiểu phân không quá 2.","reference":"Mục 8.2"},{"id":100,"text":"Phép thử độ đồng đều hàm lượng/khối lượng cần thực hiện sau khi làm gì?","answers":["A. Sau khi kiểm tra độ rã","B. Sau phép thử định tính và định lượng","C. Sau khi kiểm tra độ hòa tan","D. Sau khi kiểm tra độ vô khuẩn"],"correct":1,"explanation":"Đáp án đúng là: Sau phép thử định tính và định lượng Vì: Phép thử độ đồng đều hàm lượng/khối lượng được tiến hành sau khi thực hiện phép thử định lượng và hàm lượng hoạt chất để đảm bảo tính đồng đều của sản phẩm.","reference":"Mục 8.6"},{"id":101,"text":"Khi đo pH của mẫu thuốc mỡ, bước nào cần thực hiện sau khi nhúng điện cực vào hỗn dịch?","answers":["A. Thêm dung dịch đệm để điều chỉnh pH","B. Khuấy đều mẫu thêm lần nữa","C. Chờ cho chỉ số ổn định và ghi nhận giá trị pH","D. Đo lại pH sau 5 phút"],"correct":2,"explanation":"Đáp án đúng là: Chờ cho chỉ số ổn định và ghi nhận giá trị pH Vì: Sau khi nhúng điện cực vào mẫu, cần chờ cho chỉ số ổn định và ghi nhận giá trị pH hiển thị để đảm bảo kết quả chính xác.","reference":"Mục 8.3"},{"id":102,"text":"Phương pháp nào được sử dụng để đánh giá lượng dược chất giải phóng trong suốt thời gian thử nghiệm?","answers":["A. Phương pháp đo pH","B. Phương pháp đo độ nhớt","C. Phương pháp kiểm tra độ đồng đều khối lượng","D. Phương pháp quang phổ hoặc sắc ký lỏng hiệu năng cao"],"correct":3,"explanation":"Đáp án đúng là: Phương pháp quang phổ hoặc sắc ký lỏng hiệu năng cao Vì: Để xác định lượng dược chất giải phóng, người ta sử dụng phương pháp quang phổ hoặc sắc ký lỏng hiệu năng cao, cho kết quả chính xác về mức độ giải phóng hoạt chất.","reference":"Mục 8.8"},{"id":103,"text":"Máy dò kim loại có ưu điểm gì khi kiểm tra thuốc mỡ?","answers":["A. Phát hiện kim loại không có từ tính","B. Phát hiện các kim loại có tính từ","C. Đo độ hấp thụ quang phổ của kim loại","D. Phát hiện kim loại nặng như chì, cadimi"],"correct":0,"explanation":"Đáp án đúng là: Phát hiện kim loại không có từ tính Vì: Máy dò kim loại có ưu điểm phát hiện được cả các kim loại không có từ tính, giúp kiểm tra chất lượng thuốc mỡ hiệu quả hơn.","reference":"Mục 8.7"},{"id":104,"text":"Khi kiểm tra độ đồng đều khối lượng, bước đầu tiên là gì?","answers":["A. Đo pH của từng đơn vị","B. Lấy bất kỳ 5 đơn vị đóng gói nhỏ nhất và cân từng đơn vị","C. Kiểm tra tính đồng nhất của mẫu thuốc mỡ","D. Đo độ rã của từng đơn vị"],"correct":1,"explanation":"Đáp án đúng là: Lấy bất kỳ 5 đơn vị đóng gói nhỏ nhất và cân từng đơn vị Vì: Bước đầu tiên là lấy bất kỳ 5 đơn vị đóng gói nhỏ nhất và cân từng đơn vị thuốc để kiểm tra độ đồng đều khối lượng.","reference":"Mục 8.6"},{"id":105,"text":"Phương pháp kiểm tra kích thước các phần tử trong thuốc mỡ dưới kính hiển vi yêu cầu gì?","answers":["A. Kiểm tra độ đồng đều khối lượng","B. Quan sát và đếm số lượng các phần tử có kích thước vượt quá quy định","C. Đo độ hòa tan của mẫu thuốc mỡ","D. Đo pH của mẫu thuốc mỡ"],"correct":1,"explanation":"Đáp án đúng là: Quan sát và đếm số lượng các phần tử có kích thước vượt quá quy định Vì: Khi kiểm tra dưới kính hiển vi, cần quan sát và đếm số lượng các phần tử có kích thước vượt quá quy định, đảm bảo kích thước các phần tử không vượt quá giới hạn cho phép.","reference":"Mục 8.7"},{"id":106,"text":"Mục tiêu chính của kiểm tra độ đồng nhất thuốc mỡ là gì?","answers":["A. Xác định độ tan của hoạt chất","B. Đánh giá độ bền cơ học của tuýp thuốc","C. Đảm bảo các tiểu phân phân tán đồng đều trong toàn bộ chế phẩm","D. Kiểm tra độ ổn định về màu sắc"],"correct":2,"explanation":"Đáp án đúng là: Đảm bảo các tiểu phân phân tán đồng đều trong toàn bộ chế phẩm Vì: Độ đồng nhất giúp đảm bảo hoạt chất được phân bố đều, tránh tình trạng liều dùng không đồng nhất khi sử dụng.","reference":"Mục 8.2"},{"id":107,"text":"Phương pháp định tính thuốc mỡ yêu cầu gì?","answers":["A. Đo pH của thuốc mỡ","B. Thuốc mỡ phải có các phản ứng đặc trưng của hoạt chất có trong thành phần chế phẩm","C. Thử nồng độ của các hoạt chất trong thuốc mỡ","D. Kiểm tra độ hòa tan của thuốc mỡ"],"correct":1,"explanation":"Đáp án đúng là: Thuốc mỡ phải có các phản ứng đặc trưng của hoạt chất có trong thành phần chế phẩm Vì: Định tính thuốc mỡ yêu cầu phải có các phản ứng đặc trưng của hoạt chất có trong thành phần chế phẩm để xác định tính chất của thuốc.","reference":"Mục 8.5"},{"id":108,"text":"Trong phép thử độ đồng nhất, yêu cầu đạt là gì khi quan sát 4 tiêu bản đầu tiên?","answers":["A. Ít nhất 3 trong 4 tiêu bản không thấy tiểu phân bằng mắt thường","B. Tất cả 4 tiêu bản không thấy tiểu phân","C. Có thể có 2 tiêu bản thấy tiểu phân nếu các vết còn lại đều rõ","D. Chỉ cần 1 tiêu bản không thấy tiểu phân"],"correct":0,"explanation":"Đáp án đúng là: Ít nhất 3 trong 4 tiêu bản không thấy tiểu phân bằng mắt thường Vì: Phép thử đạt yêu cầu khi 3 trong 4 tiêu bản không thấy tiểu phân, cho thấy sự đồng đều trong chế phẩm.","reference":"Mục 8.2"},{"id":109,"text":"Nếu thuốc mỡ khó phân tán trong quá trình chuẩn bị mẫu thử, cần sử dụng gì?","answers":["A. Nước cất","B. Dung dịch đệm pH 7","C. Dung dịch ethanol","D. Dung môi thích hợp như polysorbat hoặc lecithin vô khuẩn"],"correct":3,"explanation":"Đáp án đúng là: Dung môi thích hợp như polysorbat hoặc lecithin vô khuẩn Vì: Khi thuốc mỡ khó phân tán, có thể sử dụng dung môi thích hợp như polysorbat hoặc lecithin vô khuẩn để hòa tan mẫu.","reference":"Mục 8.4"},{"id":110,"text":"Phương pháp kiểm tra kim loại trong thuốc mỡ bằng nam châm chủ yếu phát hiện phần tử kim loại nào?","answers":["A. Sắt và hợp kim có tính từ","B. Chì và thủy ngân","C. Cadimi và arsen","D. Nhôm và đồng"],"correct":0,"explanation":"Đáp án đúng là: Sắt và hợp kim có tính từ Vì: Phương pháp kiểm tra bằng nam châm chủ yếu phát hiện các phần tử kim loại từ tính như sắt và hợp kim có tính từ.","reference":"Mục 8.7"},{"id":111,"text":"Phương pháp phân tích quang phổ huỳnh quang tia X (XRF) có ưu điểm gì trong kiểm tra kim loại?","answers":["A. Phát hiện kim loại vi lượng và độ chính xác cao","B. Phát hiện kim loại nặng trong sản phẩm","C. Phát hiện kim loại qua phổ hấp thụ","D. Phát hiện kim loại có tính từ"],"correct":0,"explanation":"Đáp án đúng là: Phát hiện kim loại vi lượng và độ chính xác cao Vì: Quang phổ huỳnh quang tia X (XRF) có ưu điểm là phát hiện kim loại vi lượng và cho độ chính xác cao mà không làm hư hỏng mẫu.","reference":"Mục 8.7"},{"id":112,"text":"Để chuẩn bị mẫu thuốc mỡ kiểm tra pH bằng máy đo pH, dung dịch đệm hoặc nước cất nên được thêm vào với lượng nào?","answers":["A. 9 ml","B. 10 ml","C. 8 ml","D. 5 ml"],"correct":0,"explanation":"Đáp án đúng là: 9 ml Vì: Lượng nước cất hoặc dung dịch đệm cần thêm vào là 9 ml để tạo ra hỗn dịch đồng nhất với mẫu thuốc mỡ.","reference":"Mục 8.3"},{"id":113,"text":"Màng nào thường được sử dụng trong phương pháp khuếch tán qua màng để xác định thời gian giải phóng dược chất?","answers":["A. Màng kim loại","B. Màng nhân tạo như Celophan hoặc silicon","C. Màng nhựa PVC","D. Màng cellulose tự nhiên"],"correct":1,"explanation":"Đáp án đúng là: Màng nhân tạo như Celophan hoặc silicon Vì: Màng nhân tạo như Celophan, dẫn chất cellulose, hoặc silicon thường được sử dụng trong phương pháp khuếch tán qua màng để xác định thời gian giải phóng dược chất.","reference":"Mục 8.8"},{"id":114,"text":"Phương pháp khuếch tán qua gel thường được áp dụng với dược chất nào?","answers":["A. Dược chất không bị tác động bởi nhiệt","B. Dược chất tạo màu hoặc phức màu với thuốc thử","C. Dược chất có tính dính cao","D. Dược chất có khả năng hòa tan trong nước"],"correct":1,"explanation":"Đáp án đúng là: Dược chất tạo màu hoặc phức màu với thuốc thử Vì: Phương pháp khuếch tán qua gel được áp dụng với dược chất tạo màu hoặc phức màu với các thuốc thử tan trong môi trường khuếch tán.","reference":"Mục 8.8"},{"id":115,"text":"Khi đánh giá kết quả đo pH, bạn cần làm gì?","answers":["A. Xử lý mẫu trước khi đánh giá","B. Đo lại pH nếu giá trị không ổn định","C. Ghi nhận giá trị pH mà không cần so sánh","D. So sánh giá trị đo được với tiêu chuẩn dược điển"],"correct":3,"explanation":"Đáp án đúng là: So sánh giá trị đo được với tiêu chuẩn dược điển Vì: Sau khi đo pH, kết quả cần được so sánh với tiêu chuẩn dược điển để xác định tính phù hợp của mẫu thuốc mỡ.","reference":"Mục 8.3"},{"id":116,"text":"Khi thực hiện kiểm tra định lượng thuốc mỡ, bước đầu tiên cần làm gì?","answers":["A. Đo độ hòa tan của thuốc mỡ","B. Cân 1 lượng chế phẩm theo chỉ dẫn trong chuyên luận","C. Kiểm tra độ vô khuẩn của thuốc mỡ","D. Cân 5 đơn vị đóng gói nhỏ nhất, tính khối lượng trung bình"],"correct":3,"explanation":"Đáp án đúng là: Cân 5 đơn vị đóng gói nhỏ nhất, tính khối lượng trung bình Vì: Bước đầu tiên trong kiểm tra định lượng là cân 5 đơn vị đóng gói nhỏ nhất, tính khối lượng trung bình để đảm bảo mẫu đại diện cho lô sản xuất.","reference":"Mục 8.5"},{"id":117,"text":"Phương pháp đo kích thước hạt bằng tia laser có ưu điểm gì trong kiểm tra thuốc mỡ?","answers":["A. Phát hiện độ đồng đều pH của thuốc mỡ","B. Phát hiện sự hòa tan của thuốc mỡ","C. Cho kết quả nhanh và chính xác, đánh giá được dải phân bố kích thước","D. Phát hiện các phần tử kim loại trong thuốc mỡ"],"correct":2,"explanation":"Đáp án đúng là: Cho kết quả nhanh và chính xác, đánh giá được dải phân bố kích thước Vì: Phương pháp đo kích thước hạt bằng tia laser cho kết quả nhanh và chính xác, đồng thời đánh giá được dải phân bố kích thước của các phần tử trong thuốc mỡ.","reference":"Mục 8.7"},{"id":118,"text":"Khi kiểm tra độ vô khuẩn của thuốc mỡ, môi trường nào được dùng để phát hiện vi sinh vật kỵ khí và hiếu khí?","answers":["A. Môi trường dịch lỏng dinh dưỡng (Fluid Thioglycollate Medium)","B. Môi trường Sabouraud","C. Môi trường casein đậu nành (Soybean-Casein Digest Medium)","D. Môi trường MRS"],"correct":0,"explanation":"Đáp án đúng là: Môi trường dịch lỏng dinh dưỡng (Fluid Thioglycollate Medium) Vì: Môi trường dịch lỏng dinh dưỡng (Fluid Thioglycollate Medium) được sử dụng để phát hiện vi sinh vật kỵ khí và hiếu khí trong mẫu thuốc mỡ.","reference":"Mục 8.4"},{"id":119,"text":"Khi cấy mẫu thuốc mỡ vào môi trường kiểm tra độ vô khuẩn, cần làm gì?","answers":["A. Cấy mẫu vào một môi trường duy nhất","B. Ủ mẫu ngay mà không cấy","C. Đo pH của mẫu trước khi cấy","D. Phân chia mẫu thử thành hai phần và cấy vào hai loại môi trường"],"correct":3,"explanation":"Đáp án đúng là: Phân chia mẫu thử thành hai phần và cấy vào hai loại môi trường Vì: Mẫu thuốc mỡ cần được phân chia thành hai phần và cấy vào hai loại môi trường khác nhau theo quy định để kiểm tra vi sinh vật.","reference":"Mục 8.4"},{"id":120,"text":"Phương pháp nào được sử dụng để kiểm tra màu sắc và trạng thái của thuốc mỡ?","answers":["A. Chiết tách bằng dung môi","B. Phân tích phổ UV-Vis","C. Đo độ nhớt bằng máy","D. Quan sát bằng mắt thường"],"correct":3,"explanation":"Đáp án đúng là: Quan sát bằng mắt thường Vì: Kiểm tra cảm quan thuốc mỡ sử dụng phương pháp quan sát bằng mắt thường để đánh giá màu sắc và trạng thái.","reference":"Mục 8.1"},{"id":121,"text":"Lượng thuốc mỡ cần lấy để kiểm tra độ vô khuẩn thường là bao nhiêu?","answers":["A. 0.5-1 g","B. 5-10 g","C. 10-20 g","D. 1-3 g"],"correct":3,"explanation":"Đáp án đúng là: 1-3 g Vì: Lượng thuốc mỡ cần lấy cho kiểm tra độ vô khuẩn thường là từ 1-3 g tùy theo yêu cầu của dược điển thú y.","reference":"Mục 8.4"},{"id":122,"text":"Khi chuẩn bị mẫu thuốc mỡ, bước đầu tiên cần làm gì?","answers":["A. Cân chính xác một lượng thuốc mỡ khoảng 1 g","B. Đo pH của thuốc mỡ","C. Thêm 9 ml nước cất","D. Khuấy đều bằng máy khuấy từ"],"correct":0,"explanation":"Đáp án đúng là: Cân chính xác một lượng thuốc mỡ khoảng 1 g Vì: Bước đầu tiên là cân chính xác một lượng thuốc mỡ khoảng 1 g để đảm bảo mẫu chính xác cho việc phân tích sau này.","reference":"Mục 8.3"},{"id":123,"text":"Tiêu chuẩn hàm lượng hoạt chất trong mỗi viên nén thường phải nằm trong khoảng bao nhiêu phần trăm so với hàm lượng ghi trên nhãn thuốc?","answers":["A. 80% - 120%","B. 85% - 115%","C. 75% - 125%","D. 90% - 110%"],"correct":1,"explanation":"Đáp án đúng là: 85% - 115% Vì: Hàm lượng hoạt chất trong mỗi viên thuốc thường phải nằm trong khoảng 85% - 115% so với hàm lượng ghi trên nhãn thuốc để đảm bảo chất lượng và hiệu quả của thuốc.","reference":"Mục 9.6"},{"id":124,"text":"Phương pháp nào sau đây được sử dụng để phát hiện các tạp chất hữu cơ hoặc chất chuyển hóa trong thuốc viên nén?","answers":["A. Sắc ký khí (GC)","B. Quang phổ UV-VIS","C. Quang phổ hấp thụ nguyên tử (AAS)","D. Sắc ký lỏng (HPLC)"],"correct":3,"explanation":"Đáp án đúng là: Sắc ký lỏng (HPLC) Vì: Sắc ký lỏng (HPLC) được sử dụng để phát hiện và định lượng các tạp chất hữu cơ hoặc chất chuyển hóa trong thuốc viên nén.","reference":"Mục 9.7"},{"id":125,"text":"Các yếu tố nào ảnh hưởng đến độ rã của viên thuốc?","answers":["A. Tên nhà sản xuất, nguồn gốc thuốc","B. Chất liệu bao bì, trọng lượng viên thuốc","C. Màu sắc của viên, hình dạng viên thuốc","D. Độ cứng của viên, thành phần tá dược, điều kiện bảo quản, công nghệ bào chế"],"correct":3,"explanation":"Đáp án đúng là: Độ cứng của viên, thành phần tá dược, điều kiện bảo quản, công nghệ bào chế Vì: Các yếu tố như độ cứng của viên, thành phần tá dược, điều kiện bảo quản và công nghệ bào chế đều ảnh hưởng đến thời gian rã của viên thuốc.","reference":"Mục 9.2"},{"id":126,"text":"Tiêu chuẩn yêu cầu đối với thuốc giải phóng nhanh là gì?","answers":["A. ≥ 70% hoạt chất hòa tan trong vòng 60 phút","B. ≥ 50% hoạt chất hòa tan trong vòng 15 phút","C. ≥ 80% hoạt chất hòa tan trong vòng 30 phút","D. ≥ 90% hoạt chất hòa tan trong vòng 10 phút"],"correct":2,"explanation":"Đáp án đúng là: ≥ 80% hoạt chất hòa tan trong vòng 30 phút Vì: Thuốc giải phóng nhanh yêu cầu ≥ 80% hoạt chất hòa tan trong vòng 30 phút để đảm bảo hiệu quả hấp thu trong cơ thể vật nuôi.","reference":"Mục 9.3"},{"id":127,"text":"Tiêu chuẩn độ mài mòn của viên nén không được vượt quá bao nhiêu phần trăm?","answers":["A. 10%","B. 3%","C. 1%","D. 5%"],"correct":2,"explanation":"Đáp án đúng là: 1% Vì: Tiêu chuẩn yêu cầu độ mài mòn của viên nén không được vượt quá 1% để đảm bảo viên thuốc có độ bền cơ học khi vận chuyển.","reference":"Mục 9.4"},{"id":128,"text":"Phương pháp nào được sử dụng để kiểm tra độ mài mòn của viên nén?","answers":["A. Quay viên thuốc trong trống quay và xác định phần trăm khối lượng bị mất","B. Kiểm tra màu sắc và hình dạng viên thuốc","C. Đo thời gian hòa tan trong dung dịch","D. Đo lực nén cần thiết để làm vỡ viên thuốc"],"correct":0,"explanation":"Đáp án đúng là: Quay viên thuốc trong trống quay và xác định phần trăm khối lượng bị mất Vì: Để kiểm tra độ mài mòn, viên thuốc được quay trong trống quay trong một thời gian nhất định, sau đó xác định phần trăm khối lượng bị mất.","reference":"Mục 9.4"},{"id":129,"text":"Trong phương pháp cảm quan, viên thuốc cần có đặc điểm gì về hình dạng?","answers":["A. Có hình dạng bất thường để dễ nhận diện","B. Mềm, dễ nở ra khi ép","C. Được bao phủ bởi lớp vỏ mềm, dễ tháo rời","D. Đúng hình dạng quy định, không mẻ, vỡ hoặc méo mó"],"correct":3,"explanation":"Đáp án đúng là: Đúng hình dạng quy định, không mẻ, vỡ hoặc méo mó Vì: Viên thuốc cần có hình dạng đúng quy định, không bị mẻ, vỡ hoặc méo mó để đảm bảo chất lượng và tính đồng đều của thuốc.","reference":"Mục 9.1"},{"id":130,"text":"Phương pháp nào trong các phương pháp kiểm tra tạp chất là hiệu quả trong việc phát hiện các tạp chất bay hơi trong thuốc viên nén?","answers":["A. Quang phổ UV-VIS","B. Sắc ký khí (GC)","C. Sắc ký lỏng (HPLC)","D. Quang phổ hấp thụ nguyên tử (AAS)"],"correct":1,"explanation":"Đáp án đúng là: Sắc ký khí (GC) Vì: Sắc ký khí (GC) hiệu quả trong việc phát hiện các tạp chất bay hơi hoặc các hợp chất hữu cơ dễ bay hơi trong thuốc viên nén.","reference":"Mục 9.7"},{"id":131,"text":"Mục đích của việc kiểm tra độ cứng trong kiểm nghiệm thuốc viên nén là gì?","answers":["A. Đánh giá màu sắc và hình dạng viên thuốc","B. Đảm bảo viên không bị vỡ hoặc vỡ vụn trong quá trình bảo quản, vận chuyển và sử dụng","C. Kiểm tra độ đồng đều của hàm lượng trong viên thuốc","D. Đánh giá khả năng hòa tan của viên thuốc trong môi trường"],"correct":1,"explanation":"Đáp án đúng là: Đảm bảo viên không bị vỡ hoặc vỡ vụn trong quá trình bảo quản, vận chuyển và sử dụng Vì: Kiểm tra độ cứng giúp đảm bảo viên thuốc không bị vỡ hoặc vỡ vụn trong suốt quá trình bảo quản, vận chuyển và sử dụng.","reference":"Mục 9.4"},{"id":132,"text":"Mục đích của việc kiểm tra độ đồng đều khối lượng trong kiểm nghiệm thuốc viên nén là gì?","answers":["A. Kiểm tra hình dạng và màu sắc của viên thuốc","B. Đo độ hòa tan của thuốc trong môi trường","C. Đánh giá sự nhất quán về khối lượng của các viên thuốc trong cùng lô sản xuất","D. Đánh giá độ bền cơ học của viên thuốc"],"correct":2,"explanation":"Đáp án đúng là: Đánh giá sự nhất quán về khối lượng của các viên thuốc trong cùng lô sản xuất Vì: Kiểm tra độ đồng đều khối lượng giúp đảm bảo rằng mỗi viên thuốc có đủ lượng dược chất như dự kiến, từ đó kiểm tra sự nhất quán trong cùng lô sản xuất.","reference":"Mục 9.6"},{"id":133,"text":"Phương pháp nào được sử dụng để phát hiện các tạp chất kim loại trong thuốc viên nén?","answers":["A. Sắc ký mao quản (CE)","B. Sắc ký lỏng (HPLC)","C. Sắc ký khí (GC)","D. Quang phổ hấp thụ nguyên tử (AAS)"],"correct":3,"explanation":"Đáp án đúng là: Quang phổ hấp thụ nguyên tử (AAS) Vì: Quang phổ hấp thụ nguyên tử (AAS) được sử dụng để phát hiện và định lượng các tạp chất kim loại như chì, cadmium, và arsen trong thuốc viên nén.","reference":"Mục 9.7"},{"id":134,"text":"Tiêu chuẩn thời gian rã đối với viên nén không bao phim là gì?","answers":["A. Viên nén không bao phim phải rã trong vòng 45 phút","B. Viên nén không bao phim phải rã trong vòng 15 phút","C. Viên nén không bao phim phải rã trong vòng 60 phút","D. Viên nén không bao phim phải rã trong vòng 30 phút"],"correct":3,"explanation":"Đáp án đúng là: Viên nén không bao phim phải rã trong vòng 30 phút Vì: Tiêu chuẩn yêu cầu viên nén không bao phim phải rã trong vòng 30 phút để đảm bảo hoạt chất giải phóng đúng thời gian quy định.","reference":"Mục 9.2"},{"id":135,"text":"Tiêu chuẩn tổng tạp chất trong thuốc viên nén không được vượt quá bao nhiêu phần trăm?","answers":["A. 2%","B. 1%","C. 0.5%","D. 5%"],"correct":1,"explanation":"Đáp án đúng là: 1% Vì: Tổng tạp chất trong thuốc viên nén không được vượt quá 1%, với một số loại thuốc có yêu cầu nghiêm ngặt có thể giảm xuống còn 0.5%.","reference":"Mục 9.7"},{"id":136,"text":"Mục đích của phép thử độ rã là gì?","answers":["A. Đánh giá độ hòa tan của thuốc trong dịch tiêu hóa","B. Kiểm tra xem viên nén có thể rã hoàn toàn trong thời gian quy định","C. Đánh giá độ bền cơ học của viên thuốc","D. Kiểm tra hàm lượng dược chất trong viên thuốc"],"correct":1,"explanation":"Đáp án đúng là: Kiểm tra xem viên nén có thể rã hoàn toàn trong thời gian quy định Vì: Mục đích của phép thử độ rã là kiểm tra khả năng viên nén phân rã hoàn toàn trong thời gian quy định, từ đó gián tiếp đánh giá khả năng giải phóng hoạt chất.","reference":"Mục 9.2"},{"id":137,"text":"Tiêu chuẩn độ cứng cho viên nén thường dao động trong khoảng bao nhiêu Newton?","answers":["A. 10 - 20 Newton (N)","B. 20 - 50 Newton (N)","C. 40 - 100 Newton (N)","D. 100 - 150 Newton (N)"],"correct":2,"explanation":"Đáp án đúng là: 40 - 100 Newton (N) Vì: Tiêu chuẩn độ cứng của viên nén dao động trong khoảng 40 - 100 Newton (N) tùy loại viên để đảm bảo viên không vỡ khi vận chuyển và sử dụng.","reference":"Mục 9.4"},{"id":138,"text":"Mục đích của việc kiểm tra độ đồng đều hàm lượng viên nén là gì?","answers":["A. Đảm bảo mỗi viên thuốc trong cùng lô sản xuất chứa hàm lượng hoạt chất nằm trong giới hạn cho phép","B. Đảm bảo viên thuốc có độ cứng thích hợp","C. Đảm bảo viên thuốc có độ mài mòn thấp","D. Đảm bảo viên thuốc hòa tan nhanh trong cơ thể"],"correct":0,"explanation":"Đáp án đúng là: Đảm bảo mỗi viên thuốc trong cùng lô sản xuất chứa hàm lượng hoạt chất nằm trong giới hạn cho phép Vì: Kiểm tra độ đồng đều hàm lượng giúp đảm bảo rằng mỗi viên thuốc có hàm lượng hoạt chất nằm trong giới hạn cho phép, duy trì hiệu quả điều trị và an toàn cho vật nuôi.","reference":"Mục 9.6"},{"id":139,"text":"Mục đích của phương pháp thử độ hòa tan của thuốc viên nén là gì?","answers":["A. Đánh giá tốc độ và mức độ thuốc giải phóng hoạt chất ra môi trường dung dịch","B. Kiểm tra độ bền cơ học của viên thuốc","C. Đo hàm lượng hoạt chất trong viên thuốc","D. Đánh giá hình dạng và màu sắc viên thuốc"],"correct":0,"explanation":"Đáp án đúng là: Đánh giá tốc độ và mức độ thuốc giải phóng hoạt chất ra môi trường dung dịch Vì: Phương pháp thử độ hòa tan giúp đánh giá tốc độ và mức độ thuốc giải phóng hoạt chất ra môi trường dung dịch, từ đó xác định khả năng hấp thu của thuốc.","reference":"Mục 9.3"},{"id":140,"text":"Quy trình phân tích tạp chất trong thuốc viên nén bằng phương pháp sắc ký mao quản (CE) dựa trên nguyên lý gì?","answers":["A. Sự di chuyển của các ion dưới tác động của trường điện từ","B. Quá trình hấp thụ ánh sáng của các nguyên tử","C. Sự tách biệt các thành phần của mẫu bằng cột sắc ký","D. Quá trình bay hơi các hợp chất trong mẫu"],"correct":0,"explanation":"Đáp án đúng là: Sự di chuyển của các ion dưới tác động của trường điện từ Vì: Sắc ký mao quản (CE) phân tích tạp chất dựa trên sự di chuyển của các ion trong mẫu dưới tác động của trường điện từ.","reference":"Mục 9.7"},{"id":141,"text":"Thiết bị thử độ rã sử dụng môi trường thử nào trong phương pháp thử độ rã?","answers":["A. Nước muối sinh lý","B. Nước cất hoặc dung dịch mô phỏng dịch tiêu hóa","C. Nước nóng hoặc dung dịch axit","D. Dung dịch muối tự nhiên"],"correct":1,"explanation":"Đáp án đúng là: Nước cất hoặc dung dịch mô phỏng dịch tiêu hóa Vì: Môi trường thử thường là nước cất hoặc dung dịch mô phỏng dịch tiêu hóa để mô phỏng điều kiện cơ thể vật nuôi.","reference":"Mục 9.2"},{"id":142,"text":"Tiêu chuẩn sai lệch cho phép đối với viên nén có khối lượng từ 80 mg đến 250 mg là gì?","answers":["A. ± 3%","B. ± 7,5%","C. ± 5%","D. ± 10%"],"correct":1,"explanation":"Đáp án đúng là: ± 7,5% Vì: Đối với viên nén có khối lượng từ 80 mg đến 250 mg, sai lệch cho phép là ± 7,5% để đảm bảo sự đồng đều trong lô sản xuất.","reference":"Mục 9.6"},{"id":143,"text":"Mục đích của phương pháp cảm quan trong kiểm nghiệm thuốc viên nén là gì?","answers":["A. Đánh giá hiệu quả điều trị của thuốc","B. Kiểm tra thành phần hóa học của thuốc","C. Phát hiện các dấu hiệu bất thường về hình thức bên ngoài của thuốc","D. Xác định hàm lượng dược chất trong thuốc"],"correct":2,"explanation":"Đáp án đúng là: Phát hiện các dấu hiệu bất thường về hình thức bên ngoài của thuốc Vì: Phương pháp cảm quan giúp phát hiện các dấu hiệu bất thường về hình thức bên ngoài của thuốc, từ đó đánh giá sơ bộ chất lượng thuốc.","reference":"Mục 9.1"},{"id":144,"text":"Nhiệt độ nào được duy trì trong quá trình thử độ hòa tan?","answers":["A. 25 ± 0,5°C","B. 37 ± 0,5°C","C. 40 ± 0,5°C","D. 50 ± 0,5°C"],"correct":1,"explanation":"Đáp án đúng là: 37 ± 0,5°C Vì: Nhiệt độ trong quá trình thử độ hòa tan được duy trì ở 37 ± 0,5°C, mô phỏng nhiệt độ cơ thể vật nuôi.","reference":"Mục 9.3"},{"id":145,"text":"Mục đích của kiểm tra định lượng trong kiểm nghiệm thuốc viên nén là gì?","answers":["A. Đo độ hòa tan của hoạt chất trong viên thuốc","B. Kiểm tra hình dạng và màu sắc viên thuốc","C. Đánh giá độ bền cơ học của viên thuốc","D. Xác định chính xác hàm lượng hoạt chất trong viên thuốc"],"correct":3,"explanation":"Đáp án đúng là: Xác định chính xác hàm lượng hoạt chất trong viên thuốc Vì: Mục đích của kiểm tra định lượng là xác định chính xác hàm lượng hoạt chất trong viên thuốc để đảm bảo chất lượng và hiệu quả của sản phẩm.","reference":"Mục 9.5"},{"id":146,"text":"Phương pháp nào thường được sử dụng trong kiểm tra định tính của thuốc viên nén?","answers":["A. Sắc ký lỏng hiệu năng cao (HPLC)","B. Chuẩn độ","C. Các phương pháp đã quy định trong tiêu chuẩn, tùy theo từng loại hoạt chất","D. Quang phổ UV-VIS"],"correct":2,"explanation":"Đáp án đúng là: Các phương pháp đã quy định trong tiêu chuẩn, tùy theo từng loại hoạt chất Vì: Kiểm tra định tính được thực hiện theo các phương pháp đã quy định trong tiêu chuẩn, tuỳ theo từng loại hoạt chất có trong thành phần chế phẩm.","reference":"Mục 9.5"},{"id":147,"text":"Phương pháp nào thường được sử dụng để đo nồng độ hoạt chất hòa tan trong mẫu dung dịch?","answers":["A. Quang phổ UV-VIS hoặc sắc ký","B. Phương pháp phân tích trọng lượng","C. Phương pháp đo pH","D. Phương pháp chuẩn độ"],"correct":0,"explanation":"Đáp án đúng là: Quang phổ UV-VIS hoặc sắc ký Vì: Quang phổ UV-VIS hoặc sắc ký là phương pháp thường dùng để đo nồng độ hoạt chất hòa tan trong mẫu dung dịch.","reference":"Mục 9.3"},{"id":148,"text":"Phương pháp phổ biến nhất để phân tích mẫu sau khi hòa tan là gì?","answers":["A. Phổ hồng ngoại (IR)","B. Quang phổ UV-Vis hoặc HPLC","C. Kỹ thuật sắc ký giấy","D. Đo độ dẫn điện"],"correct":1,"explanation":"Đáp án đúng là: Quang phổ UV-Vis hoặc HPLC Vì: UV-Vis và HPLC cho phép định lượng chính xác hàm lượng dược chất đã hòa tan.","reference":"Mục 10.3"},{"id":149,"text":"Kỹ thuật phổ biến nào được dùng trong định tính dược chất trong thuốc viên nang?","answers":["A. Sắc ký khí","B. Đo pH","C. Phản ứng tạo màu, quang phổ UV-Vis hoặc sắc ký lớp mỏng","D. Chuẩn độ điện thế"],"correct":2,"explanation":"Đáp án đúng là: Phản ứng tạo màu, quang phổ UV-Vis hoặc sắc ký lớp mỏng Vì: Các phản ứng đặc trưng, UV-Vis và TLC giúp xác định đúng dược chất qua
