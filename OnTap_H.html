<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập - Kiểm nghiệm dược phẩm (20 câu)</title>
<style>
:root {
  --blue:      #2563eb;
  --blue-dark: #1e40af;
  --blue-bg:   #eff6ff;
  --green:     #16a34a;
  --green-bg:  #f0fdf4;
  --green-bd:  #86efac;
  --yellow-bg: #fefce8;
  --yellow-bd: #fde047;
  --gray:      #6b7280;
  --gray-lt:   #f3f4f6;
  --border:    #e5e7eb;
  --text:      #111827;
  --radius:    12px;
  --shadow:    0 1px 4px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f1f5f9; color: var(--text);
  line-height: 1.65; font-size: 15px;
}

/* ── HEADER ── */
.page-header {
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
  color: #fff; padding: 28px 20px 22px; text-align: center;
  position: relative;
}
.page-header h1 { font-size: clamp(1.1em, 4vw, 1.7em); font-weight: 700; margin-bottom: 5px; }
.page-header p  { opacity: .85; font-size: .88em; }
.back-btn {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.35);
  color: #fff; padding: 6px 13px; border-radius: 7px;
  text-decoration: none; font-size: .82em; font-weight: 600;
  white-space: nowrap; transition: background .15s; line-height: 1.4;
}
.back-btn:hover { background: rgba(255,255,255,.3); }
@media (max-width: 480px) {
  .back-btn { position: static; transform: none; display: inline-block;
              margin-bottom: 10px; font-size: .8em; }
  .page-header { padding-top: 16px; }
}

/* ── SEARCH BAR ── */
.search-wrap {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.search-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px;
}
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%; padding: 9px 36px 9px 38px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .95em; outline: none; background: var(--gray-lt);
  transition: border-color .15s, background .15s;
  -webkit-appearance: none;
}
.search-box input:focus { border-color: var(--blue); background: #fff; }
.search-icon {
  position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%); color: var(--gray);
  pointer-events: none; font-size: 1em;
}
.search-clear {
  position: absolute; right: 9px; top: 50%;
  transform: translateY(-50%); background: none; border: none;
  cursor: pointer; color: var(--gray); font-size: 1.1em;
  padding: 2px 4px; display: none; line-height: 1; border-radius: 50%;
}
.search-clear:hover { color: #111; background: var(--gray-lt); }
.search-count {
  white-space: nowrap; font-size: .88em; color: var(--gray);
  min-width: 90px; text-align: right;
}
.search-count strong { color: var(--blue-dark); }

/* ── CONTAINER ── */
.container {
  max-width: 860px; margin: 18px auto;
  padding: 0 14px 80px;
}

/* ── QUESTION CARD ── */
.question-block {
  background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 16px;
  border-left: 4px solid var(--blue);
  overflow: hidden;
  transition: box-shadow .15s;
}
.question-block:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.08);
}

.question-header {
  display: flex; align-items: center; gap: 8px;
  background: var(--blue-bg); padding: 8px 14px;
  border-bottom: 1px solid #dbeafe;
}
.q-badge {
  background: var(--blue); color: #fff;
  border-radius: 20px; padding: 1px 9px;
  font-size: .78em; font-weight: 700; letter-spacing: .3px;
}

.question-text {
  padding: 14px 16px 8px;
  font-size: 1em; font-weight: 500; color: #1e293b;
}
.question-text mark {
  background: #fef08a; color: inherit;
  border-radius: 3px; padding: 0 2px;
}

/* ── ANSWERS ── */
.answers {
  padding: 4px 16px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.answer-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--gray-lt);
}
.answer-item.correct {
  background: var(--green-bg);
  border-color: var(--green-bd);
  font-weight: 600;
}
.answer-letter {
  font-weight: 700; font-size: .9em;
  width: 22px; flex-shrink: 0; padding-top: 1px; color: var(--gray);
}
.answer-item.correct .answer-letter { color: var(--green); }
.answer-text {
  flex: 1; color: #374151; font-size: .95em;
}
.answer-item.correct .answer-text { color: #14532d; }
.answer-text mark {
  background: #bbf7d0; color: inherit;
  border-radius: 3px; padding: 0 2px;
}
.check-mark {
  flex-shrink: 0; margin-left: auto; padding-left: 6px;
  color: var(--green); font-weight: 700;
}

/* ── FEEDBACK ── */
.feedback-section {
  background: var(--yellow-bg);
  border-top: 1.5px solid var(--yellow-bd);
  padding: 10px 16px; font-size: .875em; color: #44403c;
}
.feedback-section p { margin: 3px 0; }
.feedback-section strong { color: #1c1917; }

/* ── EMPTY STATE ── */
#noResults {
  display: none; text-align: center;
  padding: 60px 20px; color: var(--gray);
}
#noResults .nr-icon { font-size: 2.5em; margin-bottom: 12px; }
#noResults p { font-size: .95em; }

/* ── SCROLL TOP ── */
#scrollTopBtn {
  position: fixed; bottom: 20px; right: 16px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--blue); color: #fff; border: none;
  font-size: 1.3em; cursor: pointer; display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(37,99,235,.4);
  transition: background .15s, transform .15s;
  z-index: 200; text-decoration: none;
  line-height: 44px; text-align: center;
}
#scrollTopBtn:hover { background: var(--blue-dark); transform: translateY(-2px); }

/* ── MOBILE ── */
@media (max-width: 600px) {
  body { font-size: 14px; }
  .page-header { padding: 18px 14px 14px; }
  .container { margin: 12px auto; padding: 0 10px 80px; }
  .question-text { padding: 12px 12px 6px; }
  .answers { padding: 4px 12px 10px; gap: 5px; }
  .answer-item { padding: 7px 10px; }
  .feedback-section { padding: 9px 12px; }
  .search-count { display: none; }
}
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html" class="back-btn">&#8592; Trang ch&#7911;</a>
  <h1>Ôn Tập Kiểm nghiệm dược phẩm</h1>
  <p>Câu hỏi trắc nghiệm có đáp án &mdash; Nguồn: LT_H01</p>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="search" id="searchInput"
             placeholder="Tìm câu hỏi hoặc đáp án..." autocomplete="off">
      <button class="search-clear" id="searchClear" title="Xóa">&#10005;</button>
    </div>
    <div class="search-count" id="searchCount">
      <strong>20</strong> / 20 câu
    </div>
  </div>
</div>

<div class="container" id="questionContainer">
  <div id="noResults">
    <div class="nr-icon">&#128269;</div>
    <p>Không tìm thấy câu hỏi phù hợp.</p>
  </div>
</div>

<script>
const QUESTIONS = [{"id":1,"text":"Phương pháp nào sau đây dùng để xác định độ cứng, độ mài mòn, độ hòa tan của thuốc?","answers":["A. Phân tích vật lý","B. Phân tích nhiệt độ","C. Phân tích vi sinh","D. Phân tích hóa học"],"correct":0,"explanation":"Đáp án đúng là: Phân tích vật lý Vì: Phân tích vật lý kiểm tra các đặc tính cơ học và độ bền của thuốc.","reference":"Mục 12.4"},{"id":2,"text":"Nội độc tố là thành phần nào của vi khuẩn Gram âm?","answers":["A. Protein vách tế bào","B. Lipopolysaccharide (LPS)","C. Peptidoglycan","D. DNA plasmid"],"correct":1,"explanation":"Đáp án đúng là: Lipopolysaccharide (LPS) Vì: Nội độc tố là thành phần lipopolysaccharide (LPS) của vách tế bào vi khuẩn Gram âm.","reference":"Mục 7.6"},{"id":3,"text":"Nếu kiểm tra độ đồng nhất của thuốc mỡ mà không đạt yêu cầu với 4 tiêu bản ban đầu, cách xử lý là gì?","answers":["A. Lặp lại phép thử với 8 đơn vị đóng gói và không được có quá 2 tiêu bản thấy tiểu phân","B. Loại bỏ lô thuốc và không kiểm tra tiếp","C. Thực hiện định tính lại bằng phương pháp khác","D. Tăng khối lượng mẫu thử lên gấp đôi"],"correct":0,"explanation":"Đáp án đúng là: Lặp lại phép thử với 8 đơn vị đóng gói và không được có quá 2 tiêu bản thấy tiểu phân Vì: Nếu kết quả ban đầu không đạt, tiến hành lại phép thử với 8 đơn vị, yêu cầu số tiêu bản thấy tiểu phân không quá 2.","reference":"Mục 8.2"},{"id":4,"text":"Khi thu thập dữ liệu trong thử nghiệm độ ổn định, các mẫu thuốc cần được kiểm tra ở mốc thời gian nào?","answers":["A. 1 tuần, 2 tuần, 1 tháng","B. 6 giờ, 12 giờ, 24 giờ","C. 2 năm, 3 năm, 4 năm","D. 0 tháng, 3 tháng, 6 tháng, 12 tháng, 24 tháng"],"correct":3,"explanation":"Đáp án đúng là: 0 tháng, 3 tháng, 6 tháng, 12 tháng, 24 tháng Vì: Các mốc tiêu chuẩn trong thử nghiệm dài hạn bao gồm 0, 3, 6, 12 và 24 tháng.","reference":"Mục 12.4"},{"id":5,"text":"Nhiệt độ môi trường thử độ rã của viên nang được quy định là bao nhiêu?","answers":["A. 60 ± 1°C","B. 37 ± 0,5°C","C. 40 ± 5°C","D. 25 ± 2°C"],"correct":1,"explanation":"Đáp án đúng là: 37 ± 0,5°C Vì: 37 ± 0,5°C mô phỏng nhiệt độ cơ thể sinh vật, đảm bảo điều kiện thực tế khi dùng thuốc.","reference":"Mục 10.2"},{"id":6,"text":"Phương pháp nào được sử dụng để kiểm tra độ mài mòn của viên nén?","answers":["A. Quay viên thuốc trong trống quay và xác định phần trăm khối lượng bị mất","B. Kiểm tra màu sắc và hình dạng viên thuốc","C. Đo thời gian hòa tan trong dung dịch","D. Đo lực nén cần thiết để làm vỡ viên thuốc"],"correct":0,"explanation":"Đáp án đúng là: Quay viên thuốc trong trống quay và xác định phần trăm khối lượng bị mất Vì: Để kiểm tra độ mài mòn, viên thuốc được quay trong trống quay trong một thời gian nhất định, sau đó xác định phần trăm khối lượng bị mất.","reference":"Mục 9.4"},{"id":7,"text":"Số lượng viên nang thường được lấy mẫu để kiểm tra độ đồng đều hàm lượng là bao nhiêu?","answers":["A. 5 viên","B. 20 viên","C. 10 viên","D. 15 viên"],"correct":2,"explanation":"Đáp án đúng là: 10 viên Vì: Theo quy trình kiểm nghiệm thông thường, 10 viên là số mẫu đại diện dùng cho thử nghiệm này.","reference":"Mục 10.5"},{"id":8,"text":"Đo độ ẩm trong thuốc viên nén nhằm mục đích gì?","answers":["A. Đánh giá độ bền của nhãn mác","B. Kiểm tra độ pH","C. Xác định tốc độ hòa tan","D. Đánh giá nguy cơ ảnh hưởng đến độ ổn định"],"correct":3,"explanation":"Đáp án đúng là: Đánh giá nguy cơ ảnh hưởng đến độ ổn định Vì: Độ ẩm cao có thể gây phân hủy hoặc thay đổi đặc tính thuốc.","reference":"Mục 12.4"},{"id":9,"text":"Tiêu chuẩn sai lệch cho phép đối với viên nén có khối lượng từ 80 mg đến 250 mg là gì?","answers":["A. ± 10%","B. ± 3%","C. ± 5%","D. ± 7,5%"],"correct":3,"explanation":"Đáp án đúng là: ± 7,5% Vì: Đối với viên nén có khối lượng từ 80 mg đến 250 mg, sai lệch cho phép là ± 7,5% để đảm bảo sự đồng đều trong lô sản xuất.","reference":"Mục 9.6"},{"id":10,"text":"Tuổi thọ (Shelf life) của thuốc được tính từ thời điểm nào?","answers":["A. Ngày phân phối","B. Ngày thử nghiệm","C. Ngày bán lẻ","D. Ngày sản xuất"],"correct":3,"explanation":"Đáp án đúng là: Ngày sản xuất Vì: Tuổi thọ được tính từ ngày sản xuất đến ngày hết hạn sử dụng.","reference":"Mục 11.2"},{"id":11,"text":"Khi đánh giá độ ổn định độc tính của thuốc thú y, yếu tố nào được chú trọng?","answers":["A. Sự thay đổi màu sắc của thuốc","B. Phát hiện sản phẩm phân hủy có độc tính","C. Mức độ hòa tan của viên nén","D. Độ đồng đều hàm lượng"],"correct":1,"explanation":"Đáp án đúng là: Phát hiện sản phẩm phân hủy có độc tính Vì: Mục tiêu là đảm bảo thuốc không sinh ra sản phẩm phân hủy gây độc hại cho động vật.","reference":"Mục 11.2"},{"id":12,"text":"Vùng khí hậu nóng ẩm ảnh hưởng đến độ ổn định của thuốc như thế nào?","answers":["A. Không ảnh hưởng đến thuốc","B. Làm thuốc ổn định tốt hơn","C. Làm giảm nguy cơ nhiễm khuẩn","D. Làm tăng tốc độ phân hủy hóa học và nguy cơ nhiễm khuẩn"],"correct":3,"explanation":"Đáp án đúng là: Làm tăng tốc độ phân hủy hóa học và nguy cơ nhiễm khuẩn Vì: Khí hậu nóng ẩm thúc đẩy quá trình phân hủy và phát triển vi sinh vật, giảm tuổi thọ thuốc.","reference":"Mục 11.2"},{"id":13,"text":"Trong phép thử độ đồng nhất, yêu cầu đạt là gì khi quan sát 4 tiêu bản đầu tiên?","answers":["A. Ít nhất 3 trong 4 tiêu bản không thấy tiểu phân bằng mắt thường","B. Chỉ cần 1 tiêu bản không thấy tiểu phân","C. Tất cả 4 tiêu bản không thấy tiểu phân","D. Có thể có 2 tiêu bản thấy tiểu phân nếu các vết còn lại đều rõ"],"correct":0,"explanation":"Đáp án đúng là: Ít nhất 3 trong 4 tiêu bản không thấy tiểu phân bằng mắt thường Vì: Phép thử đạt yêu cầu khi 3 trong 4 tiêu bản không thấy tiểu phân, cho thấy sự đồng đều trong chế phẩm.","reference":"Mục 8.2"},{"id":14,"text":"Để chuẩn bị mẫu thuốc mỡ kiểm tra pH bằng máy đo pH, dung dịch đệm hoặc nước cất nên được thêm vào với lượng nào?","answers":["A. 10 ml","B. 5 ml","C. 8 ml","D. 9 ml"],"correct":3,"explanation":"Đáp án đúng là: 9 ml Vì: Lượng nước cất hoặc dung dịch đệm cần thêm vào là 9 ml để tạo ra hỗn dịch đồng nhất với mẫu thuốc mỡ.","reference":"Mục 8.3"},{"id":15,"text":"Phương pháp phổ biến dùng để xác định hàm lượng hoạt chất trong thuốc là gì?","answers":["A. Kiểm tra sinh học","B. Sắc ký lỏng hiệu năng cao (HPLC)","C. Đo nhiệt độ nóng chảy","D. Phân tích cơ học"],"correct":1,"explanation":"Đáp án đúng là: Sắc ký lỏng hiệu năng cao (HPLC) Vì: HPLC là phương pháp định lượng hoạt chất chính xác và phổ biến.","reference":"Mục 12.4"},{"id":16,"text":"Trong phương pháp Gel-clot kiểm tra nội độc tố, kết quả dương tính được xác định như thế nào?","answers":["A. Dung dịch chuyển màu xanh lam","B. Có sự tạo bọt khí mạnh trong ống","C. Dung dịch trở nên trong suốt hoàn toàn","D. Có sự hình thành cục gel giữ nguyên khi nghiêng ống"],"correct":3,"explanation":"Đáp án đúng là: Có sự hình thành cục gel giữ nguyên khi nghiêng ống Vì: Kết quả dương tính khi dung dịch tạo thành cục gel không chảy xuống thành ống nghiệm.","reference":"Mục 7.6"},{"id":17,"text":"Tiêu chuẩn độ cứng cho viên nén thường dao động trong khoảng bao nhiêu Newton?","answers":["A. 100 - 150 Newton (N)","B. 10 - 20 Newton (N)","C. 20 - 50 Newton (N)","D. 40 - 100 Newton (N)"],"correct":3,"explanation":"Đáp án đúng là: 40 - 100 Newton (N) Vì: Tiêu chuẩn độ cứng của viên nén dao động trong khoảng 40 - 100 Newton (N) tùy loại viên để đảm bảo viên không vỡ khi vận chuyển và sử dụng.","reference":"Mục 9.4"},{"id":18,"text":"Một trong các mục tiêu của phân tích hàm lượng hoạt chất là gì?","answers":["A. Xác định chính xác lượng hoạt chất trong thuốc","B. Xác định pH dung dịch","C. Đo màu sắc của viên thuốc","D. Đánh giá độ trong của thuốc"],"correct":0,"explanation":"Đáp án đúng là: Xác định chính xác lượng hoạt chất trong thuốc Vì: Xác định hàm lượng hoạt chất đảm bảo hiệu quả điều trị và an toàn.","reference":"Mục 12.4"},{"id":19,"text":"Phương pháp nào giúp xác định mối liên hệ giữa thời gian bảo quản và sự thay đổi chất lượng thuốc?","answers":["A. Phân tích cơ học","B. Phân tích màu sắc","C. Phân tích thống kê","D. Phân tích cảm quan"],"correct":2,"explanation":"Đáp án đúng là: Phân tích thống kê Vì: Phân tích thống kê (như hồi quy) giúp mô tả và dự đoán xu hướng thay đổi.","reference":"Mục 12.4"},{"id":20,"text":"Khi chuẩn bị mẫu thuốc mỡ, bước đầu tiên cần làm gì?","answers":["A. Thêm 9 ml nước cất","B. Đo pH của thuốc mỡ","C. Khuấy đều bằng máy khuấy từ","D. Cân chính xác một lượng thuốc mỡ khoảng 1 g"],"correct":3,"explanation":"Đáp án đúng là: Cân chính xác một lượng thuốc mỡ khoảng 1 g Vì: Bước đầu tiên là cân chính xác một lượng thuốc mỡ khoảng 1 g để đảm bảo mẫu chính xác cho việc phân tích sau này.","reference":"Mục 8.3"}];
</script>

<script>
(function () {
  var LETTERS = "ABCDEFGHIJ";
  var container = document.getElementById("questionContainer");
  var noResults = document.getElementById("noResults");
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");
  var countEl = document.getElementById("searchCount");
  var total = QUESTIONS.length;

  /* ── Escape HTML ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── Highlight từ khóa ── */
  function highlight(text, term) {
    if (!term) return esc(text);
    var safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return esc(text).replace(
      new RegExp("(" + safe.replace(/&amp;/g, "&amp;amp;") + ")", "gi"),
      "<mark>$1</mark>"
    );
  }

  /* ── Render 1 câu hỏi ── */
  function renderQ(q, term) {
    var answersHtml = q.answers.map(function (ans, i) {
      var isCorrect = i === q.correct;
      var cls = "answer-item" + (isCorrect ? " correct" : "");
      var check = isCorrect ? '<span class="check-mark">&#10003;</span>' : "";
      return (
        '<div class="' + cls + '">' +
        '<span class="answer-letter">' + (LETTERS[i] || i + 1) + ".</span>" +
        '<span class="answer-text">' + highlight(ans, term) + "</span>" +
        check +
        "</div>"
      );
    }).join("");

    var feedbackHtml = "";
    if (q.explanation || q.reference) {
      feedbackHtml =
        '<div class="feedback-section">' +
        (q.explanation
          ? "<p><strong>Vì: </strong>" + esc(q.explanation) + "</p>"
          : "") +
        (q.reference
          ? "<p><strong>Tham khảo: </strong>" + esc(q.reference) + "</p>"
          : "") +
        "</div>";
    }

    return (
      '<div class="question-block" id="q' + q.id + '">' +
      '<div class="question-header">' +
      '<span class="q-badge">Câu ' + q.id + "</span>" +
      "</div>" +
      '<div class="question-text">' + highlight(q.text, term) + "</div>" +
      '<div class="answers">' + answersHtml + "</div>" +
      feedbackHtml +
      "</div>"
    );
  }

  /* ── Render danh sách câu hỏi ── */
  function renderList(filtered, term) {
    // Xóa các block cũ (giữ lại #noResults)
    var old = container.querySelectorAll(".question-block");
    old.forEach(function (el) { el.remove(); });

    if (filtered.length === 0) {
      noResults.style.display = "block";
    } else {
      noResults.style.display = "none";
      var frag = document.createDocumentFragment();
      filtered.forEach(function (q) {
        var div = document.createElement("div");
        div.innerHTML = renderQ(q, term);
        frag.appendChild(div.firstChild);
      });
      container.appendChild(frag);
    }

    countEl.innerHTML =
      "<strong>" + filtered.length + "</strong> / " + total + " câu";
  }

  /* ── Lọc câu hỏi ── */
  function doSearch(term) {
    var t = term.trim().toLowerCase();
    var filtered = t
      ? QUESTIONS.filter(function (q) {
          return (
            q.text.toLowerCase().includes(t) ||
            q.answers.some(function (a) { return a.toLowerCase().includes(t); })
          );
        })
      : QUESTIONS;

    searchClear.style.display = term ? "block" : "none";
    renderList(filtered, term.trim());
  }

  /* ── Khởi tạo ── */
  renderList(QUESTIONS, "");

  searchInput.addEventListener("input", function () {
    doSearch(this.value);
  });
  searchClear.addEventListener("click", function () {
    searchInput.value = "";
    doSearch("");
    searchInput.focus();
  });

  /* ── Scroll to top ── */
  var scrollBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", function () {
    scrollBtn.style.display = window.scrollY > 320 ? "flex" : "none";
  }, { passive: true });
  scrollBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
