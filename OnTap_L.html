,"D. Bảo vệ cơ sở"],"correct":0,"explanation":"Đáp án đúng là: Nhân viên thú y được cấp phép Vì: Việc kiểm soát giết mổ phải do nhân viên thú y có chứng chỉ tập huấn đảm nhiệm.","reference":"Mục 6.2.1"},{"id":129,"text":"Tại sao quá trình xử lý sinh học hiếu khí thường đi sau xử lý kỵ khí trong hệ thống xử lý nước thải lò mổ?","answers":["A. Vi sinh vật kỵ khí hoạt động mạnh hơn","B. Bể hiếu khí dễ lắp đặt hơn bể kỵ khí","C. Giúp tiết kiệm chi phí vận hành","D. Để xử lý tiếp các chất ô nhiễm còn lại sau phân hủy kỵ khí"],"correct":3,"explanation":"Đáp án đúng là: Để xử lý tiếp các chất ô nhiễm còn lại sau phân hủy kỵ khí Vì: Bể hiếu khí giúp hoàn thiện xử lý COD, BOD còn sót lại sau kỵ khí và xử lý các chất dinh dưỡng như NH₄⁺, PO₄³⁻.","reference":"Mục 6.1.8.4"},{"id":130,"text":"Theo quy định về quản lý chất thải rắn thông thường tại cơ sở giết mổ, tần suất thu gom chất thải rắn thông thường tối thiểu là bao lâu để đảm bảo vệ sinh?","answers":["A. Hàng ngày.","B. Sau mỗi ca giết mổ.","C. 2 ngày một lần.","D. 3 ngày một lần."],"correct":0,"explanation":"Đáp án đúng là: Hàng ngày. Vì: chất thải rắn thông thường phải được thu gom và xử lý hàng ngày","reference":"Mục 6.2.8.1"},{"id":131,"text":"Yêu cầu nào sau đây là đúng với nước đá dùng trong cơ sở giết mổ?","answers":["A. Có thể bảo quản đá chung với sản phẩm thịt","B. Không cần phân tích vi sinh nếu đá sạch mắt thường","C. Phải được phân tích vi sinh và lý hóa 6 tháng/lần","D. Có thể dùng nước ngầm chưa xử lý để làm đá"],"correct":2,"explanation":"Đáp án đúng là: Phải được phân tích vi sinh và lý hóa 6 tháng/lần Vì: Nước đá sử dụng phải có nguồn gốc rõ ràng và được phân tích định kỳ 6 tháng 1 lần để đảm bảo an toàn.","reference":"Mục 6.1.2"},{"id":132,"text":"Chỉ tiêu vi sinh vật tổng số cho phép trong thiết bị sau làm sạch, khử trùng là bao nhiêu?","answers":["A. 0 - 50 CFU/cm²","B. Dưới 100 CFU/cm²","C. 0 - 10 CFU/cm²","D. Không giới hạn"],"correct":2,"explanation":"Đáp án đúng là: 0 - 10 CFU/cm² Vì: Mức cho phép là 0 - 10 CFU/cm² để đảm bảo thiết bị không còn vi khuẩn gây bệnh.","reference":"Mục 6.1.7."},{"id":133,"text":"Yếu tố nào sau đây KHÔNG phải là nguyên nhân chính khiến BOD trong nước thải lò mổ cao?","answers":["A. Tổng lượng vi khuẩn có trong nước thải","B. Chất béo và dầu mỡ","C. Phủ tạng và chất hữu cơ phân hủy","D. Máu và protein từ động vật"],"correct":0,"explanation":"Đáp án đúng là: Tổng lượng vi khuẩn có trong nước thải Vì: BOD phản ánh lượng chất hữu cơ dễ phân hủy. Vi khuẩn có mặt nhiều nhưng không trực tiếp làm tăng BOD.","reference":"Mục 6.1.8.4."},{"id":134,"text":"Chất thải rắn nguy hại tại cơ sở giết mổ được lưu trữ tối đa trong bao lâu?","answers":["A. 12 giờ","B. 8 giờ","C. 24 giờ","D. 48 giờ"],"correct":1,"explanation":"Đáp án đúng là: 8 giờ Vì: Theo quy định, chất thải nguy hại không được lưu trữ quá 8 giờ nhằm hạn chế nguy cơ lây lan dịch bệnh.","reference":"Mục 6.1.8.2"},{"id":135,"text":"Thân thịt sau giết mổ phải có yêu cầu cảm quan như thế nào?","answers":["A. Có màu hồng nhạt và có mùi thơm","B. Cứng chắc, khô ráo","C. Không có mùi tanh","D. Sạch sẽ, không dính lông, phân, không có dấu hiệu bệnh tích"],"correct":3,"explanation":"Đáp án đúng là: Sạch sẽ, không dính lông, phân, không có dấu hiệu bệnh tích Vì: Yêu cầu cảm quan của thân thịt là sạch, không dính bẩn hoặc bệnh tích.","reference":"Mục 6.2.2"},{"id":136,"text":"Tần suất phân tích vi sinh và lý hóa của nước dùng trong giết mổ là bao lâu một lần ?","answers":["A. Không bắt buộc","B. 1 năm","C. 6 tháng","D. 3 tháng"],"correct":2,"explanation":"Đáp án đúng là: 6 tháng Vì: Theo quy định, việc phân tích nước về các chỉ tiêu vi sinh và lý hóa được thực hiện 6 tháng một lần.","reference":"Mục 6.1.2"},{"id":137,"text":"Loại bao bì nào sau đây là bắt buộc phải được sử dụng để chứa đựng và nhận diện lô chất thải này?","answers":["A. Bao bì màu vàng, bên ngoài có dán biểu tượng chỉ chất thải nguy hại","B. Bao bì trong suốt để dễ dàng quan sát bên trong.","C. Bao bì màu trắng, có ghi rõ \"Chất thải có nguy cơ lây nhiễm\".","D. Bao bì màu đen, có dán nhãn \"Chất thải không thể tái chế\"."],"correct":0,"explanation":"Đáp án đúng là: Bao bì màu vàng, bên ngoài có dán biểu tượng chỉ chất thải nguy hại Vì : theo quy định, các loại thịt, phủ tạng có bệnh tích được đưa vào bao bì màu vàng, bên ngoài có dán biểu tượng chỉ chất thải nguy hại","reference":"Mục 6.1.8.2"},{"id":138,"text":"Nếu nước thải từ lò mổ có TSS (chất rắn lơ lửng) quá cao, bước xử lý nào sau đây là thiết yếu để bảo vệ hệ thống phía sau?","answers":["A. Lắng và lọc sơ cấp","B. Điều chỉnh pH","C. Khử trùng bằng Clo","D. Aerotank xử lý hiếu khí"],"correct":0,"explanation":"Đáp án đúng là: Lắng và lọc sơ cấp Vì: TSS cao cần được loại bỏ trước để tránh tắc nghẽn, bảo vệ bể sinh học phía sau.","reference":"Mục 6.1.8.4."},{"id":139,"text":"Bể UASB (Upflow Anaerobic Sludge Blanket) đóng vai trò chính trong việc xử lý loại ô nhiễm nào sau đây?","answers":["A. Ổn định pH và lưu lượng nước thải.","B. Phân hủy chất hữu cơ bằng vi khuẩn kỵ khí, tạo khí Methane.","C. Loại bỏ chất rắn lơ lửng và dầu mỡ.","D. Khử trùng và loại bỏ vi khuẩn gây bệnh trước khi xả thải."],"correct":1,"explanation":"Đáp án đúng là: Phân hủy chất hữu cơ bằng vi khuẩn kỵ khí, tạo khí Methane. Vì: bể UASB sử dụng vi khuẩn kỵ khí để phân hủy chất hữu cơ trong nước thải mà không cần oxy, đồng thời tạo ra khí Methane (Biogas) như một sản phẩm phụ.","reference":"Mục 6.1.8.4"},{"id":140,"text":"Khi xử lý bùn dư từ bể lắng, bước nào dưới đây thường được thực hiện?","answers":["A. Khử trùng bằng UV","B. Làm nguội","C. Thổi khí","D. Ép bùn"],"correct":3,"explanation":"Đáp án đúng là: Ép bùn Vì: Ép bùn giúp giảm thể tích, dễ vận chuyển và xử lý tiếp theo.","reference":"Mục 6.1.8.4"},{"id":141,"text":"Nhiệt độ nước nóng dùng để làm lông tại cơ sở giết mổ phải được duy trì ở mức nào sau đây?","answers":["A. 30°C - 40°C","B. 60°C - 70°C","C. 40°C - 50°C","D. 80°C - 90°C"],"correct":1,"explanation":"Đáp án đúng là: 60°C - 70°C Vì: Theo quy định, nước nóng để làm lông phải duy trì từ 60°C đến 70°C","reference":"Mục 6.1.1"},{"id":142,"text":"Phương pháp khử trùng nào sau đây KHÔNG tạo ra sản phẩm phụ gây hại cho môi trường?","answers":["A. Ozon hóa","B. Clo","C. Tia cực tím (UV)","D. Sử dụng hợp chất Clo hữu cơ"],"correct":2,"explanation":"Đáp án đúng là: Tia cực tím (UV) Vì: UV diệt khuẩn bằng năng lượng ánh sáng, không tạo sản phẩm phụ hóa học như Clo hoặc Ozon.","reference":"Mục 6.1.8.4"},{"id":143,"text":"Trong bể điều hòa của hệ thống xử lý nước thải cơ sở giết mổ, việc điều chỉnh pH nhằm mục đích gì?","answers":["A. Loại bỏ dầu mỡ khỏi nước thải","B. Giảm lượng vi sinh vật có hại","C. Làm lạnh nước thải trước khi xử lý","D. Tạo điều kiện thuận lợi cho hoạt động của vi sinh vật xử lý"],"correct":3,"explanation":"Đáp án đúng là: Tạo điều kiện thuận lợi cho hoạt động của vi sinh vật xử lý Vì: Điều chỉnh pH giúp vi sinh vật (hiếu khí/kỵ khí) hoạt động hiệu quả trong các bể sinh học","reference":"Mục 6.1.8.4"},{"id":144,"text":"Yêu cầu vệ sinh đối với nhà vệ sinh trong cơ sở giết mổ là gì?","answers":["A. Có ít nhất 1 nhà vệ sinh cho 25 người","B. Phải có xà phòng nhưng không cần nước sạch","C. Chỉ cần có hệ thống thoát nước","D. Có ít nhất 1 nhà vệ sinh cho 50 người"],"correct":0,"explanation":"Đáp án đúng là: Có ít nhất 1 nhà vệ sinh cho 25 người Vì: Quy định yêu cầu ít nhất 1 nhà vệ sinh cho 25 người, có đủ nước, giấy vệ sinh, xà phòng.","reference":"Mục 6.1.4"},{"id":145,"text":"Tác dụng của bể UASB trong xử lý nước thải là gì?","answers":["A. Tách dầu mỡ ra khỏi nước","B. Tạo độ kiềm trong nước","C. Khử trùng nước thải","D. Phân hủy chất hữu cơ bằng vi sinh vật kỵ khí"],"correct":3,"explanation":"Đáp án đúng là: Phân hủy chất hữu cơ bằng vi sinh vật kỵ khí Vì: Bể UASB dùng vi khuẩn kỵ khí để xử lý COD, BOD, sinh khí methane","reference":"Mục 6.1.8.4"},{"id":146,"text":"Mục đích của bước khử trùng trong xử lý nước thải là gì?","answers":["A. Tách dầu mỡ","B. Loại bỏ chất rắn lơ lửng","C. Tiêu diệt vi khuẩn gây bệnh","D. Cân bằng pH"],"correct":2,"explanation":"Đáp án đúng là: Tiêu diệt vi khuẩn gây bệnh Vì: Bước khử trùng giúp diệt vi khuẩn như E. coli, Salmonella… để đảm bảo an toàn môi trường trước khi xả thải.","reference":"Mục 6.1.8.4"},{"id":147,"text":"Điều gì xảy ra nếu pH trong bể sinh học hiếu khí giảm xuống < 5?","answers":["A. Không ảnh hưởng đến quá trình xử lý","B. Chất rắn lơ lửng tăng lên","C. Vi sinh vật hiếu khí hoạt động mạnh hơn","D. Vi sinh vật bị ức chế, làm giảm hiệu quả xử lý BOD"],"correct":3,"explanation":"Đáp án đúng là: Vi sinh vật bị ức chế, làm giảm hiệu quả xử lý BOD Vì: pH quá thấp sẽ gây \"sốc\" vi sinh, làm chết vi khuẩn hiếu khí, dẫn đến hiệu suất xử lý giảm rõ rệt.","reference":"Mục 6.1.8.4"},{"id":148,"text":"Thành phần nào sau đây không phải là chất ô nhiễm chính trong nước thải lò mổ?","answers":["A. Vi sinh vật gây bệnh","B. Nitơ và Phốtpho","C. Thuốc bảo vệ thực vật","D. Dầu mỡ"],"correct":2,"explanation":"Đáp án đúng là: Thuốc bảo vệ thực vật Vì: Thuốc BVTV thường có trong nước thải nông nghiệp, không phổ biến trong nước thải lò mổ.","reference":"Mục 6.1.8.4"},{"id":149,"text":"Yêu cầu về giới hạn vi sinh vật tổng số đối với thân thịt lợn là bao nhiêu để được xem là \"an toàn\"?","answers":["A. 1,0 x 10⁴ CFU/g hoặc cm²","B. 1,0 x 10³ CFU/g hoặc cm²","C. 3,0 x 10³ CFU/g hoặc cm²","D. 1,0 x 10⁵ CFU/g hoặc cm²"],"correct":0,"explanation":"Đáp án đúng là: 1,0 x 10⁴ CFU/g hoặc cm² Vì: Theo bảng 6.5, mức ≤ 1,0 x 10⁴ được coi là an toàn cho thân thịt lợn.","reference":"Mục 6.2.2"},{"id":150,"text":"Cơ sở giết mổ cần lưu giữ hồ sơ, tài liệu liên quan đến chương trình kiểm soát chất lượng bảo đảm an toàn thực phẩm trong thời gian tối thiểu là bao lâu?","answers":["A. 3 năm.","B. 1 năm.","C. 6 tháng","D. 2 năm."],"correct":0,"explanation":"Đáp án đúng là: 3 năm. Vì: theo quy định, Phải lưu giữ tối thiểu là 3 năm tất cả hồ sơ, tài liệu liên quan","reference":"Mục 6.2.3"}];
</script>

<script>
(function () {
  var LETTERS = "ABCDEFGHIJ";
  var container = document.getElementById("questionContainer");
  var noResults = document.getElementById("noResults");
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");
  var countEl = document.getElementById("searchCount");
  var total = QUESTIONS.length;

  /* ── Escape HTML ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── Highlight từ khóa ── */
  function highlight(text, term) {
    if (!term) return esc(text);
    var safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return esc(text).replace(
      new RegExp("(" + safe.replace(/&amp;/g, "&amp;amp;") + ")", "gi"),
      "<mark>$1</mark>"
    );
  }

  /* ── Render 1 câu hỏi ── */
  function renderQ(q, term) {
    var answersHtml = q.answers.map(function (ans, i) {
      var isCorrect = i === q.correct;
      var cls = "answer-item" + (isCorrect ? " correct" : "");
      var check = isCorrect ? '<span class="check-mark">&#10003;</span>' : "";
      return (
        '<div class="' + cls + '">' +
        '<span class="answer-letter">' + (LETTERS[i] || i + 1) + ".</span>" +
        '<span class="answer-text">' + highlight(ans, term) + "</span>" +
        check +
        "</div>"
      );
    }).join("");

    var feedbackHtml = "";
    if (q.explanation || q.reference) {
      feedbackHtml =
        '<div class="feedback-section">' +
        (q.explanation
          ? "<p><strong>Vì: </strong>" + esc(q.explanation) + "</p>"
          : "") +
        (q.reference
          ? "<p><strong>Tham khảo: </strong>" + esc(q.reference) + "</p>"
          : "") +
        "</div>";
    }

    var imagesHtml = "";
    if (q.images && q.images.length) {
      imagesHtml =
        '<div class="q-images">' +
        q.images.map(function (src) {
          return (
            '<img src="' + esc(src) + '" alt="" loading="lazy" ' +
            'onerror="this.style.display=\'none\'">'
          );
        }).join("") +
        "</div>";
    }

    return (
      '<div class="question-block" id="q' + q.id + '">' +
      '<div class="question-header">' +
      '<span class="q-badge">Câu ' + q.id + "</span>" +
      "</div>" +
      '<div class="question-text">' + highlight(q.text, term) + "</div>" +
      imagesHtml +
      '<div class="answers">' + answersHtml + "</div>" +
      feedbackHtml +
      "</div>"
    );
  }

  /* ── Render danh sách câu hỏi ── */
  function renderList(filtered, term) {
    // Xóa các block cũ (giữ lại #noResults)
    var old = container.querySelectorAll(".question-block");
    old.forEach(function (el) { el.remove(); });

    if (filtered.length === 0) {
      noResults.style.display = "block";
    } else {
      noResults.style.display = "none";
      var frag = document.createDocumentFragment();
      filtered.forEach(function (q) {
        var div = document.createElement("div");
        div.innerHTML = renderQ(q, term);
        frag.appendChild(div.firstChild);
      });
      container.appendChild(frag);
    }

    countEl.innerHTML =
      "<strong>" + filtered.length + "</strong> / " + total + " câu";
  }

  /* ── Lọc câu hỏi ── */
  function doSearch(term) {
    var t = term.trim().toLowerCase();
    var filtered = t
      ? QUESTIONS.filter(function (q) {
          return (
            q.text.toLowerCase().includes(t) ||
            q.answers.some(function (a) { return a.toLowerCase().includes(t); })
          );
        })
      : QUESTIONS;

    searchClear.style.display = term ? "block" : "none";
    renderList(filtered, term.trim());
  }

  /* ── Khởi tạo ── */
  renderList(QUESTIONS, "");

  searchInput.addEventListener("input", function () {
    doSearch(this.value);
  });
  searchClear.addEventListener("click", function () {
    searchInput.value = "";
    doSearch("");
    searchInput.focus();
  });

  /* ── Scroll to top ── */
  var scrollBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", function () {
    scrollBtn.style.display = window.scrollY > 320 ? "flex" : "none";
  }, { passive: true });
  scrollBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
