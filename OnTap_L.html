<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập - Kiểm nghiệm Thú sản (150 câu)</title>
<style>
:root {
  --blue:      #2563eb;
  --blue-dark: #1e40af;
  --blue-bg:   #eff6ff;
  --green:     #16a34a;
  --green-bg:  #f0fdf4;
  --green-bd:  #86efac;
  --yellow-bg: #fefce8;
  --yellow-bd: #fde047;
  --gray:      #6b7280;
  --gray-lt:   #f3f4f6;
  --border:    #e5e7eb;
  --text:      #111827;
  --radius:    12px;
  --shadow:    0 1px 4px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f1f5f9; color: var(--text);
  line-height: 1.65; font-size: 15px;
}

/* ── HEADER ── */
.page-header {
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
  color: #fff; padding: 28px 20px 22px; text-align: center;
  position: relative;
}
.page-header h1 { font-size: clamp(1.1em, 4vw, 1.7em); font-weight: 700; margin-bottom: 5px; }
.page-header p  { opacity: .85; font-size: .88em; }
.back-btn {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.35);
  color: #fff; padding: 6px 13px; border-radius: 7px;
  text-decoration: none; font-size: .82em; font-weight: 600;
  white-space: nowrap; transition: background .15s; line-height: 1.4;
}
.back-btn:hover { background: rgba(255,255,255,.3); }
@media (max-width: 480px) {
  .back-btn { position: static; transform: none; display: inline-block;
              margin-bottom: 10px; font-size: .8em; }
  .page-header { padding-top: 16px; }
}

/* ── SEARCH BAR ── */
.search-wrap {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.search-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px;
}
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%; padding: 9px 36px 9px 38px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .95em; outline: none; background: var(--gray-lt);
  transition: border-color .15s, background .15s;
  -webkit-appearance: none;
}
.search-box input:focus { border-color: var(--blue); background: #fff; }
.search-icon {
  position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%); color: var(--gray);
  pointer-events: none; font-size: 1em;
}
.search-clear {
  position: absolute; right: 9px; top: 50%;
  transform: translateY(-50%); background: none; border: none;
  cursor: pointer; color: var(--gray); font-size: 1.1em;
  padding: 2px 4px; display: none; line-height: 1; border-radius: 50%;
}
.search-clear:hover { color: #111; background: var(--gray-lt); }
.search-count {
  white-space: nowrap; font-size: .88em; color: var(--gray);
  min-width: 90px; text-align: right;
}
.search-count strong { color: var(--blue-dark); }

/* ── CONTAINER ── */
.container {
  max-width: 860px; margin: 18px auto;
  padding: 0 14px 80px;
}

/* ── QUESTION CARD ── */
.question-block {
  background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 16px;
  border-left: 4px solid var(--blue);
  overflow: hidden;
  transition: box-shadow .15s;
}
.question-block:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.08);
}

.question-header {
  display: flex; align-items: center; gap: 8px;
  background: var(--blue-bg); padding: 8px 14px;
  border-bottom: 1px solid #dbeafe;
}
.q-badge {
  background: var(--blue); color: #fff;
  border-radius: 20px; padding: 1px 9px;
  font-size: .78em; font-weight: 700; letter-spacing: .3px;
}

.question-text {
  padding: 14px 16px 8px;
  font-size: 1em; font-weight: 500; color: #1e293b;
}
.question-text mark {
  background: #fef08a; color: inherit;
  border-radius: 3px; padding: 0 2px;
}
.q-images { padding: 6px 16px 12px; }
.q-images img {
  max-width: 100%; height: auto; display: block;
  border-radius: 8px; border: 1.5px solid var(--border);
  background: #fff; margin-top: 6px;
}

/* ── ANSWERS ── */
.answers {
  padding: 4px 16px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.answer-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--gray-lt);
}
.answer-item.correct {
  background: var(--green-bg);
  border-color: var(--green-bd);
  font-weight: 600;
}
.answer-letter {
  font-weight: 700; font-size: .9em;
  width: 22px; flex-shrink: 0; padding-top: 1px; color: var(--gray);
}
.answer-item.correct .answer-letter { color: var(--green); }
.answer-text {
  flex: 1; color: #374151; font-size: .95em;
}
.answer-item.correct .answer-text { color: #14532d; }
.answer-text mark {
  background: #bbf7d0; color: inherit;
  border-radius: 3px; padding: 0 2px;
}
.check-mark {
  flex-shrink: 0; margin-left: auto; padding-left: 6px;
  color: var(--green); font-weight: 700;
}

/* ── FEEDBACK ── */
.feedback-section {
  background: var(--yellow-bg);
  border-top: 1.5px solid var(--yellow-bd);
  padding: 10px 16px; font-size: .875em; color: #44403c;
}
.feedback-section p { margin: 3px 0; }
.feedback-section strong { color: #1c1917; }

/* ── EMPTY STATE ── */
#noResults {
  display: none; text-align: center;
  padding: 60px 20px; color: var(--gray);
}
#noResults .nr-icon { font-size: 2.5em; margin-bottom: 12px; }
#noResults p { font-size: .95em; }

/* ── SCROLL TOP ── */
#scrollTopBtn {
  position: fixed; bottom: 20px; right: 16px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--blue); color: #fff; border: none;
  font-size: 1.3em; cursor: pointer; display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(37,99,235,.4);
  transition: background .15s, transform .15s;
  z-index: 200; text-decoration: none;
  line-height: 44px; text-align: center;
}
#scrollTopBtn:hover { background: var(--blue-dark); transform: translateY(-2px); }

/* ── MOBILE ── */
@media (max-width: 600px) {
  body { font-size: 14px; }
  .page-header { padding: 18px 14px 14px; }
  .container { margin: 12px auto; padding: 0 10px 80px; }
  .question-text { padding: 12px 12px 6px; }
  .q-images { padding: 4px 12px 10px; }
  .answers { padding: 4px 12px 10px; gap: 5px; }
  .answer-item { padding: 7px 10px; }
  .feedback-section { padding: 9px 12px; }
  .search-count { display: none; }
}
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html" class="back-btn">&#8592; Trang ch&#7911;</a>
  <h1>Ôn Tập Kiểm nghiệm Thú sản</h1>
  <p>Câu hỏi trắc nghiệm có đáp án &mdash; Nguồn: LT_L01 – LT_L02 – LT_L03 – LT_L01 – LT_L02 – LT_L01 – LT_L02 – LT_L01 – LT_L02 – LT_L01 – LT_L02 – LT_L01 – LT_L02</p>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="search" id="searchInput"
             placeholder="Tìm câu hỏi hoặc đáp án..." autocomplete="off">
      <button class="search-clear" id="searchClear" title="Xóa">&#10005;</button>
    </div>
    <div class="search-count" id="searchCount">
      <strong>150</strong> / 150 câu
    </div>
  </div>
</div>

<div class="container" id="questionContainer">
  <div id="noResults">
    <div class="nr-icon">&#128269;</div>
    <p>Không tìm thấy câu hỏi phù hợp.</p>
  </div>
</div>

<script>
const QUESTIONS = [{"id":1,"text":"Môn Kiểm nghiệm thú sản có mối liên hệ với môn Bệnh truyền nhiễm như thế nào?","answers":["A. Hỗ trợ cải thiện chất lượng dinh dưỡng của thực phẩm có nguồn gốc động vật","B. Kiểm soát quy trình giết mổ để tăng năng suất sản xuất sản phẩm động vật","C. Xác định phương pháp bảo quản sản phẩm động vật trong thời gian dài","D. Giúp phát hiện các bệnh truyền nhiễm có thể lây từ động vật sang người"],"correct":3,"explanation":"Đáp án đúng là: Giúp phát hiện các bệnh truyền nhiễm có thể lây từ động vật sang người Vì: Kiểm nghiệm thú sản có liên quan mật thiết đến Bệnh truyền nhiễm vì nó giúp phát hiện và kiểm soát các bệnh truyền nhiễm nguy hiểm (như lao, nhiệt thán, xoắn khuẩn…) có thể lây từ động vật sang người qua thực phẩm, từ đó đảm bảo an toàn thực phẩm và sức khỏe cộng đồng..","reference":"Mục 1.4"},{"id":2,"text":"Kiểm nghiệm vi sinh vật trong thực phẩm động vật nhằm mục đích gì?","answers":["A. Phát hiện vi khuẩn gây bệnh như Salmonella, E. coli, đồng thời nhằm xác định mức độ ô nhiễm vi sinh trong thực phẩm","B. Đánh giá thời gian bảo quản sản phẩm động vật","C. Phát hiện vi khuẩn gây bệnh như Salmonella, E. coli","D. Xác định mức độ ô nhiễm vi sinh trong thực phẩm"],"correct":0,"explanation":"Đáp án đúng là: Phát hiện vi khuẩn gây bệnh như Salmonella, E. coli, đồng thời nhằm xác định mức độ ô nhiễm vi sinh trong thực phẩm Vì: Việc kiểm nghiệm vi sinh giúp phát hiện vi khuẩn gây bệnh và đánh giá mức độ an toàn của thực phẩm trước khi đến tay người tiêu dùng.","reference":"Mục 1.1"},{"id":3,"text":"Theo Thông tư 09/2016/TT-BNNPTNT, đối tượng nào sau đây không thuộc diện kiểm tra vệ sinh thú y?","answers":["A. Cây trồng và thực phẩm có nguồn gốc thực vật","B. Động vật nuôi trong nước và nhập khẩu","C. Các sản phẩm động vật dùng làm thực phẩm","D. Các phương tiện vận chuyển động vật và sản phẩm động vật"],"correct":0,"explanation":"Đáp án đúng là: Cây trồng và thực phẩm có nguồn gốc thực vật Vì: Thông tư 09/2016 quy định kiểm tra vệ sinh thú y chỉ áp dụng cho động vật , sản phẩm động vật và các phương tiện vận chuyển chúng , không bao gồm cây trồng và thực phẩm từ thực vật","reference":"Mục 1.1"},{"id":4,"text":"Một trong những biện pháp kiểm soát dịch bệnh ở gia súc, gia cầm là gì?","answers":["A. Chỉ kiểm tra các chợ buôn bán động vật","B. Kiểm tra động vật trước và sau giết mổ","C. Tiêm vaccine đại trà cho toàn bộ đàn gia súc","D. Không cần kiểm tra nếu động vật khỏe mạnh"],"correct":1,"explanation":"Đáp án đúng là: Kiểm tra động vật trước và sau giết mổ Vì: Kiểm tra trước và sau giết mổ giúp phát hiện kịp thời bệnh truyền nhiễm và ngăn ngừa dịch bệnh lây lan.","reference":"Mục 1.2"},{"id":5,"text":"Môn học \"Kiểm nghiệm thú sản\" chủ yếu nghiên cứu về điều gì?","answers":["A. Phương pháp kiểm nghiệm, đánh giá chất lượng vệ sinh thú y","B. Tất cả các đáp án đều đúng","C. Đảm bảo thực phẩm an toàn cho người tiêu dùng và đàn gia súc, gia cầm","D. Phương pháp vận chuyển, bảo quản và chế biến sản phẩm động vật"],"correct":1,"explanation":"Đáp án đúng là: Tất cả các đáp án đều đúng Vì: nội dung như kiểm nghiệm chất lượng, vận chuyển, bảo quản, chế biến sản phẩm động vật nhằm đảm bảo vệ sinh thực phẩm và kiểm soát dịch bệnh.","reference":"Mục 1.1"},{"id":6,"text":"Môn Kiểm nghiệm thú sản có mục tiêu chính là gì?","answers":["A. Kiểm tra chất lượng sản phẩm động vật trước khi tiêu thụ","B. Giúp kiểm soát dịch bệnh trên động vật nuôi","C. Đảm bảo thực phẩm có nguồn gốc động vật an toàn cho con người","D. Bảo vệ môi trường khỏi ô nhiễm từ chất thải chăn nuôi"],"correct":2,"explanation":"Đáp án đúng là: Đảm bảo thực phẩm có nguồn gốc động vật an toàn cho con người Vì: Kiểm nghiệm thú sản nhằm đảm bảo thực phẩm động vật an toàn, không gây nguy hại cho sức khỏe con người.","reference":"Mục 1.1"},{"id":7,"text":"Kiểm nghiệm thú sản có vai trò gì đối với sức khỏe cộng đồng?","answers":["A. Giảm thiểu nguy cơ ngộ độc thực phẩm do vi khuẩn, ký sinh trùng","B. Cải thiện chất lượng sản phẩm động vật trước khi tiêu thụ","C. Đảm bảo thực phẩm có hương vị ngon hơn","D. Giúp phát hiện sớm các bệnh truyền nhiễm từ động vật sang người"],"correct":0,"explanation":"Đáp án đúng là: Giảm thiểu nguy cơ ngộ độc thực phẩm do vi khuẩn, ký sinh trùng Vì: Một trong những mục tiêu quan trọng nhất của Kiểm nghiệm thú sản là phát hiện vi khuẩn, ký sinh trùng gây bệnh trong thực phẩm động vật, từ đó giảm nguy cơ ngộ độc thực phẩm, bảo vệ sức khỏe người tiêu dùng.","reference":"Mục 1.1"},{"id":8,"text":"Theo quy định tại Thông tư 09/2016/TT-BNNPTNT, việc kiểm tra vệ sinh thú y đối với động vật không bao gồm nội dung nào dưới đây ?","answers":["A. Kiểm tra các bệnh ký sinh trùng có thể lây từ động vật sang người .","B. Phát hiện dư lượng chất độc , kháng sinh gây hại cho người và động vật","C. Kiểm tra bệnh truyền nhiễm ở gia súc , gia cầm","D. Đánh giá giá trị dinh dưỡng của các sản phẩm động vật ."],"correct":3,"explanation":"Đáp án đúng là: Đánh giá giá trị dinh dưỡng của các sản phẩm động vật . Vì: Việc kiểm nghiệm thú sản tập trung vào an toàn vệ sinh , dịch bệnh , chất độc hại , nhưng không có nhiệm vụ chính là đánh giá giá trị dinh dưỡng của sản phẩm động vật .","reference":"Mục 1.1"},{"id":9,"text":"Kiểm nghiệm thú sản có vai trò gì đối với xuất khẩu thực phẩm?","answers":["A. Tăng lợi nhuận cho người chăn nuôi","B. Giúp sản phẩm đạt tiêu chuẩn an toàn thực phẩm quốc tế","C. Giảm chi phí kiểm dịch tại cửa khẩu","D. Hạn chế ô nhiễm môi trường từ chất thải chăn nuôi"],"correct":1,"explanation":"Đáp án đúng là: Giúp sản phẩm đạt tiêu chuẩn an toàn thực phẩm quốc tế Vì: Kiểm nghiệm thú sản đảm bảo sản phẩm động vật đạt tiêu chuẩn an toàn, đáp ứng yêu cầu xuất khẩu của các thị trường quốc tế.","reference":"Mục 1.1"},{"id":10,"text":"Một trong những mục đích của môn Kiểm nghiệm thú sản là gì?","answers":["A. Kiểm tra thành phần dinh dưỡng của thức ăn thực vật","B. Kiểm tra chất lượng sản phẩm công nghiệp và thành phần dinh dưỡng của thức ăn thực vật","C. Kiểm tra chất lượng sản phẩm công nghiệp","D. Đảm bảo an toàn thực phẩm cho con người"],"correct":3,"explanation":"Đáp án đúng là: Đảm bảo an toàn thực phẩm cho con người Vì: Mục đích chính của môn học là đảm bảo thực phẩm từ động vật an toàn cho sức khỏe con người.","reference":"Mục 1.2"},{"id":11,"text":"Thức ăn có nguồn gốc động vật quan trọng vì lý do nào sau đây?","answers":["Khả năng đồng hóa cao hơn các sản phẩm khác","Tất cả các đáp án đều đúng","Giúp cơ thể con người tái tạo tế bào","Cung cấp protit có giá trị dinh dưỡng cao"],"correct":1,"explanation":"Đáp án đúng là: Tất cả các đáp án đều đúng Vì: Thức ăn có nguồn gốc động vật chứa protit chất lượng cao, cần thiết cho cơ thể con người để tái tạo tế bào và duy trì sức khỏe.","reference":"Mục 1.1"},{"id":12,"text":"Một trong những lợi ích quan trọng của việc kiểm soát giết mổ gia súc , gia cầm là gì ?","answers":["A. Ngăn chặn hoàn toàn sự lây lan của dịch bệnh trong đàn gia súc , gia cầm .","B. Hạn chế việc lạm dụng thuốc kháng sinh trong chăn nuôi","C. Tránh làm giảm chất lượng sản phẩm động vật do quá trình giết mổ không kiểm soát .","D. Giữ lại những con vật còn nhỏ hoặc mang thai để đảm bảo phát triển đàn ."],"correct":3,"explanation":"Đáp án đúng là: Giữ lại những con vật còn nhỏ hoặc mang thai để đảm bảo phát triển đàn . Vì: Kiểm soát giết mổ giúp tránh tình trạng giết mổ bừa bãi , đảm bảo những con vật chưa đủ tuổi hoặc đang mang thai không bị giết mổ sớm , góp phần vào sự phát triển của đàn gia súc .","reference":"Mục 1.1"},{"id":13,"text":"Việc kiểm nghiệm động vật trước giết mổ giúp phát hiện điều gì?","answers":["A. Hàm lượng nước trong cơ thể động vật","B. Dấu hiệu bệnh lý trên động vật","C. Hương vị của thịt sau chế biến","D. Lượng chất béo trong thịt"],"correct":1,"explanation":"Đáp án đúng là: Dấu hiệu bệnh lý trên động vật Vì: Kiểm tra trước giết mổ giúp phát hiện bệnh lý trên động vật, đặc biệt là các bệnh truyền nhiễm có thể ảnh hưởng đến sức khỏe con người","reference":"Mục 1.1"},{"id":14,"text":"Vì sao môn Kiểm nghiệm thú sản thường được giảng dạy sau các môn học khác trong ngành Thú y?","answers":["A. Tất cả phương án đã nêu đều đúng","B. Đòi hỏi sự hiểu biết về dinh dưỡng và các chính sách pháp luật thú y","C. Cần kiến thức nền tảng về giải phẫu , sinh lý , vi sinh vật , bệnh học","D. Liên quan đến nhiều lĩnh vực chuyên môn khác trong ngành"],"correct":2,"explanation":"Đáp án đúng là: Cần kiến thức nền tảng về giải phẫu , sinh lý , vi sinh vật , bệnh học Vì: Môn Kiểm nghiệm thú sản yêu cầu kiến thức từ nhiều lĩnh vực khác nhau như giải phẫu , sinh lý , vi sinh vật , pháp luật , nên thường được học sau các môn cơ bản và chuyên ngành khác . .","reference":"Mục 1.4"},{"id":15,"text":"Công tác kiểm soát vệ sinh thú y có ý nghĩa gì đối với xuất khẩu sản phẩm động vật?","answers":["A. Giúp giảm chi phí vận chuyển sản phẩm động vật ra nước ngoài","B. Đảm bảo sản phẩm đáp ứng tiêu chuẩn an toàn thực phẩm của các nước nhập khẩu","C. Tăng tốc độ sản xuất và chế biến sản phẩm động vật","D. Hạn chế nhu cầu kiểm dịch tại cửa khẩu của nước nhập khẩu"],"correct":1,"explanation":"Đáp án đúng là: Đảm bảo sản phẩm đáp ứng tiêu chuẩn an toàn thực phẩm của các nước nhập khẩu Vì: Công tác kiểm soát vệ sinh thú y giúp đảm bảo sản phẩm động vật đáp ứng tiêu chuẩn an toàn thực phẩm quốc tế, tạo điều kiện thuận lợi cho xuất khẩu và nâng cao uy tín sản phẩm trên thị trường thế giới. . .","reference":"Mục 1.1"},{"id":16,"text":"Vì sao cần kiểm tra động vật trước khi giết mổ?","answers":["A. Để phát hiện động vật có mắc bệnh hay không","B. Để đánh giá khối lượng cơ thể động vật","C. Để xác định chất lượng thịt sau giết mổ","D. Để kiểm tra nguồn gốc xuất xứ của động vật"],"correct":0,"explanation":"Đáp án đúng là: Để phát hiện động vật có mắc bệnh hay không Vì: Kiểm tra trước giết mổ giúp phát hiện sớm bệnh truyền nhiễm, đảm bảo không đưa động vật mắc bệnh vào quá trình giết mổ.","reference":"Mục 1.2"},{"id":17,"text":"Môn Kiểm nghiệm thú sản có mối liên hệ với Giải phẫu động vật như thế nào?","answers":["A. Giúp đánh giá giá trị dinh dưỡng của thịt và các sản phẩm động vật","B. Nghiên cứu đặc điểm hành vi của động vật trong quá trình chăn nuôi","C. Giúp xác định vị trí và tình trạng của các cơ quan nội tạng trong quá trình kiểm tra sau giết mổ","D. Hỗ trợ phát hiện các loại vi khuẩn gây bệnh có trong thực phẩm động vật"],"correct":2,"explanation":"Đáp án đúng là: Giúp xác định vị trí và tình trạng của các cơ quan nội tạng trong quá trình kiểm tra sau giết mổ Vì: Môn Kiểm nghiệm thú sản có liên quan đến Giải phẫu động vật vì nó giúp xác định cấu trúc, vị trí và tình trạng của các cơ quan nội tạng (như gan, phổi, hạch lympho) để phát hiện các bệnh lý và đảm bảo chất lượng thực phẩm sau giết mổ.","reference":"Mục 1.4"},{"id":18,"text":"Tại sao kiểm nghiệm thú sản không chỉ quan trọng đối với sức khỏe con người mà còn có tác động lớn đến an toàn dịch bệnh trên động vật nuôi?","answers":["A. Vì kiểm nghiệm thú sản giúp phát hiện sớm các bệnh truyền nhiễm, từ đó ngăn chặn sự lây lan trong đàn gia súc, gia cầm","B. Vì kiểm nghiệm thú sản giúp tăng giá trị thương mại của sản phẩm động vật, giảm tổn thất kinh tế do dịch bệnh","C. Vì kiểm nghiệm thú sản cho phép theo dõi và quản lý hiệu quả hơn các loại thuốc thú y sử dụng trong chăn nuôi","D. Vì kiểm nghiệm thú sản giúp kéo dài thời gian bảo quản thực phẩm có nguồn gốc động vậ"],"correct":0,"explanation":"Đáp án đúng là: Vì kiểm nghiệm thú sản giúp phát hiện sớm các bệnh truyền nhiễm, từ đó ngăn chặn sự lây lan trong đàn gia súc, gia cầm Vì: Mục đích chính của kiểm nghiệm thú sản là đảm bảo an toàn thực phẩm và sức khỏe con người , nhưng nó cũng giúp phát hiện sớm các bệnh truyền nhiễm ( như cúm gia cầm , dịch tả lợn châu Phi), từ đó hạn chế sự lây lan dịch bệnh trong đàn gia súc , gia cầm , góp phần bảo vệ ngành chăn nuôi .","reference":"Mục 1.1"},{"id":19,"text":"Vào thời kỳ nào, con người bắt đầu nhận thức được sự nguy hiểm của thực phẩm có nguồn gốc động vật nếu không được kiểm tra?","answers":["A. Thế kỷ 20","B. Thế kỷ 19","C. Thế kỷ 17","D. Thế kỷ 18"],"correct":2,"explanation":"Đáp án đúng là: Thế kỷ 17 Vì: Vào thế kỷ 17, con người nhận thức được rằng thực phẩm có nguồn gốc động vật nếu không được kiểm tra kỹ lưỡng có thể gây nguy hiểm cho sức khỏe. Điều này dẫn đến sự ra đời của các biện pháp kiểm soát thực phẩm động vật.","reference":"Mục 1.3"},{"id":20,"text":"Ở Việt Nam, việc kiểm soát giết mổ gia súc được chú trọng từ thời kỳ nào?","answers":["A. Sau Cách mạng tháng Tám","B. Thời kỳ phong kiến","C. Thời kỳ Pháp thuộc","D. Những năm gần đây"],"correct":1,"explanation":"Đáp án đúng là: Thời kỳ phong kiến Vì: Từ thời phong kiến, đặc biệt là dưới triều đại nhà Lý, chính quyền đã có quy định hạn chế việc giết mổ trâu, bò nhằm đảm bảo sức kéo cho sản xuất nông nghiệp và kiểm soát nguồn thực phẩm.","reference":"Mục 1.3"},{"id":21,"text":"Trong lịch sử, ban đầu công tác kiểm nghiệm thực phẩm động vật được giao cho ai?","answers":["A. Bác sĩ thú y","B. Cảnh sát","C. Bác sĩ y tế","D. Công nhân"],"correct":1,"explanation":"Đáp án đúng là: Cảnh sát Vì: Vào thế kỷ 17, công tác kiểm nghiệm thực phẩm động vật được giao cho cảnh sát , nhưng do thiếu kiến thức chuyên môn , sau đó được giao cho bác sĩ y tế và cuối cùng cho bác sĩ thú y.","reference":"Mục 1.3"},{"id":22,"text":"Sản phẩm động vật nào dưới đây không thuộc đối tượng kiểm tra của kiểm nghiệm thú sản?","answers":["A. Phương tiện vận chuyển","B. Thịt, sữa, trứng","C. Rau, trái cây","D. Da, lông, sừng"],"correct":2,"explanation":"Đáp án đúng là: Rau, trái cây Vì: Kiểm nghiệm thú sản tập trung vào động vật và sản phẩm động vật, không bao gồm thực phẩm có nguồn gốc thực vật như rau xanh và trái cây.","reference":"Mục 1.1"},{"id":23,"text":"Ở Việt Nam, trong thời kỳ phong kiến, việc giết mổ trâu bò được quản lý như thế nào?","answers":["A. Bị cấm hoàn toàn vì lý do tôn giáo","B. Phải được chính quyền phê chuẩn để đảm bảo sức kéo cho nông nghiệp","C. Hoàn toàn tự do, không có sự kiểm soát","D. Chỉ được phép giết mổ trong các dịp lễ hội lớn"],"correct":1,"explanation":"Đáp án đúng là: Phải được chính quyền phê chuẩn để đảm bảo sức kéo cho nông nghiệp Vì: Trong thời kỳ phong kiến Việt Nam, đặc biệt là thời nhà Lý, việc giết mổ trâu bò bị hạn chế và phải có sự phê chuẩn của chính quyền nhằm đảm bảo số lượng trâu bò phục vụ sản xuất nông nghiệp.","reference":"Mục 1.1"},{"id":24,"text":"Tại sao đến đầu thế kỷ 20, việc kiểm nghiệm thực phẩm động vật mới chính thức được giao cho các bác sĩ thú y thay vì các bác sĩ y khoa?","answers":["A. Vì bác sĩ y khoa không am hiểu bệnh tật của động vật và không thể kiểm soát dịch bệnh trên đàn gia súc, gia cầm","B. Vì nhu cầu xuất khẩu thực phẩm động vật tăng cao, đòi hỏi kiểm tra chặt chẽ hơn từ chuyên gia thú y","C. Vì các trường đại học thú y đã phát triển mạnh mẽ, cung cấp đủ nhân lực chuyên môn cho công tác kiểm nghiệm thực phẩm","D. Vì bác sĩ thú y có thể thực hiện đồng thời hai nhiệm vụ: kiểm soát chất lượng thực phẩm và ngăn chặn dịch bệnh trên động vật"],"correct":3,"explanation":"Đáp án đúng là: Vì bác sĩ thú y có thể thực hiện đồng thời hai nhiệm vụ: kiểm soát chất lượng thực phẩm và ngăn chặn dịch bệnh trên động vật Vì: Đến đầu thế kỷ 20, người ta nhận ra rằng chỉ có bác sĩ thú y mới có thể thực hiện cả hai nhiệm vụ quan trọng: đảm bảo chất lượng thực phẩm cho con người và kiểm soát dịch bệnh trên động vật, giúp bảo vệ sức khỏe cộng đồng một cách toàn diện.","reference":"Mục 1.3"},{"id":25,"text":"Tại sao công tác kiểm soát vệ sinh thú y có ảnh hưởng đến giá trị của hàng xuất khẩu động vật và sản phẩm động vật?","answers":["A. Làm giảm nguy cơ sản phẩm bị từ chối hoặc tiêu hủy tại nước nhập khẩu","B. Đảm bảo sản phẩm đáp ứng tiêu chuẩn vệ sinh an toàn thực phẩm của thị trường quốc tế","C. Giúp kéo dài thời gian bảo quản và vận chuyển sản phẩm động vật","D. Giúp sản phẩm có màu sắc và mùi vị hấp dẫn hơn đối với người tiêu dùng"],"correct":1,"explanation":"Đáp án đúng là: Đảm bảo sản phẩm đáp ứng tiêu chuẩn vệ sinh an toàn thực phẩm của thị trường quốc tế Vì: Kiểm soát vệ sinh thú y giúp sản phẩm đáp ứng tiêu chuẩn an toàn thực phẩm quốc tế, tránh rủi ro bị trả hàng, tạo uy tín cho ngành xuất khẩu và tăng giá trị thương mại của sản phẩm động vật.","reference":"Mục 1.2"},{"id":26,"text":"Ưu điểm chính của phương pháp bảo quản bằng cách muối thực phẩm là gì?","answers":["A. Bảo quản thực phẩm vĩnh viễn","B. Làm giảm hàm lượng nước tự do trong sản phẩm","C. Tiêu diệt hoàn toàn vi khuẩn gây hư hỏng","D. Tăng hương vị cho thực phẩm"],"correct":1,"explanation":"Đáp án đúng là: Làm giảm hàm lượng nước tự do trong sản phẩm Vì: Muối giúp rút nước ra khỏi tế bào vi khuẩn và thực phẩm, làm giảm hoạt độ nước (aw), từ đó ức chế sự phát triển của vi sinh vật gây hư hỏng thực phẩm.","reference":"Mục 2.2.2.1"},{"id":27,"text":"Mục đích chính của phương pháp tiệt trùng trong bảo quản thực phẩm là gì?","answers":["A. Giữ nguyên màu sắc và hương vị của thực phẩm","B. Tiêu diệt hoặc làm bất hoạt vi sinh vật gây hại","C. Làm giảm kích thước thực phẩm để dễ vận chuyển","D. Làm tăng độ ẩm để thực phẩm không bị khô"],"correct":1,"explanation":"Đáp án đúng là: Tiêu diệt hoặc làm bất hoạt vi sinh vật gây hại Vì: Tiệt trùng là phương pháp sử dụng nhiệt độ cao để tiêu diệt hoặc làm bất hoạt vi sinh vật, giúp thực phẩm an toàn hơn và bảo quản được lâu hơn.","reference":"Mục 2.2.1.1."},{"id":28,"text":"Khi bảo quản thực phẩm bằng phương pháp làm lạnh, tại sao không nên làm đông thực phẩm quá chậm?","answers":["A. Vì làm giảm giá trị dinh dưỡng của thực phẩm","B. Vì làm chậm quá trình trao đổi chất của vi sinh vật","C. Vì làm tăng hoạt độ nước trong thực phẩ","D. Vì tạo ra tinh thể nước đá lớn có thể làm hỏng cấu trúc thực phẩm"],"correct":3,"explanation":"Đáp án đúng là: Vì tạo ra tinh thể nước đá lớn có thể làm hỏng cấu trúc thực phẩm Vì : Khi thực phẩm đông lạnh quá chậm, tinh thể nước đá hình thành sẽ có kích thước lớn, làm vỡ màng tế bào và gây tổn thương cấu trúc thực phẩm. Điều này có thể ảnh hưởng đến chất lượng sau khi rã đông.","reference":"Mục 2.2.1.2"},{"id":29,"text":"Ướp muối giúp bảo quản thực phẩm động vật bằng cách nào?","answers":["Tạo lớp màng bảo vệ chống lại sự xâm nhập của vi sinh vật","Cung cấp chất dinh dưỡng giúp bảo quản lâu hơn","Tăng độ pH, làm vi khuẩn không thể tồn tại","Hút nước ra khỏi tế bào vi khuẩn, làm vi khuẩn không thể phát triển"],"correct":3,"explanation":"Đáp án đúng là: Hút nước ra khỏi tế bào vi khuẩn, làm vi khuẩn không thể phát triển Vì: Muối có tác dụng hút nước ra khỏi thực phẩm và vi khuẩn thông qua cơ chế thẩm thấu, làm mất môi trường sống của vi khuẩn, từ đó giúp bảo quản sản phẩm lâu hơn.","reference":"Mục 2.2.2.1"},{"id":30,"text":"Phương pháp bảo quản thực phẩm bằng cách chiếu xạ có tác dụng gì?","answers":["A. Phá hủy DNA của vi khuẩn, ngăn chúng sinh sôi","B. Bổ sung vi khuẩn có lợi vào thực phẩm","C. Làm đông thực phẩm để kéo dài thời gian sử dụng","D. Loại bỏ hoàn toàn nước trong thực phẩm"],"correct":0,"explanation":"Đáp án đúng là: Phá hủy DNA của vi khuẩn, ngăn chúng sinh sôi Vì: Chiếu xạ sử dụng tia gamma hoặc tia X để phá hủy DNA của vi sinh vật gây hại, làm giảm nguy cơ ô nhiễm và kéo dài thời gian bảo quản thực phẩm.","reference":"Mục 2.2.1.4"},{"id":31,"text":"Khi bảo quản thịt bằng phương pháp hun khói , yếu tố nào dưới đây đóng vai trò chính trong việc kéo dài thời gian bảo quản?","answers":["A. Khói có chứa các hợp chất kháng khuẩn và kháng nấm","B. Quá trình hun khói làm giảm lượng protein trong thịt, khiến vi khuẩn không còn nguồn dinh dưỡng","C. Nhiệt độ của khói làm đông cứng vi khuẩn, khiến chúng ngừng hoạt động","D. Hun khói làm tăng hàm lượng nước trong thịt, giúp bảo quản lâu hơn"],"correct":0,"explanation":"Đáp án đúng là: Khói có chứa các hợp chất kháng khuẩn và kháng nấm Vì: Trong quá trình hun khói, các hợp chất như formaldehyde, phenol và axit hữu cơ từ khói có tác dụng ức chế sự phát triển của vi sinh vật, giúp kéo dài thời gian bảo quản thực phẩm.","reference":"Mục 2.2.2.4"},{"id":32,"text":"Trong bảo quản bằng phương pháp lên men, nhóm vi sinh vật nào có vai trò quan trọng nhất trong việc tạo ra môi trường có tính kháng khuẩn?","answers":["A. Nấm men","B. Vi khuẩn gram âm","C. Vi khuẩn lactic","D. Vi khuẩn hiếu khí"],"correct":2,"explanation":"Đáp án đúng là: Vi khuẩn lactic Vì: Vi khuẩn lactic lên men đường tạo ra acid lactic, làm giảm pH môi trường, ức chế sự phát triển của vi sinh vật gây hư hỏng và kéo dài thời gian bảo quản thực phẩm.","reference":"Mục 2.2.4"},{"id":33,"text":"Trong bảo quản lạnh, tại sao đông lạnh sâu (-18°C hoặc thấp hơn) giúp bảo quản thực phẩm tốt hơn so với làm lạnh thông thường (0 - 4°C)?","answers":["A. Vì làm lạnh thông thường có thể làm tăng hoạt động enzyme trong thực phẩm","B. Vì đông lạnh sâu làm cho nước trong tế bào thực phẩm kết tinh, khiến vi khuẩn không thể phát triển","C. Vì đông lạnh sâu giúp bảo toàn hoàn toàn cấu trúc dinh dưỡng của thực phẩm","D. Vì đông lạnh sâu tiêu diệt hoàn toàn tất cả vi sinh vật trong thực phẩm"],"correct":1,"explanation":"Đáp án đúng là: Vì đông lạnh sâu làm cho nước trong tế bào thực phẩm kết tinh, khiến vi khuẩn không thể phát triển Vì: Ở nhiệt độ đông lạnh sâu, nước trong thực phẩm bị đóng băng hoàn toàn, làm giảm hoạt độ nước (aw), khiến vi sinh vật không thể phát triển. Tuy nhiên, đông lạnh không tiêu diệt vi khuẩn, mà chỉ làm chậm hoặc ngừng sự phát triển của chúng.","reference":"Mục 2.2.1.2"},{"id":34,"text":"Tại sao phương pháp bảo quản bằng lên men lại giúp thực phẩm giữ được lâu hơn?","answers":["A. Loại bỏ hoàn toàn vi sinh vật khỏi thực phẩm","B. Làm tăng độ ẩm của thực phẩm để vi khuẩn không phát triển","C. Làm giảm nhiệt độ thực phẩm xuống mức cực thấp","D. Sản sinh các hợp chất ức chế vi sinh vật gây hư hỏng"],"correct":3,"explanation":"Đáp án đúng là: Sản sinh các hợp chất ức chế vi sinh vật gây hư hỏng Vì: Quá trình lên men tạo ra các acid hữu cơ (như acid lactic) hoặc các hợp chất khác có tác dụng ức chế vi sinh vật gây hư hỏng, từ đó kéo dài thời gian bảo quản thực phẩm.","reference":"Mục 2.2.4"},{"id":35,"text":"Khi bảo quản thực phẩm bằng phương pháp ướp muối, yếu tố nào giúp ức chế sự phát triển của vi khuẩn gây hư hỏng?","answers":["A. Giảm nhiệt độ bảo quản","B. Tăng áp suất trong tế bào vi khuẩn","C. Giảm hoạt độ nước trong thực phẩm","D. Thay đổi thành phần khí trong thực phẩm"],"correct":2,"explanation":"Đáp án đúng là: Giảm hoạt độ nước trong thực phẩm Vì: Muối có khả năng hút nước ra khỏi tế bào vi khuẩn và thực phẩm, làm giảm hoạt độ nước (Aw). Khi hoạt độ nước giảm xuống mức thấp, vi khuẩn không thể phát triển và gây hư hỏng thực phẩm","reference":"Mục 2.2.2.1"},{"id":36,"text":"Tại sao phương pháp sấy khô giúp bảo quản sản phẩm động vật?","answers":["A. Ngăn chặn hoàn toàn sự xâm nhập của vi khuẩn từ bên ngoài","B. Giảm lượng nước trong thực phẩm, làm vi khuẩn không thể phát triển","C. Tạo môi trường axit, ức chế sự phát triển của vi sinh vật","D. Giữ nguyên cấu trúc thực phẩm mà không ảnh hưởng đến chất lượng"],"correct":1,"explanation":"Đáp án đúng là: Giảm lượng nước trong thực phẩm, làm vi khuẩn không thể phát triển Vì: Sấy khô làm giảm hàm lượng nước trong thực phẩm, khiến vi khuẩn và nấm mốc không thể sinh sôi, nhờ đó kéo dài thời gian bảo quản.","reference":"Mục 2.2.1.3"},{"id":37,"text":"Phương pháp nào dưới đây KHÔNG phải là phương pháp bảo quản thực phẩm động vật?","answers":["A. Lên men","B. Tiệt trùng","C. Rửa sạch bằng nước","D. Chiếu xạ"],"correct":2,"explanation":"Đáp án đúng là: Rửa sạch bằng nước Vì: Rửa sạch bằng nước chỉ giúp loại bỏ bụi bẩn và một số vi sinh vật trên bề mặt thực phẩm nhưng không có tác dụng kéo dài thời gian bảo quản như các phương pháp bảo quản thực phẩm khác.","reference":"Mục 2.2"},{"id":38,"text":"Trong quá trình bảo quản thực phẩm bằng phương pháp muối chua, yếu tố nào quan trọng nhất giúp ngăn chặn sự phát triển của vi sinh vật gây hư hỏng?","answers":["A. Hàm lượng muối thấp để vi khuẩn phát triển","B. Độ pH thấp do sản sinh acid hữu cơ","C. Áp suất thẩm thấu cao do có nhiều nước","D. Hàm lượng đường cao"],"correct":1,"explanation":"Đáp án đúng là: Độ pH thấp do sản sinh acid hữu cơ Vì: Trong quá trình muối chua, vi khuẩn lactic lên men tạo ra acid hữu cơ (chủ yếu là acid lactic), làm giảm pH của thực phẩm xuống mức mà vi khuẩn gây hư hỏng không thể phát triển được.","reference":"Mục 2.2.4"},{"id":39,"text":"Trong phương pháp bảo quản bằng đông lạnh, yếu tố nào có ảnh hưởng lớn nhất đến tốc độ kết tinh của nước trong thực phẩm?","answers":["A. Nhiệt độ bảo quản","B. Kích thước và hình dạng thực phẩm","C. Hàm lượng nước trong thực phẩm","D. Loại thực phẩm được bảo quản"],"correct":0,"explanation":"Đáp án đúng là: Nhiệt độ bảo quản Vì: Tốc độ kết tinh của nước phụ thuộc chủ yếu vào nhiệt độ làm lạnh. Khi nhiệt độ giảm nhanh, các tinh thể nước đá nhỏ hơn sẽ hình thành, giúp bảo vệ cấu trúc tế bào thực phẩm tốt hơn.","reference":"Mục 2.2.1.2"},{"id":40,"text":"Phương pháp bảo quản nhiệt độ cao như tiệt trùng có thể gây ra tác động gì đến thực phẩm?","answers":["A. Giúp giữ nguyên hương vị ban đầu của thực phẩm","B. Làm giảm hàm lượng nước trong thực phẩm","C. Làm thay đổi cấu trúc protein và một số chất dinh dưỡng","D. Hoàn toàn không ảnh hưởng đến chất lượng thực phẩm"],"correct":2,"explanation":"Đáp án đúng là: Làm thay đổi cấu trúc protein và một số chất dinh dưỡng Vì: Quá trình thanh trùng và tiệt trùng sử dụng nhiệt độ cao, có thể làm biến tính protein và giảm một số vitamin nhạy cảm với nhiệt như vitamin C. Tuy nhiên, phương pháp này giúp tiêu diệt vi sinh vật gây hại và kéo dài thời gian bảo quản thực phẩm.","reference":"Mục 2.2.1.1"},{"id":41,"text":"Yếu tố nào dưới đây ảnh hưởng đến hiệu quả bảo quản thực phẩm bằng phương pháp sấy khô?","answers":["A. Loại bao bì sử dụng để đóng gói","B. Màu sắc của thực phẩm","C. Hình dạng của thực phẩm","D. Nhiệt độ và độ ẩm"],"correct":3,"explanation":"Đáp án đúng là: Nhiệt độ và độ ẩm Vì: Sấy khô dựa vào việc loại bỏ nước ra khỏi thực phẩm, do đó, nhiệt độ và độ ẩm có ảnh hưởng trực tiếp đến tốc độ và hiệu quả của quá trình sấy khô.","reference":"Mục 2.2.1.3"},{"id":42,"text":"Quá trình lên men trong bảo quản sản phẩm động vật thường tạo ra môi trường có đặc điểm gì giúp kéo dài thời gian sử dụng thực phẩm?","answers":["A. Môi trường khô ráo","B. Môi trường giàu oxy","C. Môi trường kiềm cao","D. Môi trường có độ axit cao"],"correct":3,"explanation":"Đáp án đúng là: Môi trường có độ axit cao Vì : Quá trình lên men sản sinh ra axit lactic và các hợp chất khác làm giảm pH của thực phẩm, tạo môi trường axit bất lợi cho sự phát triển của vi khuẩn gây hư hỏng.","reference":"Mục 2.2.4"},{"id":43,"text":"Trong số các enzyme sau, enzyme nào có vai trò quan trọng trong quá trình tự phân hủy của thịt sau khi giết mổ?","answers":["A. Protease","B. Amylase","C. Lipase","D. Catalase"],"correct":0,"explanation":"Đáp án đúng là: Protease Vì : Protease phân giải protein trong cơ thịt, làm mềm kết cấu thịt nhưng cũng có thể gây hư hỏng nếu không được kiểm soát tốt. Quá trình này là nguyên nhân chính của hiện tượng tự phân hủy sau giết mổ.","reference":"Mục 2.1.2"},{"id":44,"text":"Khi bảo quản thực phẩm trong môi trường không có oxy (ví dụ: hút chân không hoặc bảo quản trong khí CO₂), vi sinh vật nào có thể phát triển mạnh?","answers":["A. Vi khuẩn kỵ khí bắt buộc như Clostridium botulinum","B. Vi khuẩn hiếu khí","C. Vi khuẩn ưa mặn","D. Vi khuẩn ưa nhiệt"],"correct":0,"explanation":"Đáp án đúng là: Vi khuẩn kỵ khí bắt buộc như Clostridium botulinum Vì: Clostridium botulinum là vi khuẩn kỵ khí bắt buộc, có thể phát triển trong môi trường không có oxy, chẳng hạn như thực phẩm đóng hộp hoặc hút chân không, và sản sinh độc tố botulin gây ngộ độc thực phẩm nghiêm trọng.","reference":"Mục 2.1.1"},{"id":45,"text":"Trong bảo quản bằng đóng hộp , tại sao thực phẩm cần được xử lý nhiệt trước khi đóng hộp?","answers":["A. Giúp nắp hộp kín chặt hơn","B. Tiêu diệt vi khuẩn và enzym gây hư hỏng thực phẩm","C. Làm tăng hàm lượng nước trong thực phẩm","D. Giúp thực phẩm giữ được màu sắc tự nhiên"],"correct":1,"explanation":"Đáp án đúng là: Tiêu diệt vi khuẩn và enzym gây hư hỏng thực phẩm Vì: Xử lý nhiệt trước khi đóng hộp giúp tiêu diệt phần lớn vi sinh vật và làm bất hoạt enzym có thể gây hư hỏng thực phẩm trong quá trình bảo quản.","reference":"Mục 2.1.1"},{"id":46,"text":"Lên men là phương pháp bảo quản thực phẩm dựa vào nguyên lý nào?","answers":["A. Sử dụng vi sinh vật có lợi để ức chế vi sinh vật gây hại","B. Giảm nhiệt độ xuống mức cực thấp để ngăn vi khuẩn phát triển","C. Làm khô thực phẩm để giảm sự phát triển của vi khuẩn","D. Phủ lớp dầu để ngăn vi sinh vật tiếp xúc với thực phẩm"],"correct":0,"explanation":"Đáp án đúng là: Sử dụng vi sinh vật có lợi để ức chế vi sinh vật gây hại Vì: Lên men là quá trình sử dụng vi sinh vật có lợi (như vi khuẩn lactic, nấm men) để tạo ra các hợp chất có tính bảo quản như axit, rượu, giúp ức chế sự phát triển của vi sinh vật gây hư hỏng thực phẩm.","reference":"Mục 2.2.4."},{"id":47,"text":"Phương pháp bảo quản thực phẩm nào giúp giữ được giá trị dinh dưỡng tốt nhất?","answers":["A. Lên men","B. Phơi khô","C. Đông lạnh","D. Ướp muối"],"correct":2,"explanation":"Đáp án đúng là: Đông lạnh Vì: Đông lạnh giúp bảo quản thực phẩm mà không làm mất nhiều chất dinh dưỡng như các phương pháp khác. Khi bảo quản ở nhiệt độ thấp, sự biến đổi hóa học và sự phát triển của vi sinh vật bị chậm lại, giữ được chất lượng thực phẩm tốt nhất.","reference":"Mục 2.2.1.2."},{"id":48,"text":"Trong quá trình bảo quản thực phẩm bằng phương pháp hun khói, hợp chất nào đóng vai trò chính trong việc ức chế vi sinh vật và kéo dài thời gian bảo quản?","answers":["A. Vitamin C và vitamin E","B. Muối khoáng","C. Các acid béo không no","D. Các hợp chất phenol và formaldehyde"],"correct":3,"explanation":"Đáp án đúng là: Các hợp chất phenol và formaldehyde Vì: Khói sinh ra trong quá trình hun chứa phenol và formaldehyde, có tác dụng kháng khuẩn và chống oxy hóa, giúp ức chế sự phát triển của vi sinh vật, từ đó kéo dài thời gian bảo quản thực phẩm.","reference":"Mục 2.2.2.4"},{"id":49,"text":"Sản phẩm động vật nào dưới đây thường được bảo quản bằng phương pháp ướp muối?","answers":["A. Cá khô","B. Sữa tươi","C. Thịt hộp","D. Cá muối"],"correct":3,"explanation":"Đáp án đúng là: Cá muối Vì: Ướp muối là phương pháp bảo quản thực phẩm phổ biến, đặc biệt với cá, giúp làm mất nước và ức chế sự phát triển của vi khuẩn, kéo dài thời gian bảo quản.","reference":"Mục 2.2.2.1"},{"id":50,"text":"Phương pháp bảo quản nào dưới đây giúp kéo dài thời gian sử dụng sản phẩm động vật bằng cách hạ thấp nhiệt độ","answers":["A. Lên men","B. Ướp muối","C. Sấy khô","D. Đông lạnh"],"correct":3,"explanation":"Đáp án đúng là: Đông lạnh Vì: Phương pháp đông lạnh giúp kéo dài thời gian bảo quản sản phẩm động vật bằng cách làm giảm nhiệt độ xuống mức rất thấp (thường dưới -18°C), ức chế sự phát triển của vi sinh vật và làm chậm quá trình hư hỏng.","reference":"Mục 2.2.1.2"},{"id":51,"text":"Gia súc non cần được vận chuyển như thế nào để đảm bảo an toàn?","answers":["A. Vận chuyển riêng để tránh bị tác động từ gia súc trưởng thành","B. Đặt ở tầng trên cùng để dễ tiếp cận","C. Vận chuyển cùng gia súc trưởng thành để tiết kiệm không gian","D. Không quan trọng cách vận chuyển."],"correct":0,"explanation":"Đáp án đúng là: Vận chuyển riêng để tránh bị tác động từ gia súc trưởng thành Vì: Gia súc non cần được vận chuyển riêng để đảm bảo an toàn và tránh bị tác động từ gia súc trưởng thành.","reference":"Mục 3.2.1.2."},{"id":52,"text":"Mục đích chính của việc vận chuyển gia súc, gia cầm là gì?","answers":["A. Đảm bảo gia súc, gia cầm ít bị sụt cân và không lây lan dịch bệnh.","B. Giảm thiểu chi phí thức ăn cho động vật.","C. Tăng cường khả năng sinh sản của động vật.","D. Tối đa hóa lợi nhuận cho người vận chuyển."],"correct":0,"explanation":"Đáp án đúng là: Đảm bảo gia súc, gia cầm ít bị sụt cân và không lây lan dịch bệnh. Vì: Mục đích chính của việc vận chuyển gia súc, gia cầm là đảm bảo chúng không bị sụt cân, không bị ốm yếu, chết trên đường và ngăn ngừa dịch bệnh lây lan.","reference":"Mục 3.1.2"},{"id":53,"text":"Khoang chứa động vật trên phương tiện vận chuyển cần có yêu cầu nào sau đây để đảm bảo an toàn cho động vật?","answers":["A. Có cạnh sắc để tiện cho quá trình kiểm tra.","B. Được thiết kế chắc chắn, chống thấm và có khả năng thoát nước tốt","C. Thiết kế không cần quan tâm đến việc động vật có không gian đứng tự nhiên.","D. Sàn được làm từ vật liệu dễ thấm nước để dễ vệ sinh"],"correct":1,"explanation":"Đáp án đúng là: Được thiết kế chắc chắn, chống thấm và có khả năng thoát nước tốt Vì: Khoang chứa động vật cần được thiết kế chắc chắn, chống thấm, và có khả năng thoát nước tốt để bảo vệ động vật và giữ gìn vệ sinh trong suốt quá trình vận chuyển.","reference":"Mục 3.2.1.2"},{"id":54,"text":"Khi vận chuyển gia súc non, cần chú ý điều gì?","answers":["A. Không cần chuẩn bị thức ăn và nước uống.","B. Không cần giấy chứng nhận kiểm dịch.","C. Vận chuyển chung với gia súc trưởng thành.","D. Vận chuyển riêng và đảm bảo không gian phù hợp."],"correct":3,"explanation":"Đáp án đúng là: Vận chuyển riêng và đảm bảo không gian phù hợp. Vì: Gia súc non cần được vận chuyển riêng để tránh bị tổn thương và cần có không gian phù hợp để đảm bảo an toàn và sức khỏe.","reference":"Mục 3.2.1.2."},{"id":55,"text":"Mật độ vận chuyển bằng đường bộ, đường sắt của lợn nặng 100 kg theo quy định là bao nhiêu?","answers":["A. 0,45 m²/con","B. 0,60 m²/con","C. 0,70 m²/con","D. 0,55 m²/con"],"correct":3,"explanation":"Đáp án đúng là: 0,55 m²/con Vì: Lợn có trọng lượng bình quân 100 kg có mật độ vận chuyển được quy định là 0,55 m²/con.","reference":"Mục 3.2.1.1."},{"id":56,"text":"Khi vận chuyển động vật bằng phương tiện kín, hệ thống thông khí cần đáp ứng tiêu chí nào?","answers":["A. Không cần thiết vì không ảnh hưởng đến sức khỏe động vật","B. Chỉ cần thông khí tự nhiên mà không cần thiết bị hỗ trợ","C. Đảm bảo thông khí liên tục, không cần điều chỉnh theo thời tiết","D. Có khả năng điều chỉnh phù hợp với điều kiện thời tiết bên ngoài"],"correct":3,"explanation":"Đáp án đúng là: Có khả năng điều chỉnh phù hợp với điều kiện thời tiết bên ngoài Vì: Trong phương tiện vận chuyển kín, hệ thống thông khí cần được thiết kế để điều chỉnh phù hợp với thời tiết nhằm đảm bảo sức khỏe và an toàn cho động vật.","reference":"Mục 3.2.1.2"},{"id":57,"text":"Giấy chứng nhận kiểm dịch cần thiết khi nào?","answers":["A. Vận chuyển trong cùng một huyện.","B. Vận chuyển ra khỏi địa bàn cấp tỉnh","C. Vận chuyển ra khỏi địa bàn cấp xã","D. Vận chuyển trong cùng một tỉnh."],"correct":1,"explanation":"Đáp án đúng là: Vận chuyển ra khỏi địa bàn cấp tỉnh Vì: Giấy chứng nhận kiểm dịch là bắt buộc khi vận chuyển gia súc, gia cầm ra khỏi địa bàn cấp tỉnh để đảm bảo kiểm soát dịch bệnh.","reference":"Mục 3.2.1.6."},{"id":58,"text":"Mật độ vận chuyển của gia cầm từ 1,6 đến 3 kg là bao nhiêu?","answers":["A. 0,115 m²/kg","B. 0,18 - 0,20 m²/kg","C. 0,16 m²/kg","D. 0,105 m²/kg"],"correct":2,"explanation":"Đáp án đúng là: 0,16 m²/kg Vì: Theo quy định, gia cầm từ 1,6 đến 3 kg có mật độ vận chuyển là 0,16 m²/kg.","reference":"Mục 3.2.1.1."},{"id":59,"text":"Khi vận chuyển gia súc trên 24 giờ, điều gì cần được chuẩn bị trong khoang chứa?","answers":["A. Không cần chuẩn bị gì đặc biệt vì thời gian ngắn.","B. Khu vực để cung cấp thức ăn, nước uống","C. Không gian để động vật có thể đứng thoải mái","D. Lồng nhỏ để gia súc không tiếp xúc với nhau"],"correct":1,"explanation":"Đáp án đúng là: Khu vực để cung cấp thức ăn, nước uống Vì: Đối với hành trình kéo dài hơn 24 giờ, khoang chứa gia súc cần có thiết kế thuận tiện để cung cấp thức ăn và nước uống.","reference":"Mục 3.2.1.2"},{"id":60,"text":"Quãng đường vận chuyển dài và khó đi có ảnh hưởng gì đến sức khỏe của gia súc, gia cầm?","answers":["A. Không gây ảnh hưởng nếu có thức ăn và nước uống","B. Làm giảm stress vận chuyển cho gia súc, gia cầm","C. Giúp gia súc, gia cầm quen với điều kiện khó khăn","D. Tăng khả năng sụt cân do phải chịu đựng thời gian dài và xóc lắc nhiều"],"correct":3,"explanation":"Đáp án đúng là: Tăng khả năng sụt cân do phải chịu đựng thời gian dài và xóc lắc nhiều Vì: Đường xa và khó đi khiến gia súc, gia cầm phải chịu đựng lâu hơn, bị mệt mỏi và sụt cân nhiều hơn.","reference":"Mục 3.3."},{"id":61,"text":"Trước khi vận chuyển gia súc, gia cầm, cần phải làm gì đầu tiên?","answers":["Cho gia súc, gia cầm ăn thật no.","Kiểm tra tình trạng sức khỏe của gia súc, gia cầm","Chuẩn bị giấy chứng nhận kiểm dịch.","Chuẩn bị phương tiện vận chuyển."],"correct":1,"explanation":"Đáp án đúng là: Kiểm tra tình trạng sức khỏe của gia súc, gia cầm Vì: Việc kiểm tra sức khỏe của gia súc, gia cầm trước khi vận chuyển là rất quan trọng để đảm bảo chúng đủ điều kiện và không mang mầm bệnh.","reference":"Mục 3.2.1.1."},{"id":62,"text":"Tại sao cần tránh chọn tuyến đường đi qua nơi có ổ dịch cũ khi vận chuyển gia súc, gia cầm?","answers":["A. Để đảm bảo vận chuyển nhanh chóng hơn","B. Để hạn chế nguy cơ lây nhiễm bệnh cho động vật","C. Để tiết kiệm chi phí vận chuyển","D. Vì ổ dịch cũ thường gây hư hại phương tiện."],"correct":1,"explanation":"Đáp án đúng là: Để hạn chế nguy cơ lây nhiễm bệnh cho động vật Vì : Tránh đi qua nơi có ổ dịch cũ nhằm giảm nguy cơ lây lan hoặc nhiễm bệnh cho đàn gia súc, gia cầm.","reference":"Mục 3.2.1.3"},{"id":63,"text":"Yếu tố nào sau đây ảnh hưởng lớn nhất đến sự giảm thể trọng của gia súc, gia cầm trong quá trình vận chuyển?","answers":["A. Màu sắc của phương tiện vận chuyển.","B. Điều kiện sống không bình thường và thời tiết khắc nghiệt.","C. Số lượng người tham gia vận chuyển.","D. Tốc độ trong quá trình vận chuyển."],"correct":1,"explanation":"Đáp án đúng là: Điều kiện sống không bình thường và thời tiết khắc nghiệt. Vì: Điều kiện sống không bình thường như mật độ đông, thiếu không khí, và thời tiết khắc nghiệt là những yếu tố chính gây stress và làm giảm thể trọng của gia súc, gia cầm.","reference":"Mục 3.3"},{"id":64,"text":"Mật độ vận chuyển bằng đường bộ, đường sắt đổi với bò nặng 250 kg?","answers":["A. 1,30 - 1,60 m²/kg","B. 0,70 - 0,95 m²/kg","C. 0,95 - 1,30 m²/kg","D. 0,30 - 0,40 m²/kg"],"correct":2,"explanation":"Đáp án đúng là: 0,95 - 1,30 m²/kg Vì: Theo quy định, bò nặng 250 kg có mật độ vận chuyển là 0,95-1,30 m²/kg","reference":"Mục 3.2.1.1."},{"id":65,"text":"Khi vận chuyển gia súc non trên đoạn đường dài, yếu tố nào cần được đảm bảo?","answers":["A. Cung cấp đầy đủ thức ăn và nước uống tại các khoảng trống thuận tiện","B. Không cần thức ăn và nước uống vì gia súc non khỏe hơn","C. Nhốt chung với gia súc trưởng thành để tiết kiệm diện tích","D. Vì đông lạnh sâu giúp bảo toàn hoàn toàn cấu trúc dinh dưỡng của thực phẩm"],"correct":0,"explanation":"Đáp án đúng là: Cung cấp đầy đủ thức ăn và nước uống tại các khoảng trống thuận tiện Vì: Đối với hành trình dài, cần cung cấp đầy đủ thức ăn và nước uống để đảm bảo sức khỏe cho gia súc non trong suốt quá trình vận chuyển.","reference":"Mục 3.2.1.2"},{"id":66,"text":"Hormone corticoit được giải phóng trong quá trình stress vận chuyển có tác động nào sau đây lên cơ thể của gia súc, gia cầm?","answers":["A. Làm giảm lượng đường trong máu và tăng quá trình đồng hóa","B. Làm tăng đường huyết và tăng sự phân giải prôtit.","C. Tăng khả năng miễn dịch và giảm stress trong cơ thể","D. Kích thích quá trình sinh trưởng và giảm phân giải prôtit."],"correct":1,"explanation":"Đáp án đúng là: Làm tăng đường huyết và tăng sự phân giải prôtit. Vì: Hormone corticoit, như cortizol và corticosterol, làm tăng đường huyết và tăng sự phân giải prôtit, dẫn đến sụt cân và ức chế quá trình sinh trưởng của gia súc, gia cầm.","reference":"Mục 3.3"},{"id":67,"text":"Sau khi vận chuyển, việc tiêu độc các dụng cụ và phương tiện phải tuân theo nguyên tắc nào?","answers":["A. Không cần vệ sinh nếu không có dịch bệnh","B. Thực hiện làm sạch từ ngoài vào trong","C. Sử dụng hóa chất tùy ý mà không cần quan tâm hướng dẫn.","D. Sử dụng hóa chất có phổ kháng khuẩn rộng và thân thiện với môi trường"],"correct":3,"explanation":"Đáp án đúng là: Sử dụng hóa chất có phổ kháng khuẩn rộng và thân thiện với môi trường Vì: Việc tiêu độc phải sử dụng hóa chất có phổ kháng khuẩn rộng, thân thiện với môi trường và thực hiện đúng hướng dẫn của nhà sản xuất.","reference":"Mục 3.2.3."},{"id":68,"text":"Yếu tố nào sau đây KHÔNG ảnh hưởng đến sự giảm thể trọng của gia súc, gia cầm trong quá trình vận chuyển?","answers":["A. Màu sắc của phương tiện vận chuyển.","B. Tốc độ của phương tiện vận chuyển.","C. Quãng đường vận chuyển.","D. Thời tiết khắc nghiệt."],"correct":0,"explanation":"Đáp án đúng là: Màu sắc của phương tiện vận chuyển. Vì: Màu sắc của phương tiện vận chuyển không có tác động trực tiếp đến sự giảm thể trọng của gia súc, gia cầm.","reference":"Mục 3.3"},{"id":69,"text":"Việc tiêu độc, khử trùng sau khi vận chuyển gia súc, gia cầm cần được thực hiện như thế nào để đảm bảo hiệu quả?","answers":["A. Tiến hành từ ngoài vào trong, từ thấp lên cao.","B. Chỉ vệ sinh, khử trùng phần sàn xe mà không cần xử lý các dụng cụ khác","C. Sử dụng bất kỳ loại hóa chất nào tiện lợi nhất","D. Thực hiện làm sạch cơ học trước khi tiêu độc khử trùng"],"correct":3,"explanation":"Đáp án đúng là: Thực hiện làm sạch cơ học trước khi tiêu độc khử trùng Vì : Trước khi tiêu độc khử trùng, cần làm sạch cơ học để loại bỏ bụi bẩn và chất thải, từ đó tăng hiệu quả của quá trình khử trùng.","reference":"Mục 3.2.3."},{"id":70,"text":"Yêu cầu nào dưới đây dành cho hệ thống che chắn (mui, bạt) trên phương tiện vận chuyển động vật?","answers":["A. Được làm từ vật liệu không thấm nước và có khoảng cách với động vật","B. Làm từ vật liệu dễ thấm nước để bảo vệ động vật.","C. Không cần sử dụng nếu trời không mưa","D. Phải tiếp xúc trực tiếp với động vật để che chắn tốt hơn."],"correct":0,"explanation":"Đáp án đúng là: Được làm từ vật liệu không thấm nước và có khoảng cách với động vật Vì: Mui, bạt cần được làm từ vật liệu không thấm nước và có khoảng cách với động vật để đảm bảo động vật đứng tự nhiên và được bảo vệ khỏi thời tiết khắc nghiệt.","reference":"Mục 3.2.1.2"},{"id":71,"text":"Stress vận chuyển ảnh hưởng đến cơ thể gia súc, gia cầm theo cách nào?","answers":["A. Không có tác động đáng kể đến sinh lý của gia súc, gia cầm","B. Tăng hệ miễn dịch, giúp gia súc, gia cầm khỏe mạnh hơn","C. Gây rối loạn hệ thống máu, chức năng hô hấp và làm giảm sức đề kháng","D. Làm giảm lượng hormone corticoit trong cơ thể"],"correct":3,"explanation":"Đáp án đúng là: Làm giảm lượng hormone corticoit trong cơ thể Vì: Stress vận chuyển làm gia tăng hormone corticoit, dẫn đến thay đổi sinh lý nhanh chóng, làm giảm sức đề kháng của gia súc, gia cầm đối với mầm bệnh.","reference":"Mục 3.3."},{"id":72,"text":"Sau khi vận chuyển gia súc, gia cầm, việc gì cần được thực hiện ngay?","answers":["A. Bán ngay gia súc, gia cầm.","B. Cho gia súc, gia cầm nghỉ ngơi.","C. Tiêu độc và vệ sinh phương tiện vận chuyển.","D. Không cần làm gì"],"correct":2,"explanation":"Đáp án đúng là: Tiêu độc và vệ sinh phương tiện vận chuyển. Vì: Việc tiêu độc và vệ sinh phương tiện vận chuyển là cần thiết để ngăn chặn sự lây lan của dịch bệnh và đảm bảo vệ sinh thú y.","reference":"Mục 3.2.3."},{"id":73,"text":"Tại sao tốc độ vận chuyển của phương tiện lại ảnh hưởng đến gia súc, gia cầm?","answers":["A. Không ảnh hưởng đến gia súc, gia cầm.","B. Vì tốc độ nhanh giúp hoàn thành việc vận chuyển sớm hơn","C. Tốc độ chậm làm gia súc, gia cầm thoải mái hơn","D. Tốc độ nhanh sẽ gây tác động xấu đến cơ thể gia súc, gia cầm"],"correct":3,"explanation":"Đáp án đúng là: Tốc độ nhanh sẽ gây tác động xấu đến cơ thể gia súc, gia cầm Vì : Nếu chạy với tốc độ nhanh, gia súc, gia cầm dễ bị sốc và stress, ảnh hưởng xấu đến sức khỏe của chúng.","reference":"Mục 3.3."},{"id":74,"text":"Điều kiện sống không bình thường trong quá trình vận chuyển làm ảnh hưởng như thế nào đến gia súc, gia cầm?","answers":["A. Không gây ảnh hưởng đáng kể đến quá trình đồng hóa và dị hóa","B. Chỉ ảnh hưởng đến quá trình ăn uống của gia súc, gia cầm.","C. Làm giảm quá trình đồng hóa, tăng quá trình dị hóa.","D. Làm tăng quá trình đồng hóa, giảm quá trình dị hóa"],"correct":2,"explanation":"Đáp án đúng là: Làm giảm quá trình đồng hóa, tăng quá trình dị hóa. Vì: Điều kiện sống không bình thường làm giảm quá trình đồng hóa và tăng quá trình dị hóa, gây ảnh hưởng đến sinh lý của gia súc, gia cầm.","reference":"Mục 3.3."},{"id":75,"text":"Thời gian vận chuyển gia súc, gia cầm vào lúc nào là tối ưu để giảm thiểu ảnh hưởng xấu từ thời tiết?","answers":["A. Khi trời lạnh","B. Vào những ngày có thời tiết mát mẻ hoặc vào ban đêm","C. Lúc trời nắng nóng để tránh lạnh quá","D. Vào ban ngày, bất kể thời tiết"],"correct":1,"explanation":"Đáp án đúng là: Vào những ngày có thời tiết mát mẻ hoặc vào ban đêm Vì: Thời tiết quá nóng hoặc quá lạnh đều tác động xấu đến gia súc, gia cầm. Vận chuyển vào những ngày mát mẻ hoặc ban đêm giúp giảm nguy cơ stress do thời tiết.","reference":"Mục 3.3"},{"id":76,"text":"Loại động vật nào sau đây được miễn kiểm dịch khi vận chuyển ra khỏi địa bàn cấp tỉnh?","answers":["A. Thỏ","B. Bò","C. Lợn","D. Ong mật"],"correct":3,"explanation":"Đáp án đúng là: Ong mật Vì: Ong mật là đối tượng được miễn kiểm dịch khi vận chuyển ra khỏi địa bàn cấp Tỉnh","reference":"Mục 4.2.1."},{"id":77,"text":"Thẻ tai dùng để đánh dấu gia súc vận chuyển trong nước có màu gì?","answers":["A. Màu đỏ","B. Màu vàng","C. Màu xanh","D. Màu trắng"],"correct":2,"explanation":"Đáp án đúng là: Màu xanh Vì: Thẻ tai dành cho gia súc vận chuyển trong nước được quy định có màu xanh, kích thước 4 cm x 5 cm.","reference":"Mục 4.4.2.1"},{"id":78,"text":"Trong trường hợp nào cơ quan kiểm dịch động vật nội địa nơi đến thực hiện kiểm dịch động vật?","answers":["A. Khi động vật không có Giấy chứng nhận kiểm dịch hợp lệ","B. Khi động vật có nguồn gốc từ cơ sở được công nhân an toàn dịch bệnh.","C. Khi động vật được vận chuyển với tốc độ nhanh","D. Khi động vật có nguồn gốc từ cơ sở chưa được công nhân an toàn dịch bệnh."],"correct":0,"explanation":"Đáp án đúng là: Khi động vật không có Giấy chứng nhận kiểm dịch hợp lệ Vì: Cơ quan kiểm dịch nơi đến chỉ thực hiện kiểm dịch lại khi phát hiện động vật không có Giấy chứng nhận kiểm dịch hợp lệ.","reference":"Mục 4.3.1.4."},{"id":79,"text":"Tại sao sản phẩm động vật xuất phát từ cơ sở chưa được công nhận an toàn dịch bệnh cần được kiểm tra điều kiện bao gói và bảo quản trước khi vận chuyển","answers":["A. Để đáp ứng yêu cầu của chủ hàng","B. Để đảm bảo sản phẩm không bị nhiễm vi sinh vật gây ô nhiễm","C. Để giảm chi phí vận chuyển.","D. Để tránh thất thoát sản phẩm trong quá trình vận chuyển"],"correct":1,"explanation":"Đáp án đúng là: Để đảm bảo sản phẩm không bị nhiễm vi sinh vật gây ô nhiễm Vì : Việc kiểm tra điều kiện bao gói và bảo quản giúp đảm bảo sản phẩm không bị nhiễm vi sinh vật gây ô nhiễm, tuân thủ các tiêu chuẩn vệ sinh thú y.","reference":"Mục 4.3.2.2."},{"id":80,"text":"Những bệnh nào cần được xét nghiệm bắt buộc đối với động vật vận chuyển ra khỏi địa bàn cấp tỉnh?","answers":["A. Dịch tả lợn, Tai Xanh, Tụ huyết trùng, Lở mồm long móng, Dịch tả lợn châu Phi","B. Lở mồm long móng, Dịch tả lợn, Dịch tả lợn Châu Phi, cúm gia cầm thể độc lực cao, Niu-cát-xơn","C. Cúm gia cầm, Giun xoắn, Lở mồm long móng, Dịch tả lợn, Nhiệt thán","D. Niu-cát-xơn, Dịch tả lợn châu Phi"],"correct":1,"explanation":"Đáp án đúng là: Lở mồm long móng, Dịch tả lợn, Dịch tả lợn Châu Phi, cúm gia cầm thể độc lực cao, Niu-cát-xơn Vì: Theo quy định, các bệnh cần xét nghiệm bắt buộc bao gồm: Lở mồm long móng, dịch tả lợn, dịch tả lợn Châu Phi, cúm gia cầm thể độc lực cao và bệnh Niu-cát-xơn.","reference":"Mục 4.3.1.2."},{"id":81,"text":"Số lượng mẫu lấy giám sát của các các bệnh ở động vật từ cơ sở chưa được công nhận an toàn dịch bệnh theo tỷ lệ lưu hành bệnh ước đoán là bao nhiêu %?","answers":["A. 10%","B. 5%","C. 20%","D. 15%"],"correct":0,"explanation":"Đáp án đúng là: 10% Vì : theo quy định, số lượng mẫu lấy giám sát theo tỷ lệ lưu hành bệnh ước đoán là 10 %","reference":"Mục 4.4.1"},{"id":82,"text":"Bệnh nào sau đây KHÔNG nằm trong danh sách bệnh cần xét nghiệm trong vận chuyển?","answers":["Lở mồm long móng","Cúm gia cầm độc lực cao","Dại","Dịch tả lợn Châu Phi"],"correct":2,"explanation":"Đáp án đúng là: Dại Vì: Theo quy định, bệnh Dại không nằm trong danh mục bệnh cần phải xét nghiệm khi vận chuyển","reference":"Mục 4.3.1.2"},{"id":83,"text":"Đối với động vật từ cơ sở đã được công nhận an toàn dịch bệnh, cơ quan kiểm dịch cần hoàn tất việc cấp Giấy chứng nhận kiểm dịch trong thời gian nào?","answers":["A. Trong vòng 03 ngày làm việc kể từ khi nhận được yêu cầu","B. Trong vòng 01 tuần kể từ khi nhận được yêu cầu","C. Trong vòng 01 ngày làm việc kể từ khi nhận được đăng ký kiểm dịch","D. Cấp ngay, không cần thời gian chờ"],"correct":2,"explanation":"Đáp án đúng là: Trong vòng 01 ngày làm việc kể từ khi nhận được đăng ký kiểm dịch Vì : Theo quy định, cơ quan kiểm dịch phải hoàn tất cấp Giấy chứng nhận kiểm dịch trong vòng 01 ngày làm việc đối với động vật xuất phát từ cơ sở đã được công nhận an toàn dịch bệnh.","reference":"Mục 4.3.1.3"},{"id":84,"text":"Thẻ tai màu xanh dành cho gia súc vận chuyển trong nước được quy định phải có kích thước và chất liệu cụ thể. Điều này ảnh hưởng như thế nào đến việc quản lý và theo dõi nguồn gốc động vật?","answers":["A. Đảm bảo tính thống nhất và dễ nhận dạng trên toàn quốc","B. Giúp tăng giá trị thương mại của gia súc","C. Tăng tính thẩm mỹ","D. Giảm thiểu chi phí sản xuất thẻ tai"],"correct":0,"explanation":"Đáp án đúng là: Đảm bảo tính thống nhất và dễ nhận dạng trên toàn quốc Vì: Thẻ tai với kích thước và chất liệu tiêu chuẩn giúp đảm bảo tính thống nhất, dễ nhận dạng, từ đó hỗ trợ việc quản lý và theo dõi nguồn gốc động vật hiệu quả trên toàn quốc.","reference":"Mục 4.4.2.1"},{"id":85,"text":"Khi vận chuyển động vật giống (trâu, bò, dê, cừu,...) ra khỏi địa bàn cấp tỉnh, phương pháp đánh dấu nào thường được sử dụng?","answers":["A. Xăm mình","B. Gắn vòng cổ kim loại","C. Phun thuốc màu lên chân","D. Gắn thẻ tai có mã số"],"correct":3,"explanation":"Đáp án đúng là: Gắn thẻ tai có mã số Vì: Gắn thẻ tai là phương pháp phổ biến, bền vững, dễ kiểm tra","reference":"Mục 4.4.2.1"},{"id":86,"text":"Trước khi vận chuyển động vật ra khỏi địa bàn cấp tỉnh, chủ hàng phải nộp đơn đăng ký kiểm dịch cho cơ quan nào?","answers":["A. Công an giao thông","B. Ủy ban nhân dân cấp tỉnh","C. Ủy ban nhân dân cấp huyện","D. Chi cục có chức năng quản lý chuyên ngành thú y cấp tỉnh"],"correct":3,"explanation":"Đáp án đúng là: Chi cục có chức năng quản lý chuyên ngành thú y cấp tỉnh Vì: Chi cục có chức năng quản lý chuyên ngành thú y cấp tỉnh được giao nhiệm vụ tiếp nhận đơn đăng ký kiểm dịch","reference":"Mục 4.3.1.1"},{"id":87,"text":"Trong các tình huống sau, trường hợp nào không bắt buộc phải đánh dấu riêng từng con?","answers":["A. Vận chuyển 50 con dê giống giữa hai tỉnh","B. Vận chuyển 200 con lợn nái từ tỉnh A đến tỉnh B","C. Vận chuyển 30 con bò sang tỉnh khác để nuôi sinh sản","D. Vận chuyển 1.000 con gà thịt từ tỉnh B sang tỉnh C"],"correct":3,"explanation":"Đáp án đúng là: Vận chuyển 1.000 con gà thịt từ tỉnh B sang tỉnh C Vì: Gia cầm không thuộc đối tượng phải đánh dấu khi vận chuyển ra khỏi địa bàn cấp Tỉnh","reference":"Mục 4.4.1"},{"id":88,"text":"Lợn vận chuyển đến cơ sở giết mổ phải được thực hiện biện pháp nào?","answers":["A. Đánh dấu bằng thẻ tai","B. Không cần biện pháp nào","C. Niêm phong phương tiện vận chuyển","D. Đánh dấu bằng xăm tai"],"correct":2,"explanation":"Đáp án đúng là: Niêm phong phương tiện vận chuyển Vì: Lợn vận chuyển đến cơ sở giết mổ cần niêm phong phương tiện vận chuyển bằng kẹp chì hoặc dây niêm phong..","reference":"Mục 4.4.2.3."},{"id":89,"text":"Quy trình thông báo cho cơ quan kiểm dịch nội địa nơi đến bao gồm thông tin nào để đảm bảo sự phối hợp giữa các cơ quan?","answers":["A. Danh sách các loại bệnh được xét nghiệm trên động vật","B. Số Giấy chứng nhận kiểm dịch, ngày cấp, số lượng hàng, mục đích sử dụng, biển kiểm soát phương tiện vận chuyển","C. Thời gian vận chuyển dự kiến và địa điểm giao hàng.","D. Thông tin về chủ hàng, điều kiện đóng gói sản phẩm"],"correct":1,"explanation":"Đáp án đúng là: Số Giấy chứng nhận kiểm dịch, ngày cấp, số lượng hàng, mục đích sử dụng, biển kiểm soát phương tiện vận chuyển Vì: Quy trình thông báo yêu cầu chi tiết thông tin về giấy chứng nhận, ngày cấp, số lượng, mục đích sử dụng, và biển kiểm soát phương tiện để đảm bảo giám sát hiệu quả..","reference":"Mục 4.3.1.2"},{"id":90,"text":"Mã số xăm trên tai lợn bao gồm thông tin nào?","answers":["A. Kích thước và cân nặng của lợn.","B. Tên chủ hàng và ngày vận chuyển","C. Mã số Chi cục quản lý chuyên ngành thú y cấp tỉnh và năm thực hiện việc xăm số","D. Mã số Chi cục quản lý chuyên ngành thú y cấp tỉnh, mã huyện và năm thực hiện việc xăm số"],"correct":3,"explanation":"Đáp án đúng là: Mã số Chi cục quản lý chuyên ngành thú y cấp tỉnh, mã huyện và năm thực hiện việc xăm số Vì: Mã số xăm trên tai lợn bao gồm mã số tỉnh, mã số huyện và năm vận chuyển để đảm bảo truy xuất nguồn gốc.","reference":"Mục 4.4.2.2."},{"id":91,"text":"Loài động vật nào sau đây KHÔNG thuộc diện phải kiểm dịch khi vận chuyển ra khỏi địa bàn cấp tỉnh?","answers":["A. Bò","B. Bồ câu","C. Gà rừng","D. Chuột đồng"],"correct":3,"explanation":"Đáp án đúng là: Chuột đồng Vì: Chuột đồng không nằm trong danh mục phải kiểm dịch","reference":"Mục 4.1.1"},{"id":92,"text":"Khi đánh dấu gia súc bằng thẻ tai, việc ghi mã số bao gồm những thông tin nào để đảm bảo theo dõi và nhận diện?","answers":["A. Mã số của Chi cục quản lý thú y cấp tỉnh, mã số huyện, năm bấm thẻ và số thứ tự của gia súc","B. Mã số của Chi cục quản lý thú y cấp tỉnh, mã số huyện, năm bấm thẻ","C. Tên của chủ hàng và ngày vận chuyển","D. Kích thước của gia súc và điều kiện vận chuyển."],"correct":0,"explanation":"Đáp án đúng là: Mã số của Chi cục quản lý thú y cấp tỉnh, mã số huyện, năm bấm thẻ và số thứ tự của gia súc Vì: Mã số ghi trên thẻ tai bao gồm mã số tỉnh, mã số huyện , năm cấp thẻ và số thứ tự của gia súc nhằm đảm bảo tính độc nhất và dễ dàng theo dõi nguồn gốc","reference":"Mục 4.4.2.1"},{"id":93,"text":"Mục đích chính của việc kiểm dịch động vật và sản phẩm động vật là:","answers":["A. Hỗ trợ thương mại","B. Tăng năng suất chăn nuôi","C. Phòng chống dịch bệnh, bảo vệ sức khỏe cộng đồng","D. Giảm giá thành sản phẩm"],"correct":2,"explanation":"Đáp án đúng là: Phòng chống dịch bệnh, bảo vệ sức khỏe cộng đồng Vì: Mục đích chính của kiểm dịch là phòng, chống lây lan dịch bệnh và bảo vệ sức khỏe người tiêu dùng, đồng thời đảm bảo an toàn trong vận chuyển và tiêu thụ.","reference":"Mục 4.1"},{"id":94,"text":"Sản phẩm động vật nào dưới đây thuộc diện miễn kiểm dịch khi vận chuyển ra khỏi địa bàn cấp tỉnh?","answers":["A. Thức ăn gia súc chứa thành phần động vật.","B. Thịt gia súc đông lạnh","C. Mật ong","D. Lông vũ chưa xử lý"],"correct":2,"explanation":"Đáp án đúng là: Mật ong Vì: Ong mật và các sản phẩm từ ong mật được miễn kiểm dịch, trừ khi có yêu cầu từ nước nhập khẩu.","reference":"Mục 4.2.1"},{"id":95,"text":"Mục đích chính của việc đánh dấu động vật trong quá trình vận chuyển là gì?","answers":["A. Đảm bảo kiểm tra cân nặng chính xác","B. Phục vụ truy xuất nguồn gốc và kiểm soát dịch bệnh","C. Hạn chế thất thoát khi vận chuyển","D. Phân biệt giống đực và cái"],"correct":1,"explanation":"Đáp án đúng là: Phục vụ truy xuất nguồn gốc và kiểm soát dịch bệnh Vì: Đánh dấu giúp truy xuất nguồn gốc, đối chiếu với hồ sơ kiểm dịch, đảm bảo động vật đúng xuất xứ và đã qua kiểm tra, tiêm phòng, giúp ngăn ngừa dịch bệnh lây lan.","reference":"Mục 4.4"},{"id":96,"text":"Niêm phong phương tiện vận chuyển cần ghi thông tin gì ở hàng trên dây niêm phong?","answers":["A. Tên chủ hàng và địa điểm vận chuyển","B. Kích thước phương tiện","C. Mã số chi cục có chức năng quản lý thú y cấp tỉnh và năm vận chuyển","D. 6 chữ số của dây niêm phong"],"correct":2,"explanation":"Đáp án đúng là: Mã số chi cục có chức năng quản lý thú y cấp tỉnh và năm vận chuyển Vì: Dây niêm phong cần ghi rõ mã số của chi cục thú y và năm vận chuyển để đảm bảo nhận dạng.","reference":"Mục 4.4.1"},{"id":97,"text":"Trong quy trình kiểm dịch sản phẩm động vật xuất phát từ cơ sở chưa được công nhận an toàn dịch bệnh, bước nào là cần thiết để đảm bảo yêu cầu vệ sinh thú y?","answers":["A. Chỉ kiểm tra giấy tờ xuất xứ sản phẩm","B. Niêm phong phương tiện mà không cần kiểm tra chi tiết","C. hông cần thực hiện kiểm tra nếu số lượng ít.","D. Kiểm tra tình trạng đóng gói và lấy mẫu kiểm tra vi sinh vật gây ô nhiễm"],"correct":3,"explanation":"Đáp án đúng là: Kiểm tra tình trạng đóng gói và lấy mẫu kiểm tra vi sinh vật gây ô nhiễm Vì: Việc kiểm tra tình trạng đóng gói và lấy mẫu kiểm tra vi sinh vật là cần thiết để đảm bảo sản phẩm động vật đáp ứng các yêu cầu vệ sinh thú y trước khi vận chuyển.","reference":"Mục 4.3.2.2."},{"id":98,"text":"Thẻ tai của gia súc được viết bằng mực màu gì?","answers":["A. Màu xanh","B. Màu đen","C. Màu đỏ","D. Màu vàng"],"correct":1,"explanation":"Đáp án đúng là: Màu đen Vì: Mực viết mã số trên thẻ tai gia súc phải là màu đen, không nhòe và khó tẩy xóa.","reference":"Mục 4.4.2.1"},{"id":99,"text":"Một doanh nghiệp vận chuyển 500 con vịt thịt đã đến tuổi xuất chuồng từ trại chăn nuôi từ tỉnh A đến lò mổ tại tỉnh B. Trường hợp này có cần đánh dấu vịt không?","answers":["A. Có, vì là gia cầm vận chuyển liên tỉnh","B. Có, nếu vịt chưa được tiêm phòng đầy đủ","C. Không cần vì số lượng lớn không thể đánh dấu hết","D. Không, vì không thuộc đối tượng phải đánh dấu"],"correct":3,"explanation":"Đáp án đúng là: Không, vì không thuộc đối tượng phải đánh dấu Vì: Theo quy định, gia cầm không thuộc đối tượng phải đánh dấu khi vận chuyển ra khỏi địa bàn cấp tỉnh","reference":"Mục 4.4.2.1"},{"id":100,"text":"Đối với động vật xuất phát từ cơ sở chăn nuôi chưa được giám sát dịch bệnh, nội dung kiểm dịch nào sau đây sẽ được cơ quan kiểm dịch động vật nội địa thực hiện?","answers":["A. Niêm phong phương tiện vận chuyển và cấp giấy chứng nhận kiểm dịch ngay lập tức","B. Chỉ kiểm tra giấy chứng nhận tiêm phòng","C. Kiểm tra lâm sàng và lấy mẫu xét nghiệm bệnh theo quy định","D. Yêu cầu chủ hàng tự tiêu độc khử trùng phương tiện"],"correct":2,"explanation":"Đáp án đúng là: Kiểm tra lâm sàng và lấy mẫu xét nghiệm bệnh theo quy định Vì: Cơ sở chăn nuôi chưa được giám sát dịch bệnh nên cần phải được kiểm tra lâm sàng và lấy mẫu xét nghiệm bệnh theo quy định.","reference":"Mục 4.3.1.2"},{"id":101,"text":"Tại sao hệ thống thông khí phải thiết kế theo hướng từ khu sạch sang khu bẩn?","answers":["A. Để ngăn ngừa ô nhiễm ngược","B. Để tiết kiệm năng lượng","C. Để lưu thông khí đều khắp cơ sở","D. Để làm mát khu bẩn"],"correct":0,"explanation":"Đáp án đúng là: Để ngăn ngừa ô nhiễm ngược Vì : Không khí từ khu sạch không được lẫn với khu bẩn để giữ vệ sinh cho sản phẩm sau giết mổ.","reference":"Mục 5.2.2.5"},{"id":102,"text":"Khu sạch trong cơ sở giết mổ là nơi diễn ra hoạt động nào sau đây?","answers":["Moi phủ tạng","Tắm, gây choáng động vật","Pha lóc, đóng gói thịt","Cạo lông đối với lợn"],"correct":2,"explanation":"Đáp án đúng là: Pha lóc, đóng gói thịt Vì: Khu sạch bao gồm các hoạt động sau khi giết mổ như: kiểm tra thân thịt, đóng dấu, pha lóc, đóng gói, làm lạnh, không còn nguy cơ nhiễm bẩn từ động","reference":"Mục 5.1.1"},{"id":103,"text":"Đối với lợn, dê, cừu, cầu dẫn từ phương tiện vận chuyển xuống cơ sở giết mổ không được vượt quá độ dốc bao nhiêu?","answers":["A. 15°","B. 10°","C. 20°","D. 25°"],"correct":0,"explanation":"Đáp án đúng là: 15° Vì: Độ dốc cầu dẫn phù hợp giúp đảm bảo an toàn, tránh té ngã, chấn thương cho vật nuôi.","reference":"Mục 5.2.2.1"},{"id":104,"text":"Tường phía trong khu vực giết mổ cần đảm bảo tiêu chuẩn nào sau đây?","answers":["A. Làm bằng gạch không trát để thoáng khí","B. Làm bằng kính để dễ quan sát","C. Làm bằng vật liệu chắc chắn, nhẵn, dễ làm sạch","D. Làm bằng gỗ để hấp thụ nước tốt"],"correct":2,"explanation":"Đáp án đúng là: Làm bằng vật liệu chắc chắn, nhẵn, dễ làm sạch Vì: Tường bên trong phải đảm bảo chống ẩm mốc, dễ vệ sinh và khử trùng, nhằm đáp ứng yêu cầu về vệ sinh thú y.","reference":"Mục 5.2.2.3."},{"id":105,"text":"Tại khu vực giết mổ, khoảng cách giữa sàn đến trần tại nơi pha lóc thịt tối thiểu là:","answers":["A. 3,6 m","B. 4,8 m","C. 3,0 m","D. 2,4 m"],"correct":2,"explanation":"Đáp án đúng là: 3,0 m Vì: Đảm bảo đủ không gian, thông thoáng và phù hợp với thiết bị treo thịt","reference":"Mục 5.2.2.3"},{"id":106,"text":"Cơ sở giết mổ động vật tập trung phải cách biệt tối thiểu bao nhiêu mét với khu dân cư, trường học, bệnh viện?","answers":["A. 300 m","B. 200 m","C. 500 m","D. 1000 m"],"correct":2,"explanation":"Đáp án đúng là: 500 m Vì: Theo quy định, cơ sở giết mổ phải cách khu dân cư, trường học, bệnh viện, nơi tập trung đông người... ít nhất 500 mét để hạn chế ô nhiễm môi trường và đảm bảo an toàn vệ sinh.","reference":"Mục 5.1.2"},{"id":107,"text":"Trang thiết bị, dụng cụ trong khu giết mổ phải làm bằng vật liệu nào sau đây?","answers":["A. Gỗ ép","B. Nhôm thô","C. Vật liệu không gỉ, dễ khử trùng","D. Nhựa màu để dễ nhận biết"],"correct":2,"explanation":"Đáp án đúng là: Vật liệu không gỉ, dễ khử trùng Vì : Yêu cầu nhằm đảm bảo vệ sinh và kéo dài tuổi thọ thiết bị.","reference":"Mục 5.2.4"},{"id":108,"text":"Kho lạnh trong cơ sở giết mổ cần đảm bảo nhiệt độ cấp đông là:","answers":["A. -10°C đến -20°C","B. -18°C đến -20°C","C. -25°C đến -30°C","D. -40°C đến -50°C"],"correct":3,"explanation":"Đáp án đúng là: -40°C đến -50°C Vì: Đây là ngưỡng nhiệt độ quy định giúp cấp đông nhanh và hiệu quả.","reference":"Mục 5.2.2.4"},{"id":109,"text":"Đối với khu vực giết mổ lợn, chiều cao tối thiểu từ sàn đến trần tại khu vực đun nước nóng và làm lông là bao nhiêu?","answers":["A. 5,0 m","B. 3,0 m","C. 2,0 m","D. 4,8 m"],"correct":3,"explanation":"Đáp án đúng là: 4,8 m Vì: Khoảng cách này giúp đảm bảo thông thoáng, giảm nguy cơ tích tụ hơi nước và ô nhiễm môi trường không khí tại khu vực xử lý nhiệt.","reference":"Mục 5.2.2.3"},{"id":110,"text":"Trong cơ sở giết mổ, đường nhập động vật sống và xuất thịt sau giết mổ cần được bố trí như thế nào?","answers":["A. Riêng biệt hoàn toàn","B. Sử dụng chung một đường cho thuận tiện","C. Đường nhập và xuất thịt không cần quan tâm","D. Có thể giao nhau nếu cần"],"correct":0,"explanation":"Đáp án đúng là: Riêng biệt hoàn toàn Vì: Đây là yêu cầu bắt buộc để tránh lây nhiễm chéo, đảm bảo vệ sinh thú y và an toàn thực phẩm.","reference":"Mục 5.2.1"},{"id":111,"text":"Một cơ sở giết mổ bố trí hệ thống thoát nước thải theo hướng chảy từ khu bẩn sang khu sạch. Vi phạm lớn nhất trong thiết kế này là gì?","answers":["A. Làm tăng nguy cơ nhiễm chéo và mất an toàn thực phẩm","B. Tốn kém chi phí xử lý nước thải","C. Gây ngập úng trong khu sản xuất","D. Không đủ tốc độ thoát nước"],"correct":0,"explanation":"Đáp án đúng là: Làm tăng nguy cơ nhiễm chéo và mất an toàn thực phẩm Vì: Theo quy định, hệ thống nước thải phải chảy từ khu sạch đến khu bẩn. Nếu làm ngược lại sẽ làm tăng nguy cơ lây nhiễm mầm bệnh từ chất thải sang sản phẩm đã xử lý.","reference":"Mục 5.2.2.6"},{"id":112,"text":"Để tránh nhiễm chéo trong cơ sở giết mổ, khu sạch và khu bẩn cần được bố trí như thế nào?","answers":["A. Không cần thiết phải phân biệt","B. Tách biệt, bảo đảm nguyên tắc một chiều","C. Liền kề để dễ giám sát","D. Cùng một không gian, có vách ngăn"],"correct":1,"explanation":"Đáp án đúng là: Tách biệt, bảo đảm nguyên tắc một chiều Vì: Việc tách biệt này giúp giảm nguy cơ ô nhiễm và lây lan mầm bệnh.","reference":"Mục 5.2.1."},{"id":113,"text":"Tại cơ sở giết mổ, sàn nhà khu giết mổ cần có đặc điểm gì sau đây?","answers":["A. Có lót thảm chống ồn","B. Gồ ghề để không trơn","C. Chống trơn trượt, dễ làm sạch, dốc thoát nước","D. Trơn láng và bóng loáng"],"correct":2,"explanation":"Đáp án đúng là: Chống trơn trượt, dễ làm sạch, dốc thoát nước Vì: Sàn nhà cần đảm bảo vệ sinh và an toàn lao động, tránh trơn trượt gây tai nạn và không để nước ứ đọng.","reference":"Mục 5.2.2.3"},{"id":114,"text":"Điều nào sau đây là bắt buộc đối với hệ thống thông khí của cơ sở giết mổ?","answers":["A. Cần lắp đặt hệ thống lọc khí để loại bỏ các mùi và vi khuẩn phát sinh trong quá trình giết mổ.","B. Hệ thống thông khí phải được thiết kế để bảo đảm không khí lưu thông từ khu bẩn sang khu sạch.","C. Cửa thông gió của cơ sở phải có lưới bảo vệ chống côn trùng và động vật gây hại.","D. Phải sử dụng hệ thống thông gió cơ học để đảm bảo lưu lượng khí tươi liên tục."],"correct":2,"explanation":"Đáp án đúng là: Cửa thông gió của cơ sở phải có lưới bảo vệ chống côn trùng và động vật gây hại. Vì: Cửa thông gió của cơ sở phải có lưới bảo vệ chống côn trùng và động vật gây hại","reference":"Mục 5.2.2.5"},{"id":115,"text":"Yêu cầu nào sau đây không phải là một trong những quy định về địa điểm xây dựng cơ sở giết mổ?","answers":["A. Phải có hệ thống xử lý nước thải đạt tiêu chuẩn môi trường trước khi thải ra môi trường xung quanh.","B. Phải cách biệt tối thiểu 500 m với khu dân cư, trường học, bệnh viện, nơi thường xuyên tập trung đông người, sông, suối, nguồn cung cấp nước sinh hoạt...","C. Phải nằm trong quy hoạch được Ủy ban nhân dân cấp tỉnh phê duyệt và được cơ quan có thẩm quyền cấp phép.","D. Phải cách biệt tối thiểu 01 km với trại chăn nuôi, chợ buôn bán gia súc, gia cầm và các nguồn gây ô nhiễm như bãi rác, nghĩa trang, nhà máy thải bụi và hóa chất độc hại."],"correct":0,"explanation":"Đáp án đúng là: Phải có hệ thống xử lý nước thải đạt tiêu chuẩn môi trường trước khi thải ra môi trường xung quanh. Vì: Hệ thống xử lý nước thải đạt tiêu chuẩn môi trường, đây là một yêu cầu quan trọng nhưng thuộc mục Hệ thống thu gom chất thải\" chứ không phải là yêu cầu về địa điểm xây dựng.","reference":"Mục 5.2.2.6."},{"id":116,"text":"Một cơ sở giết mổ bố trí dụng cụ sát trùng dao tại khu kiểm tra thịt có nhiệt độ nước chỉ đạt 65°C. Vi phạm chính của cơ sở này là gì?","answers":["A. Không đủ nhiệt độ để rửa sạch dụng cụ","B. Làm tăng thời gian vệ sinh sau giết mổ","C. Không đảm bảo nhiệt độ sát trùng theo quy định","D. Gây hư hỏng dụng cụ nhanh chóng"],"correct":2,"explanation":"Đáp án đúng là: Không đảm bảo nhiệt độ sát trùng theo quy định Vì : Nhiệt độ sát trùng dụng cụ phải đạt tối thiểu 82°C. Dưới mức này vi sinh vật không bị tiêu diệt hoàn toàn, làm mất an toàn vệ sinh sản phẩm.","reference":"Mục 5.2.4"},{"id":117,"text":"Trong thiết kế chuồng nhốt động vật chờ giết mổ, yếu tố nào sau đây không đúng với yêu cầu kỹ thuật?","answers":["A. Có chuồng chứa gấp đôi công suất giết mổ","B. Diện tích đảm bảo theo từng loại vật nuôi","C. Dùng hệ thống uống nước cưỡng bức để tiết kiệm","D. Có mái che, nền thoát nước tốt"],"correct":2,"explanation":"Đáp án đúng là: Dùng hệ thống uống nước cưỡng bức để tiết kiệm Vì: Cấm sử dụng hệ thống uống nước cưỡng bức, vì động vật phải được tiếp cận nước tự do nhằm giảm stress trước khi giết mổ, đảm bảo phúc lợi động vật và chất lượng thịt.","reference":"Mục 5.2.2.2"},{"id":118,"text":"Kho lạnh trong cơ sở giết mổ cần duy trì nhiệt độ bảo quản thịt là:","answers":["A. 15-20°C","B. 25-30°C","C. 0-5°C","D. -10 đến -15°C"],"correct":2,"explanation":"Đáp án đúng là: 0-5°C Vì: Đây là mức nhiệt độ bảo quản lạnh đúng quy định giúp thịt giữ được độ tươi và hạn chế sự phát triển của vi sinh vật gây hỏng.","reference":"Mục 5.2.2.4"},{"id":119,"text":"Động vật khi nhập vào cơ sở giết mổ phải được cung cấp nước uống như thế nào","answers":["A. Không cần thiết, vì sẽ giết mổ ngay","B. Chỉ cần uống nếu thời tiết nóng","C. Chỉ cần cho uống trước khi giết mổ vài phút","D. Phải được tiếp cận nước dễ dàng mọi lúc"],"correct":3,"explanation":"Đáp án đúng là: Phải được tiếp cận nước dễ dàng mọi lúc Vì: Đảm bảo động vật có thể uống nước tự do trong thời gian chờ giết mổ là yêu cầu bắt buộc để tránh sốc nhiệt và giảm stress cho vật nuôi.","reference":"Mục 5.2.2.2."},{"id":120,"text":"Cường độ ánh sáng trắng tại nơi khám thịt và kiểm tra lần cuối cần đạt:","answers":["A. 400 Lux","B. 500 Lux","C. 200 Lux","D. 300 Lux"],"correct":1,"explanation":"Đáp án đúng là: 500 Lux Vì: Ánh sáng đủ mạnh giúp nhân viên thú y kiểm tra kỹ lưỡng chất lượng thịt","reference":"Mục 5.2.3"},{"id":121,"text":"Đối với trâu, bò, ngựa cầu dẫn từ phương tiện vận chuyển xuống cơ sở giết mổ không được vượt quá độ dốc bao nhiêu?","answers":["A. 25°","B. 15°","C. 10°","D. 20°"],"correct":3,"explanation":"Đáp án đúng là: 20° Vì: Độ dốc cầu dẫn phù hợp giúp đảm bảo an toàn, tránh té ngã, chấn thương cho vật nuôi.","reference":"Mục 5.2.2.1"},{"id":122,"text":"Theo quy định, cơ sở giết mổ phải cách trường học, bệnh viện bao xa?","answers":["A. Tối thiểu 500 m","B. Tối thiểu 1.000 m","C. Tối thiểu 100 m","D. Tối thiểu 300 m"],"correct":0,"explanation":"Đáp án đúng là: Tối thiểu 500 m Vì: Cơ sở giết mổ phải cách các khu vực dân cư, trường học, bệnh viện... ít nhất 500 m để đảm bảo vệ sinh và an toàn dịch tễ.","reference":"Mục 5.1.2"},{"id":123,"text":"Trong quá trình thiết kế khu vực giết mổ, việc xây nghiêng hoặc ốp lòng máng nơi tiếp giáp giữa mặt sàn và tường nhằm mục đích chính gì?","answers":["A. Ngăn ngừa sự tích tụ bụi bẩn, ẩm mốc và tạo điều kiện dễ dàng cho việc làm sạch, khử trùng.","B. Tăng tính thẩm mỹ cho khu vực giết mổ.","C. Tạo điều kiện thuận lợi cho việc lắp đặt các thiết bị chuyên dụng.","D. Giảm tiếng ồn phát sinh trong quá trình giết mổ"],"correct":0,"explanation":"Đáp án đúng là: Ngăn ngừa sự tích tụ bụi bẩn, ẩm mốc và tạo điều kiện dễ dàng cho việc làm sạch, khử trùng. Vì: Mục đích nhằm loại bỏ các góc vuông nơi dễ tích tụ bụi bẩn, vi khuẩn và khó vệ sinh, từ đó đảm bảo vệ sinh an toàn thực phẩm và ngăn ngừa sự phát triển của ẩm mốc","reference":"Mục 5.2.2.3"},{"id":124,"text":"Kích thước tối thiểu của hố sát trùng tại cổng cơ sở giết mổ là:","answers":["A. 0,6 m x 0,4 m x 0,1 m","B. 0,5 m x 0,3 m x 0,1 m","C. 1,0 m x 0,5 m x 0,2 m","D. 0,8 m x 0,4 m x 0,15 m"],"correct":3,"explanation":"Đáp án đúng là: 0,8 m x 0,4 m x 0,15 m Vì: Đây là kích thước tối thiểu của hố sát trùng theo quy định, dùng để khử trùng người và xe khi ra vào cơ sở giết mổ.","reference":"Mục 5.2.1"},{"id":125,"text":"Điều nào sau đây là sai về yêu cầu đối với nơi nhốt giữ động vật chờ giết mổ?","answers":["A. Có hệ thống cung cấp nước cho tất cả động vật uống trước khi giết mổ; động vật phải được tiếp cận nước dễ dàng bất kỳ lúc nào chúng muốn trong nơi nhốt giữ và không được bố trí hệ thống uống nước cưỡng bức.","B. Có mái che, nền được làm bằng các vật liệu bền, không trơn trượt, dễ thoát nước, dễ làm sạch, khử trùng và được chia thành các ô chuồng.","C. Phải đảm bảo diện tích tối thiểu 0,5 m²/con để nhốt giữ lợn có trọng lượng 100-120 kg.","D. Có chuồng hoặc lồng với diện tích tối thiểu đủ để nhốt giữ số lượng động vật gấp đôi công suất giết mổ của cơ sở, bảo đảm động vật không bị sốc nhiệt."],"correct":2,"explanation":"Đáp án đúng là: Phải đảm bảo diện tích tối thiểu 0,5 m²/con để nhốt giữ lợn có trọng lượng 100-120 kg. Vì: diện tích tối thiểu để nhốt giữ lợn, dê, cừu (trọng lượng 100-120 kg) là 0,8 m²/con, không phải 0,5 m²/con.","reference":"Mục 5.2.2.2"},{"id":126,"text":"Tại sao dầu mỡ phải được loại bỏ trước khi vào bể sinh học?","answers":["A. Làm giảm độ kiềm","B. Gây ức chế hoạt động của vi sinh vật","C. Tăng nhiệt độ nước","D. Làm mất màu nước"],"correct":1,"explanation":"Đáp án đúng là: Gây ức chế hoạt động của vi sinh vật Vì : Dầu mỡ gây màng, thiếu oxy, làm chết vi sinh vật trong bể hiếu/kỵ khí.","reference":"Mục 6.1.8.4"},{"id":127,"text":"Tác động tiêu cực lớn nhất nếu không có hệ thống tách dầu mỡ trước xử lý sinh học là gì?","answers":["A. Tạo bọt trên mặt nước","B. Giảm hiệu suất xử lý sinh học do vi sinh vật bị ức chế","C. Làm tăng pH trong bể sinh học","D. Làm tăng nhiệt độ nước"],"correct":1,"explanation":"Đáp án đúng là: Giảm hiệu suất xử lý sinh học do vi sinh vật bị ức chế Vì : Lớp dầu mỡ gây thiếu oxy, cản trở vi sinh vật hoạt động trong bể hiếu khí và kỵ khí.","reference":"Mục 6.1.8.4"},{"id":128,"text":"Hoạt động giết mổ tại cơ sở phải được kiểm soát bởi?","answers":["A. Nhân viên thú y được cấp phép","B. Công nhân kỹ thuật","C. Chủ cơ sở"
